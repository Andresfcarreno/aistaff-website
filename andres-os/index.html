<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#040807">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<!-- ARTIFACT:BEGIN -->
<title>Andrés OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  /* paleta (independiente del tema): brillante para oscuro, profunda para claro */
  --p1-b:#3CF2A6; --p1-d:#0B8F5E;
  --p2-b:#F6C667; --p2-d:#9A6A0C;
  --p3-b:#C9FFE6; --p3-d:#0A5A40;

  /* tema claro (base) */
  --bg:#E7EEEB; --bg-2:#F5F8F6;
  --ink:#0B1613; --ink-2:#3C4F49; --ink-3:#6A7C76;
  --glass:rgba(255,255,255,.56); --glass-2:rgba(255,255,255,.78); --glass-3:rgba(255,255,255,.9);
  --line:rgba(12,40,32,.09); --line-2:rgba(12,40,32,.17);
  --hi:rgba(255,255,255,.85);
  --shadow:0 18px 50px -18px rgba(20,50,40,.28), 0 2px 6px rgba(20,50,40,.06);
  --good:#0C8A56; --warn:#A76800; --bad:#C3312F;
  --a1:var(--p1-d); --a2:var(--p2-d); --a3:var(--p3-d);
  --on-a1:#FFFFFF;
  --glow:0;
  --grid:rgba(12,40,32,.05);
  color-scheme:light;

  --r-lg:24px; --r-md:16px; --r-sm:11px;
  --f-display:"Syne", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
:root[data-palette="solar"]{ --p1-b:#FF8B3D; --p1-d:#C2500A; --p2-b:#FF5A93; --p2-d:#B8175A; --p3-b:#FFE0C2; --p3-d:#7A2E05; }
:root[data-palette="amatista"]{ --p1-b:#AE8FFF; --p1-d:#6A42DD; --p2-b:#5EE3E8; --p2-d:#0B8A91; --p3-b:#EAE0FF; --p3-d:#37208F; }
:root[data-palette="glaciar"]{ --p1-b:#7FCBFF; --p1-d:#1766AD; --p2-b:#A7F3DA; --p2-d:#10806A; --p3-b:#F2F8FF; --p3-d:#0B3761; }

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#030605; --bg-2:#07100E;
    --ink:#E8F1EE; --ink-2:#A6B7B1; --ink-3:#6B7E78;
    --glass:rgba(16,26,24,.5); --glass-2:rgba(24,36,33,.66); --glass-3:rgba(30,44,40,.9);
    --line:rgba(210,255,240,.075); --line-2:rgba(210,255,240,.15);
    --hi:rgba(255,255,255,.07);
    --shadow:0 24px 60px -20px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.35);
    --good:#3DE59C; --warn:#F5BD4F; --bad:#FF6F6A;
    --a1:var(--p1-b); --a2:var(--p2-b); --a3:var(--p3-b);
    --on-a1:#03110B; --glow:1; --grid:rgba(210,255,240,.035);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#030605; --bg-2:#07100E;
  --ink:#E8F1EE; --ink-2:#A6B7B1; --ink-3:#6B7E78;
  --glass:rgba(16,26,24,.5); --glass-2:rgba(24,36,33,.66); --glass-3:rgba(30,44,40,.9);
  --line:rgba(210,255,240,.075); --line-2:rgba(210,255,240,.15);
  --hi:rgba(255,255,255,.07);
  --shadow:0 24px 60px -20px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.35);
  --good:#3DE59C; --warn:#F5BD4F; --bad:#FF6F6A;
  --a1:var(--p1-b); --a2:var(--p2-b); --a3:var(--p3-b);
  --on-a1:#03110B; --glow:1; --grid:rgba(210,255,240,.035);
  color-scheme:dark;
}

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ============ ATMÓSFERA ============ */
.atmo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.atmo::before{content:"";position:absolute;inset:-20%;
  background:
    radial-gradient(40% 35% at 18% 12%, color-mix(in oklab, var(--a1) 22%, transparent), transparent 70%),
    radial-gradient(38% 38% at 88% 18%, color-mix(in oklab, var(--a2) 16%, transparent), transparent 70%),
    radial-gradient(50% 45% at 50% 105%, color-mix(in oklab, var(--a1) 14%, transparent), transparent 70%);
  filter:blur(20px);animation:drift 38s ease-in-out infinite alternate}
.atmo::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 80%)}
#stars{position:absolute;inset:0;width:100%;height:100%;opacity:calc(.25 + var(--glow) * .6)}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-3%,2%,0) scale(1.08)}}

/* ============ SHELL ============ */
.shell{position:relative;z-index:1;max-width:1720px;margin:0 auto;padding-inline:18px;padding-block:0 48px}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:14px;padding-block:12px;margin-bottom:14px}
.top::before{content:"";position:absolute;inset:0 -18px;background:linear-gradient(var(--bg) 30%, color-mix(in oklab, var(--bg) 0%, transparent));opacity:.92;z-index:-1;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto;text-decoration:none;overflow:hidden}
.mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;position:relative;
  background:conic-gradient(from 210deg, var(--a1), var(--a2), var(--a3), var(--a1));padding:1.5px}
.mark span{width:100%;height:100%;border-radius:11.5px;background:var(--bg-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.02em}
.mark span b{background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.top-mid{flex:1 1 auto;display:flex;justify-content:center;min-width:0}
.pulse-line{display:flex;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;max-width:100%}
.pulse-line .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 calc(10px * var(--glow)) var(--good);flex:none}
.pulse-line .sep{opacity:.35}
.top-actions{display:flex;align-items:center;gap:6px}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);color:var(--ink-2);transition:color .2s, border-color .2s, background .2s;position:relative;flex:none}
.ibtn:hover{color:var(--ink);border-color:var(--line-2)}
.ibtn[aria-pressed="true"]{color:var(--on-a1);background:var(--a1);border-color:transparent}
.ibtn svg{width:18px;height:18px}
.seg{display:flex;padding:3px;border-radius:12px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.seg button{border:0;background:none;padding:6px 9px;border-radius:9px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--glass-3);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ============ GRID ============ */
.grid{display:grid;grid-template-columns:minmax(270px,340px) minmax(0,1fr) minmax(280px,370px);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.center{min-width:0;display:flex;flex-direction:column;gap:16px}

/* panel de vidrio */
.panel{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:inset 0 1px 0 var(--hi), var(--shadow);padding:16px 16px 16px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;min-height:22px}
.ph h2{margin:0;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.ph h2 svg{width:14px;height:14px;color:var(--a1)}
.ph .meta{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.link-btn{border:0;background:none;padding:2px 4px;color:var(--a1);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em}
.link-btn:hover{text-decoration:underline}

/* chips / pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);border-color:color-mix(in oklab, var(--good) 35%, transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in oklab, var(--warn) 35%, transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in oklab, var(--bad) 35%, transparent)}
.pill.muted{color:var(--ink-3)}
.pill.plain::before{display:none}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:color-mix(in oklab, var(--a2) 16%, transparent);color:var(--ink-2)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass-2);padding:8px 13px;font-weight:600;font-size:13.5px;color:var(--ink);transition:transform .15s, background .2s, border-color .2s}
.btn:hover{border-color:color-mix(in oklab, var(--a1) 50%, var(--line-2))}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--a1),color-mix(in oklab, var(--a1) 60%, var(--a2)));color:var(--on-a1);border-color:transparent;box-shadow:0 8px 22px -10px var(--a1)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:10px}
.btn svg{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.in{width:100%;min-width:0;border-radius:11px;border:1px solid var(--line-2);background:var(--glass-2);padding:8px 11px;font-size:14px;outline:none;transition:border-color .2s, box-shadow .2s}
.in:focus{border-color:var(--a1);box-shadow:0 0 0 3px color-mix(in oklab, var(--a1) 22%, transparent)}
textarea.in{resize:vertical;min-height:70px;line-height:1.45}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:120px}

/* barras de progreso */
.bar{position:relative;height:8px;border-radius:999px;background:color-mix(in oklab, var(--ink) 9%, transparent);overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:linear-gradient(90deg,var(--a1),var(--a2));width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:5px}
.bar.proj>i{background:linear-gradient(90deg,var(--pc),color-mix(in oklab, var(--pc) 55%, var(--a3)))}

/* ============ NÚCLEO ============ */
.core-wrap{padding:0;overflow:hidden}
.core{position:relative;height:clamp(440px,64vh,660px);touch-action:manipulation}
.core canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.core .corebtn{position:absolute;left:50%;top:48%;width:38%;height:62%;transform:translate(-50%,-50%);border-radius:50%;border:0;background:transparent;z-index:3}
.core .corebtn:focus-visible{outline:1px dashed var(--a1);outline-offset:8px}
.core-status{position:absolute;left:18px;top:16px;z-index:4;display:flex;flex-direction:column;gap:4px}
.state-chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.state-chip i{width:8px;height:8px;border-radius:50%;background:var(--a1);box-shadow:0 0 calc(14px * var(--glow)) var(--a1);animation:beat 2.4s ease-in-out infinite}
.core[data-state="listening"] .state-chip i{background:var(--a2);animation-duration:.8s}
.core[data-state="thinking"] .state-chip i{animation-duration:.5s}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.55}}
.state-hint{font-size:12.5px;color:var(--ink-3)}
.core-meta{position:absolute;right:18px;top:16px;z-index:4;text-align:right;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);line-height:1.7;text-transform:uppercase}
.core-meta b{color:var(--ink-2);font-weight:500}
.orbit{position:absolute;z-index:4;transition:opacity .4s, border-color .2s, transform .2s;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;padding:6px 11px 6px 7px;border-radius:999px;border:1px solid color-mix(in oklab, var(--pc) 40%, var(--line));background:var(--glass-2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--ink);transition:border-color .2s, transform .2s;will-change:left,top}
.core.has-cap .orbit{opacity:.18}
.orbit:hover{border-color:var(--pc);transform:translate(-50%,-50%) scale(1.05)}
.orbit .ob-ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab, var(--pc) 22%, transparent);color:var(--pc)}
.orbit .ob-ic svg{width:13px;height:13px}
.orbit .ob-pct{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);font-weight:500}
.captions{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);width:min(760px,calc(100% - 36px));z-index:4;text-align:center;pointer-events:none}
.cap-user{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--ink-3);min-height:18px;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-ai{font-family:var(--f-display);font-weight:600;font-size:clamp(16px,1.6vw,21px);line-height:1.35;letter-spacing:-.005em;color:var(--ink);text-wrap:balance;max-height:5.4em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;text-shadow:0 0 18px var(--bg), 0 0 2px var(--bg)}
.cap-ai:empty{display:none}
.composer{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(700px,calc(100% - 28px));z-index:5;display:flex;align-items:center;gap:8px;padding:6px;border-radius:18px;background:var(--glass-2);border:1px solid var(--line-2);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:var(--shadow)}
.composer input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:8px 8px;font-size:15px}
.composer input::placeholder{color:var(--ink-3)}
.mic{width:42px;height:42px;border-radius:13px;border:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on-a1);flex:none;position:relative}
.mic svg{width:19px;height:19px}
.mic[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:2px solid var(--a1);animation:ring 1.1s ease-out infinite}
.mic[disabled]{opacity:.35;cursor:not-allowed}
@keyframes ring{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.18)}}
.cbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--ink-2);flex:none}
.cbtn svg{width:17px;height:17px}
.cbtn:hover{color:var(--ink);border-color:var(--line-2)}
.brain-badge{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}

/* ============ FRENTES ============ */
.fronts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.front{--pc:var(--a1);position:relative;text-align:left;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 var(--hi), var(--shadow);transition:transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s;min-width:0;overflow:hidden}
.front::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 100% 0%, color-mix(in oklab, var(--pc) 18%, transparent), transparent 60%);pointer-events:none}
.front:hover{transform:translateY(-3px);border-color:color-mix(in oklab, var(--pc) 45%, var(--line))}
.fr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative}
.fr-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--pc);background:color-mix(in oklab, var(--pc) 16%, transparent);border:1px solid color-mix(in oklab, var(--pc) 30%, transparent)}
.fr-ic svg{width:18px;height:18px}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{fill:none;stroke:color-mix(in oklab, var(--ink) 10%, transparent);stroke-width:4}
.ring .rv{fill:none;stroke:var(--pc);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:600}
.fr-name{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.15;letter-spacing:-.01em;position:relative}
.fr-tag{font-size:12.5px;color:var(--ink-3);line-height:1.35;position:relative;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.fr-next{position:relative;font-size:12.5px;color:var(--ink-2);border-top:1px dashed var(--line-2);padding-top:9px;display:flex;gap:7px;align-items:flex-start;min-height:3.6em}
.fr-next svg{width:13px;height:13px;flex:none;margin-top:3px;color:var(--pc)}
.fr-next span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fr-foot{position:relative;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}

/* ============ LISTAS ============ */

/* TRADING */

/* sesiones y llamadas */

.dr-top .fr-ic{width:44px;height:44px;border-radius:14px}

.dr-title p{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.tabs{display:flex;gap:4px;margin-top:16px;overflow-x:auto;scrollbar-width:none;position:relative}
.tabs button{border:0;background:none;padding:9px 12px;border-radius:10px 10px 0 0;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}

.dr-body{flex:1;overflow-y:auto;padding:18px 22px 30px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{padding:12px;border-radius:14px;border:1px solid var(--line);background:color-mix(in oklab, var(--ink) 3%, transparent)}
.kpi .l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.goal{padding:12px;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.goal-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.goal-h b{font-size:14px;font-weight:600}
.goal-h span{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.goal .row input{max-width:110px}
.tl{position:relative;padding-left:20px;display:flex;flex-direction:column;gap:12px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1.5px;background:var(--line-2)}

.tl-i .s{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:10px;border:1px solid var(--line-2);font-size:12.5px;text-decoration:none;color:var(--ink-2)}

.links a svg{width:12px;height:12px}
.ex{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);border:1px dashed color-mix(in oklab, var(--warn) 50%, transparent);border-radius:6px;padding:1px 6px;margin-left:6px}

/* modal */
.modal{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);width:min(720px,calc(100% - 24px));max-height:calc(100% - 40px);display:flex;flex-direction:column;background:var(--glass-2);backdrop-filter:blur(34px) saturate(170%);-webkit-backdrop-filter:blur(34px) saturate(170%);border:1px solid var(--line-2);border-radius:26px;box-shadow:0 40px 100px -30px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s, transform .3s cubic-bezier(.2,.8,.2,1)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.md-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid var(--line)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:12px;border:1px solid var(--line-2);background:transparent;font-size:13px}
.sw i{width:26px;height:26px;border-radius:8px}
.sw[aria-pressed="true"]{border-color:var(--a1);box-shadow:0 0 0 3px color-mix(in oklab, var(--a1) 20%, transparent)}
.integ{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}

/* toasts */
.toasts{position:fixed;z-index:80;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}

/* log conversación */
.log{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto;padding-right:4px}

/* ANDRÉS OS — centro de mando personal de Andrés Carreño.
 * Un solo archivo sin build. Funciona igual:
 *   · como página propia (meetaistaff.com/andres-os/ o abriendo el archivo): voz con palabra de activación,
 *     Claude con tu API key, voz de ElevenLabs, datos en este navegador.
 *   · como Artifact de claude.ai: Claude sin API key (sample), memoria en la nube (db),
 *     Google Calendar, llamadas de ElevenLabs y sesiones de Claude Code (mcp).
 */
(() => {
'use strict';

/* ============================================================
 * UTILIDADES

const LS_KEY = 'andres-os:v1';

const Store = (() => {

  }
  function migrate(s) {
    const d = makeDefault();

    out.voice = Object.assign({}, d.voice, s.voice || {});
    out.brain = Object.assign({}, d.brain, s.brain || {});
    out.trading = Object.assign({}, d.trading, s.trading || {});
    out.life = Object.assign({}, d.life, s.life || {});
    out.life.finance = Object.assign({}, d.life.finance, (s.life || {}).finance || {});
    if (!Array.isArray(out.projects) || !out.projects.length) out.projects = d.projects;
    return out;
  }
  function snapshot() {
    // Las claves de API nunca salen de este dispositivo.
    const copy = JSON.parse(JSON.stringify(S));
    copy.brain.apiKey = ''; copy.voice.elKey = '';
    copy.chat = copy.chat.slice(-24);
    copy.trading.journal = copy.trading.journal.slice(-400);
    copy.life.checkins = copy.life.checkins.slice(-400);
    return copy;
  }
  function persistLocal() {
    const copy = JSON.parse(JSON.stringify(S));
    if (!S.brain.remember) copy.brain.apiKey = '';
    lsSet(LS_KEY, JSON.stringify(copy));
  }
  function save(immediate) {
    persistLocal();
    listeners.forEach(f => f());
    if (!docRef) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      const snap = snapshot();
      const str = JSON.stringify(snap);
      if (str === lastWritten) return;
      try { await docRef.set({ state: str, at: new Date().toISOString() }); lastWritten = str; cloud = 'on'; }
      catch (e) { cloud = 'error'; console.warn('db', e); }
    }, immediate ? 0 : 900);
  }
  async function connectCloud(onRemote) {
    if (!IS_ARTIFACT) return;
    try {
      db = await window.claude.use('db');
      const user = await window.claude.use('user');
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      docRef = db.doc('data/users/' + id + '/os');
      const first = await docRef.get();
      if (first.exists) {
        const d = first.data();
        if (d && d.state) {
          lastWritten = d.state;
          const remote = migrate(JSON.parse(d.state));
          remote.brain.apiKey = S.brain.apiKey; remote.voice.elKey = S.voice.elKey;
          S = remote; persistLocal(); onRemote && onRemote();
        }
      }
      cloud = 'on';
      docRef.onSnapshot(snap => {
        if (!snap.exists || snap.metadata.hasPendingWrites) return;
        const d = snap.data();
        if (!d || !d.state || d.state === lastWritten) return;
        lastWritten = d.state;
        try {
          const remote = migrate(JSON.parse(d.state));
          remote.brain.apiKey = S.brain.apiKey; remote.voice.elKey = S.voice.elKey;
          S = remote; persistLocal(); onRemote && onRemote();
        } catch { /* ignorar */ }
      }, () => { cloud = 'error'; });
    } catch (e) { console.warn('cloud', e); cloud = 'error'; }
  }
  return { load, save, connectCloud, onChange: f => listeners.push(f), cloud: () => cloud, snapshot, migrate };
})();

    }

  }

    return new Promise(res => {
      if (!('speechSynthesis' in window)) return res();

      const v = pickVoice(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = S.profile.lang === 'en' ? 'en-US' : 'es-ES';
      u.rate = S.voice.rate || 1; u.pitch = 0.95;

      u.onend = u.onerror = () => { synthLevel = 0; res(); };

    });
  }
  async function sayEleven(text, my) {
    const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(S.voice.elVoice)}?output_format=mp3_44100_128`, {
      method: 'POST',
      headers: { 'xi-api-key': S.voice.elKey, 'Content-Type': 'application/json', Accept: 'audio/mpeg' },
      body: JSON.stringify({ text, model_id: S.voice.elModel || 'eleven_flash_v2_5' })
    });
    if (!r.ok) throw new Error('ElevenLabs ' + r.status);
    const blob = await r.blob();
    if (my !== gen) return;
    if (!audioEl) {
      audioEl = new Audio(); audioEl.crossOrigin = 'anonymous';
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const src = actx.createMediaElementSource(audioEl);
        analyser = actx.createAnalyser(); analyser.fftSize = 512; abuf = new Uint8Array(analyser.fftSize);
        src.connect(analyser); analyser.connect(actx.destination);
      } catch { analyser = null; }
    }
    if (actx && actx.state === 'suspended') await actx.resume();
    const url = URL.createObjectURL(blob);
    audioEl.src = url;
    await new Promise((res, rej) => {
      audioEl.onended = () => { URL.revokeObjectURL(url); res(); };
      audioEl.onerror = () => { URL.revokeObjectURL(url); rej(new Error('audio')); };
      audioEl.play().catch(rej);

    });
  }
  function stopSpeaking() {

  // nivel de audio 0..1 para la boca y los anillos

      for (let i = 0; i < abuf.length; i++) { const v = (abuf[i] - 128) / 128; sum += v * v; }

    }

      synthBump *= 0.9;
      const tt = performance.now() / 1000;
      return clamp(0.25 + 0.3 * Math.abs(Math.sin(tt * 11.3)) * (0.6 + 0.4 * Math.sin(tt * 3.7)) + synthBump * 0.35, 0, 1);

})();

  /* ---------- SESIONES / LLAMADAS ---------- */
  const SESS_MAP = [['trading', /trading|gold|robot|forja|ea\b|mt5/], ['aistaff', /istaff|aistaff|meetaistaff|agente|curso|recepcionista|real estate|voz/], ['marca', /soyandres|soy andres|biblioteca|libro|andres carreno/], ['io', /\bio\b|finanzas y vida|espejo/], ['prime', /aseo|prime|menage|limpieza|cleaning/]];
  const sessProject = title => { const n = norm(title); for (const [id, re] of SESS_MAP) if (re.test(n)) return id; return null; };
  function sessState(s) {
    const b = String(s.status_bucket || '').replace('SESSION_STATUS_BUCKET_', '').toLowerCase();
    if (b === 'working') return ['good', t('working')];
    if (b === 'blocked') return ['warn', t('needs')];
    if (b === 'failed') return ['bad', t('failed')];
    return ['muted', t('ready')];
  }
  function sessionsSummary() {
    if (!ext.sessions) return '';
    return ext.sessions.slice(0, 8).map(s => `${s.title} (${sessState(s)[1]}${s.needs ? '; pendiente: ' + s.needs.slice(0, 160) : ''})`).join('; ');
  }
  function callsSummary() {
    if (!ext.calls) return '';
    return ext.calls.slice(0, 6).map(c => `${c.title} · ${c.agent} · ${Math.round(c.secs / 60 * 10) / 10} min · ${c.ok}`).join('; ');
  }
  function connectBlock(err) {
    if (!IS_ARTIFACT) return `<div class="connect"><p>${esc(t('onlyArtifact'))}</p></div>`;
    if (ext.mcpMissing) return `<div class="connect"><p>${esc(S.profile.lang === 'en' ? 'Connectors are not available in this view.' : 'Los conectores no están disponibles en esta vista.')}</p></div>`;
    if (ext.needConnect) return `<div class="connect"><p>${esc(t('connectHelp'))}</p><button class="btn sm primary" data-action="connect">${icon('spark')}${esc(t('connect'))}</button></div>`;
    if (err) return `<div class="connect"><p>${esc(err)}</p><button class="btn sm" data-action="connect">${esc(t('connect'))}</button></div>`;
    return `<div class="empty">…</div>`;
  }
  function errText(code, name) {
    const en = S.profile.lang === 'en';
    if (code === 'server_not_connected' || code === 'server_not_found') return en ? `Connect ${name} in claude.ai → Settings → Connectors.` : `Conecta ${name} en claude.ai → Ajustes → Conectores.`;
    if (code === 'needs_reauth') return en ? `Reconnect ${name} in claude.ai.` : `Vuelve a conectar ${name} en claude.ai.`;
    if (code === 'not_granted' || code === 'consent_required') return en ? 'Permission not granted.' : 'Permiso no concedido.';
    return en ? `${name} unavailable right now.` : `${name} no disponible ahora.`;
  }

    const en = S.profile.lang === 'en';

  function setPath(path, val) { const ks = path.split('.'); let o = S; while (ks.length > 1) o = o[ks.shift()]; o[ks[0]] = val; }

  /* ---------- render total ---------- */
  function renderAll() {

    renderSessions(); renderCalls(); renderMemory(); renderLog(); renderCoreMeta(); renderBrainBadge(); renderHint();

  /* ---------- conversación ---------- */
  async function converse(text) {
    text = String(text || '').trim(); if (!text) return;
    if (busy) Brain.stop();
    Voice.stopSpeaking();
    busy = true;
    el('capUser').textContent = '› ' + text; el('capAi').textContent = ''; el('core').classList.add('has-cap'); clearTimeout(App._capT);
    const history = S.chat.slice(-10);
    S.chat.push({ role: 'user', content: text, ts: Date.now() });
    setCore('thinking'); el('stopBtn').hidden = false;
    let spoken = 0, streamed = '';
    const onDelta = whole => {
      streamed = whole; el('capAi').textContent = whole;
      if (S.voice.out) {
        const pending = whole.slice(spoken); const re = /[^.!?…\n]+[.!?…]+["»”)]?(?=\s|$)|[^\n]*\n/g; let m, used = 0;
        while ((m = re.exec(pending))) { if (!m[0]) { re.lastIndex++; continue; } Voice.enqueue(m[0]); used = re.lastIndex; }
        spoken += used;
      }
    };
    try {
      const final = await Brain.ask(text, history, onDelta);
      const out = String(final || streamed || '').trim();
      el('capAi').textContent = out;
      if (S.voice.out) { const rest = (out.startsWith(streamed.slice(0, spoken)) ? out.slice(spoken) : '').trim(); if (rest) Voice.enqueue(rest); }
      if (out) S.chat.push({ role: 'assistant', content: out, ts: Date.now() });
      S.chat = S.chat.slice(-40);
      Store.save();
    } catch (e) {
      console.warn(e);
      const en = S.profile.lang === 'en';
      let msg = en ? 'I couldn’t reach Claude. Check your connection and key in Settings.' : 'No pude conectar con Claude. Revisa tu conexión y tu key en Ajustes.';
      if (e && (e.status === 401 || /401|authentication/i.test(e.message || ''))) msg = en ? 'The API key was rejected. Check it in Settings.' : 'La API key fue rechazada. Revísala en Ajustes.';
      el('capAi').textContent = msg;
    } finally {
      busy = false; el('stopBtn').hidden = true;
      if (!Voice.speaking) { setCore('idle'); Voice.followUp(); }
      App._capT = setTimeout(() => { if (!busy && !Voice.speaking) el('core').classList.remove('has-cap'); }, 14000);
      renderLog(); renderCoreMeta();
    }
  }

  /* ---------- integraciones (claude.ai) ---------- */
  function payloadOf(res) {
    let p = res && res.payload !== undefined ? res.payload : res && res.structuredContent;
    if (p === undefined || p === null) { const tx = ((res && res.content) || []).find(c => c.type === 'text'); p = tx ? tx.text : null; }
    if (typeof p === 'string') { try { p = JSON.parse(p); } catch { const i = p.indexOf('{'), j = p.lastIndexOf('}'); if (i >= 0 && j > i) { try { p = JSON.parse(p.slice(i, j + 1)); } catch { p = null; } } else p = null; } }
    return p;
  }
  async function initIntegrations() {

  function startWatches() {
    if (ext.started || !mcp) return; ext.started = true;
    const d0 = new Date(today() + 'T00:00:00'); const d1 = new Date(d0.getTime() + 15 * 864e5);
    const tz = TZ;
    mcp.watchTool('Google Calendar', 'list_events', { startTime: d0.toISOString(), endTime: d1.toISOString(), orderBy: 'startTime', pageSize: 50, timeZone: tz }, ev => {

          const dt = e.start && (e.start.dateTime || e.start.date);
          const allDay = !!(e.start && e.start.date && !e.start.dateTime);
          const d = dt ? (allDay ? e.start.date : isoInTZ(new Date(dt))) : today();
          const tm = !allDay && dt ? new Date(dt).toLocaleTimeString('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }) : '';
          return { id: e.id, title: (e.summary || '').trim() || '(sin título)', date: d, time: tm, link: e.htmlLink, src: 'gcal', project: sessProject(e.summary || '') };
        });

      if (ev.type === 'error') { ext.callsErr = ev.error.code; }

        const p = payloadOf(ev.result) || {};
        ext.calls = (p.conversations || []).map(c => ({ title: c.call_summary_title || '', agent: c.agent_name || 'Agente', secs: +c.call_duration_secs || 0, ok: c.call_successful || 'unknown', lang: c.main_language || '', when: c.start_time_unix_secs ? new Date(c.start_time_unix_secs * 1000).toLocaleString(L(), { timeZone: TZ, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '' }));
        ext.callsErr = null;

    mcp.watchTool('Claude Code Remote', 'list_sessions', { limit: 20, mine: true }, ev => {
      if (ev.type === 'error') { ext.sessionsErr = ev.error.code; }

  }

        case 'test-voice': Voice.stopSpeaking(); { const was = S.voice.out; S.voice.out = true; Voice.enqueue(en ? `Hi ${S.profile.name}. All systems ready.` : `Hola ${S.profile.name}. Todos los sistemas listos.`); S.voice.out = was; } break;
        case 'export': exportData(); break;
        case 'reset': if (!resetArmed) { resetArmed = true; renderSettings(); setTimeout(() => { resetArmed = false; if (el('settings').classList.contains('on')) renderSettings(); }, 4000); } else { resetArmed = false; const keep = { apiKey: S.brain.apiKey, elKey: S.voice.elKey }; S = makeDefault(); S.brain.apiKey = keep.apiKey; S.voice.elKey = keep.elKey; applyTheme(); commit(); renderSettings(); } break;
      }
    });
    document.addEventListener('change', e => {
      const x = e.target; const k = x.dataset.change; if (!k) { if (x.id === 'importFile') importData(x.files[0]); return; }
      if (k === 'set') { setPath(x.dataset.k, x.value); if (x.dataset.k === 'voice.engine' || x.dataset.k === 'brain.apiKey' || x.dataset.k === 'brain.model') renderBrainBadge(); commit(); }
      else if (k === 'set-num') { setPath(x.dataset.k, +x.value); if (x.dataset.k.startsWith('trading.dailyLoss') || x.dataset.k.startsWith('trading.maxLoss')) S.trading.limitsExample = false; if (x.dataset.k === 'trading.balance') { const g = P('trading').goals[0]; if (g) g.current = S.trading.balance - S.trading.account; } commit(); if (x.type === 'range') renderSettings(); }
      else if (k === 'rules') { const lines = x.value.split('\n').map(s => s.trim()).filter(Boolean); const old = S.trading.rules; S.trading.rules = lines.map((txt, i) => ({ id: (old[i] && old[i].text === txt) ? old[i].id : uid(), text: txt })); commit(); }
      else if (k === 'fin') { S.life.finance[x.dataset.k] = x.value === '' ? null : +x.value; commit(); }
      else if (k === 'p-field') { const p = P(drawerId); p[x.dataset.k] = x.value; if (x.dataset.k === 'deadline') p.deadlineExample = false; commit(); }
      else if (k === 'goal') { const p = P(drawerId), g = p.goals.find(y => y.id === x.dataset.g); if (g) { g[x.dataset.k] = +x.value; if (x.dataset.k === 'target') g.example = false; if (p.id === 'trading' && p.goals[0] === g && x.dataset.k === 'current') S.trading.balance = S.trading.account + g.current; } commit(); }
      else if (k === 'budget') { const p = P(drawerId); p.budget[x.dataset.k] = x.dataset.k === 'allocated' ? +x.value : x.value; if (x.dataset.k === 'allocated') p.budget.allocatedExample = false; commit(); }
    });
    document.addEventListener('submit', e => {
      const f = e.target; const k = f.dataset.form;
      if (f.id === 'composer') { e.preventDefault(); const v = el('ask').value; el('ask').value = ''; converse(v); return; }
      if (!k) return;
      e.preventDefault();
      const d = Object.fromEntries(new FormData(f).entries());
      const en = S.profile.lang === 'en';
      if (k === 'event') { S.agenda.push({ id: uid(), title: d.title, date: d.date || today(), time: d.time || '', project: null }); commit(t('toastEvent')); }
      else if (k === 'contact') { S.life.contacts.push({ id: uid(), name: d.name, every: +d.every || 7, last: null }); commit(); }
      else if (k === 'memory') { S.memory.push({ id: uid(), text: d.text, date: today(), src: 'user' }); commit(t('toastMem')); }
      else if (k === 'trade') { if (d.result === '' || isNaN(+d.result)) return; logTrade(+d.result, tradeFollowed, d.emotion, d.note); tradeFollowed = true; renderTrading(); }
      else if (k === 'task') { const p = P(drawerId); p.tasks.push({ id: uid(), title: d.title, prio: d.prio || 'media', due: d.due || null, done: false, created: today() }); commit(t('toastTask', { p: p.name })); setTimeout(() => el('ntTitle') && el('ntTitle').focus(), 30); }
      else if (k === 'goal') { const p = P(drawerId); p.goals.push({ id: uid(), title: d.title, current: 0, target: +d.target || 1, unit: d.unit || '', example: false }); commit(); }
      else if (k === 'expense') { const p = P(drawerId); p.budget.items.push({ id: uid(), label: d.label, amount: +d.amount || 0, date: today() }); commit(); }
      else if (k === 'milestone') { const p = P(drawerId); p.milestones.push({ id: uid(), title: d.title, date: d.date, done: false }); commit(); }
      else if (k === 'link') { const p = P(drawerId); if (/^https?:\/\//i.test(d.url)) { p.links.push({ label: d.label, url: d.url }); commit(); } else toast(en ? 'Links must start with https://' : 'Los enlaces deben empezar con https://'); }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeLayers(); if (busy || Voice.speaking) { Brain.stop(); Voice.stopSpeaking(); setCore('idle'); } }
      if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); el('ask').focus(); }
    });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.profile.theme === 'auto') { applyTheme(); renderTop(); } });
    new MutationObserver(() => { syncColors(); renderTop(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  }
  function exportData() {
    const data = JSON.stringify(Store.snapshot(), null, 2), en = S.profile.lang === 'en';
    if (!IS_ARTIFACT) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = `andres-os-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast(en ? 'Backup downloaded' : 'Respaldo descargado');
    } else {
      navigator.clipboard.writeText(data).then(() => toast(en ? 'Backup copied to clipboard' : 'Respaldo copiado al portapapeles'), () => toast(en ? 'Could not copy' : 'No se pudo copiar'));
    }
  }
  function importData(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => { try { const keep = { apiKey: S.brain.apiKey, elKey: S.voice.elKey }; S = Store.migrate(JSON.parse(r.result)); S.brain.apiKey = keep.apiKey; S.voice.elKey = keep.elKey; applyTheme(); commit(S.profile.lang === 'en' ? 'Backup imported' : 'Respaldo importado'); renderSettings(); } catch { toast('JSON inválido'); } };
    r.readAsText(file);
  }

  /* ---------- arranque ---------- */
  async function boot() {
    Store.load();
    App._stars = starfield(el('stars'));
    Nebula.init(el('gl'), el('hud'), () => Voice.level());
    applyTheme();
    Voice.on('command', txt => { el('capUser').textContent = '› ' + txt; converse(txt); });
    Voice.on('interim', txt => { el('capUser').textContent = txt ? '› ' + txt : ''; });
    Voice.on('state', s => {
      if (s === 'speaking') setCore('speaking');
      else if (s === 'listening') setCore('listening');
      else if (s === 'done') { if (!busy) { setCore('idle'); Voice.followUp(); } clearTimeout(App._capT); App._capT = setTimeout(() => { if (!busy && !Voice.speaking) el('core').classList.remove('has-cap'); }, 8000); }
      else if (!busy && !Voice.speaking) setCore(Voice.listening ? 'listening' : 'idle');
      renderTop(); renderHint();
    });
    Voice.on('error', k => {
      const en = S.profile.lang === 'en';
      if (k === 'mic' || k === 'nomic') toast(en ? 'Microphone unavailable here. Type instead, or open the installed version.' : 'El micrófono no está disponible aquí. Escríbeme, o abre la versión instalada.');
      if (k === 'eleven') toast(en ? 'ElevenLabs failed — using the browser voice.' : 'ElevenLabs falló — uso la voz del navegador.');
      renderTop(); renderHint();
    });
    bind();
    setCore('idle');
    renderAll();
    Store.onChange(() => { /* guardado */ });
    setInterval(() => { renderToday(); renderPulse(); }, 15000);
    setInterval(() => { renderFocus(); renderAgenda(); }, 5 * 60e3);
    // claude.ai: memoria en la nube, cerebro y conectores
    if (IS_ARTIFACT) {
      Store.connectCloud(() => { applyTheme(); renderAll(); });
      Brain.init().then(renderBrainBadge);
      initIntegrations();
    }
  }
  return { boot, commit, applyTheme, openProject, logTrade, upcomingEvents, focusList, sessionsSummary, callsSummary, renderBrainBadge, _stars: null, _capT: 0 };
})();

App.boot();
})();
</script>
<!-- ARTIFACT:END -->
