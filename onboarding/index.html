.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);}
.top-in{max-width:880px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:18px;}
.brand .mk{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:800;}
.seg{margin-left:auto;display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:3px;}
.seg button{border:0;background:none;font:inherit;font-size:12px;font-weight:700;color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer;}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(10,26,51,.16);}
.tbtn{border:1px solid var(--line);background:var(--card);width:36px;height:36px;border-radius:999px;cursor:pointer;font-size:16px;color:var(--ink);}
.prog{height:4px;background:var(--line);}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3B82F6,#22B8E6);transition:width .4s cubic-bezier(.2,.8,.2,1);}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:30px 20px 120px;}
.steps-nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:22px;scrollbar-width:none;}
.steps-nav::-webkit-scrollbar{display:none;}
.sn{flex-shrink:0;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);padding:7px 12px 7px 7px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;}
.sn b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--bg-2);color:var(--muted);}
.sn.cur{border-color:var(--blue);color:var(--accent-ink);background:var(--blue-soft);}
.sn.cur b{background:var(--blue);color:#fff;}
.sn.done b{background:var(--green);color:#fff;}
.sn[disabled]{opacity:.55;cursor:default;}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:30px 30px 26px;animation:fadeUp .35s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:8px;}
h1{font-size:clamp(28px,4.4vw,42px);font-weight:800;letter-spacing:-1px;line-height:1.1;margin-bottom:10px;}
h2{font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-.6px;line-height:1.15;margin-bottom:6px;}
.lead{font-size:16.5px;color:var(--muted);line-height:1.6;max-width:640px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;margin-top:22px;}
.full{grid-column:1/-1;}
@media(max-width:640px){.grid{grid-template-columns:1fr;}.card{padding:22px 18px;}}
.f label{display:block;font-size:13.5px;font-weight:700;margin-bottom:7px;}
.f label .req{color:var(--red);margin-left:3px;}
.f label .opt{color:var(--muted);font-weight:600;font-size:12px;margin-left:6px;}
.f small{display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45;}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],select,textarea{width:100%;font:inherit;font-size:15.5px;padding:13px 15px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--bg-2);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;}
textarea{min-height:96px;resize:vertical;line-height:1.5;}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft);}
.f.err input,.f.err select,.f.err textarea{border-color:var(--red);}
.f .emsg{display:none;color:var(--red);font-size:12px;font-weight:700;margin-top:6px;}
.f.err .emsg{display:block;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:13.5px;font-weight:700;padding:9px 13px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s;}
.chip:hover{border-color:var(--blue);}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--accent-ink);}
.chip.on::before{content:"✓";font-weight:800;}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:640px){.cards3{grid-template-columns:1fr;}}
.pcard{border:1.5px solid var(--line);border-radius:18px;background:var(--card);padding:16px;cursor:pointer;text-align:center;font:inherit;color:var(--ink);transition:all .15s;}
.pcard .av{width:64px;height:64px;display:block;margin:0 auto 10px;}
.pcard b{display:block;font-size:15px;}
.pcard span{font-size:12px;color:var(--muted);}
.pcard.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 4px var(--blue-soft);}
.check,.f .check{font-weight:500;margin:0;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg-2);cursor:pointer;font-size:14px;line-height:1.5;}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--blue);flex-shrink:0;}
.check a{color:var(--accent-ink);font-weight:700;}

.nav{display:flex;align-items:center;gap:12px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font:inherit;font-weight:700;border-radius:14px;padding:14px 26px;font-size:15.5px;text-decoration:none;transition:transform .15s;}
.btn:active{transform:scale(.97);}
.btn-blue{background:linear-gradient(135deg,#3B82F6,#1858C4);color:#fff;box-shadow:0 10px 26px rgba(31,111,235,.35);}

.nav .btn{white-space:nowrap;}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

function inp(id, label, type, o={}){
  const v = A[id] || "";

    (type==="textarea" ? `<textarea id="i_${id}" data-id="${id}" placeholder="${esc(o.ph||"")}">${esc(v)}</textarea>`
     : `<input id="i_${id}" data-id="${id}" type="${type}" value="${esc(v)}" placeholder="${esc(o.ph||"")}" ${o.ac?`autocomplete="${o.ac}"`:""}>`)+
    `${o.help?`<small>${esc(o.help)}</small>`:""}<div class="emsg">${esc(o.emsg||t("req"))}</div></div>`;
}
function sel(id, label, opts, o={}){
  const v = A[id] || "";

}
function chips(id, label, opts, o={}){

    [t("reviewH")[1], [[t("bizName"),L("bizName")],[t("sector"),A.sector==="autre"?(A.sectorOther||label(t("sectors"),"autre")):label(t("sectors"),A.sector)],[t("website"),L("website")],[t("city"),L("city")],[t("team"),L("team")],[t("hours"),L("hours")],[t("services"),L("services")],[t("avgValue"),L("avgValue")]]],
    [t("reviewH")[2], [[t("mainPhone"),L("mainPhone")],[t("callsWeek"),L("callsWeek")],[t("whoAnswers"),L("whoAnswers")],[t("channels"),L("channels")],[t("instagram"),L("instagram")],[t("facebook"),L("facebook")],[t("gbp"),L("gbp")],[t("calendar"),L("calendar")],[t("software"),L("software")]]],
    [t("reviewH")[3], [[t("persona"),PERS[A.persona]],[t("langs"),L("langs")],[t("tone"),L("tone")],[t("greeting"),L("greeting")],[t("urgent"),L("urgent")],[t("urgentPhone"),L("urgentPhone")],[t("questions"),L("questions")],[t("faqs"),L("faqs")],[t("never"),L("never")]]],
    [t("reviewH")[4], [[t("goals"),L("goals")],[t("briefings"),L("briefings")],[t("plan"),L("plan")],[t("startD"),L("startDate")],[t("source"),L("source")],[t("notes"),L("notes")]]]
  ];
  return `<div class="review">${rows.filter(([h,items])=>items.some(x=>x[1])).map(([h,items])=>`<h4>${esc(h)}</h4><dl>${items.filter(x=>x[1]).map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join("")}</dl>`).join("")}</div>`;
}

/* ---------- render / nav ---------- */
function renderNav(){
  document.getElementById("stepsNav").innerHTML = t("steps").map((s,i)=>`<button type="button" class="sn${i===step?" cur":""}${i<step?" done":""}" data-step="${i}" ${i>maxStep?"disabled":""}><b>${i<step?"✓":i}</b>${esc(s)}</button>`).join("");
  document.querySelectorAll("[data-step]").forEach(b=>b.addEventListener("click",()=>{ const i = +b.dataset.step; if(i<=maxStep){ step = i; render(); } }));
  const cur = document.querySelector(".sn.cur"), nav = document.getElementById("stepsNav"); if(cur) nav.scrollLeft = cur.offsetLeft - nav.offsetLeft - 20;
  document.getElementById("progBar").style.width = (step/(STEPS.length-1)*100)+"%";
}
function render(){
  document.documentElement.lang = lang; document.title = t("title");
  document.querySelectorAll("#langSeg button").forEach(b=>b.classList.toggle("on", b.dataset.lang===lang));
  document.getElementById("footTxt").textContent = t("foot"); document.getElementById("footPriv").textContent = t("privacy");
  document.getElementById("footPriv").href = "/confidentialite/"+(lang==="fr"?"":"?lang="+lang);
  renderNav();
  document.getElementById("stepHost").innerHTML = STEPS[step].render();
  wire();
  window.scrollTo({top:0, behavior:"smooth"});
}
function wire(){
  const host = document.getElementById("stepHost");
  host.querySelectorAll("[data-id]").forEach(el=>{
    el.addEventListener("input", ()=>{ A[el.dataset.id] = el.value; el.closest(".f").classList.remove("err"); saved();
      if(el.dataset.id==="sector"){ const w = document.getElementById("otherWrap"); if(w) w.style.display = el.value==="autre" ? "" : "none"; } });
    el.addEventListener("change", ()=>{ A[el.dataset.id] = el.value; saved(); if(el.dataset.id==="sector"){ const w = document.getElementById("otherWrap"); if(w) w.style.display = el.value==="autre" ? "" : "none"; } });
  });
  host.querySelectorAll("[data-chip]").forEach(b=>b.addEventListener("click",()=>{
    const id = b.dataset.chip, v = b.dataset.val, multi = b.dataset.multi==="1", max = +b.dataset.max;
    if(multi){ const cur = new Set(A[id]||[]); if(cur.has(v)) cur.delete(v); else { if(max && cur.size>=max){ toast(t("langsNote")); return; } cur.add(v); } A[id] = [...cur]; }
    else A[id] = A[id]===v ? "" : v;
    const wrap = b.closest(".chips"); wrap.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", multi ? (A[id]||[]).includes(c.dataset.val) : A[id]===c.dataset.val));
    b.closest(".f").classList.remove("err"); saved();
  }));
  host.querySelectorAll("[data-persona]").forEach(b=>b.addEventListener("click",()=>{ A.persona = b.dataset.persona; host.querySelectorAll("[data-persona]").forEach(x=>x.classList.toggle("on", x===b));
    const g = document.getElementById("i_greeting"); if(g) g.placeholder = t("greetingPh").replace("{biz}", A.bizName||"…").replace("{a}", PERS[A.persona]); saved(); }));
  host.querySelectorAll("[data-cb]").forEach(c=>c.addEventListener("change",()=>{ A[c.dataset.cb] = c.checked; c.closest(".f").classList.remove("err"); saved(); }));
  host.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>b.dataset.go==="next" ? next() : back()));
  const sb = document.getElementById("submitBtn"); if(sb) sb.addEventListener("click", submit);
}
let saveT;
function saved(){ save(); const n = document.getElementById("saveNote"); if(n){ n.textContent = t("saved"); clearTimeout(saveT); saveT = setTimeout(()=>{ n.textContent = ""; }, 1800); } }
function validate(){
  let ok = true, first = null;
  STEPS[step].req.forEach(id=>{
    const f = document.querySelector(`[data-f="${id}"]`); if(!f) return;
    let bad = !A[id] || (typeof A[id]==="string" && !A[id].trim());
    if(id==="email" && !bad) bad = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(A.email.trim());
    f.classList.toggle("err", bad); if(bad){ ok = false; if(!first) first = f; }
  });
  if(first) first.scrollIntoView({behavior:"smooth", block:"center"});
  return ok;
}
function next(){ if(!validate()) return; step = Math.min(STEPS.length-1, step+1); maxStep = Math.max(maxStep, step); render(); }
function back(){ step = Math.max(0, step-1); render(); }

/* ---------- submit ---------- */
function payload(){
  return Object.assign({submittedAt:new Date().toISOString(), formLang:lang, page:location.href}, A, {personaName:PERS[A.persona]});
}
function summaryText(p){
  const lines = [], add = (k,v)=>{ if(v!=null && v!=="" && !(Array.isArray(v)&&!v.length)) lines.push(k+": "+(Array.isArray(v)?v.join(", "):v)); };
  add("Nom", [p.firstName,p.lastName].join(" ")); add("Courriel", p.email); add("Téléphone", p.phone); add("Rôle", p.role); add("Langue", p.prefLang);
  add("Entreprise", p.bizName); add("Secteur", p.sector==="autre" ? p.sectorOther : p.sector); add("Site", p.website); add("Ville", p.city); add("Équipe", p.team); add("Heures", p.hours); add("Services", p.services); add("Valeur moyenne", p.avgValue);
  add("Numéro principal", p.mainPhone); add("Appels/sem.", p.callsWeek); add("Qui répond", p.whoAnswers); add("Canaux", p.channels); add("Instagram", p.instagram); add("Facebook", p.facebook); add("Google", p.gbp); add("Agenda", p.calendar); add("Outils", p.software);
  add("Adjointe", p.personaName); add("Langues", p.langs); add("Ton", p.tone); add("Accueil", p.greeting); add("Urgences", p.urgent); add("No urgences", p.urgentPhone); add("Questions", p.questions); add("FAQ", p.faqs); add("Jamais", p.never);
  add("Objectifs", p.goals); add("Briefings", p.briefings); add("Plan", p.plan); add("Démarrage", p.startDate); add("Source", p.source); add("Notes", p.notes);
  add("Consentement démo", p.c1 ? "oui" : "non"); add("Consentement marketing", p.c3 ? "oui" : "non"); add("Réf", p.ref);
  return lines.join("\n");
}
async function submit(){
  if(!validate()) return;
  const btn = document.getElementById("submitBtn"); btn.disabled = true; btn.textContent = t("sending");
  const p = payload();
  let sent = false;
  if(ONBOARDING_WEBHOOK){
    try{ await fetch(ONBOARDING_WEBHOOK, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=UTF-8"}, body:JSON.stringify(p)}); sent = true; }catch(e){ sent = false; }
  }
  showDone(sent, p);
}
function showDone(sent, p){
  step = STEPS.length-1; maxStep = step; renderNav();
  const cur = document.querySelector(".sn.cur"), nav = document.getElementById("stepsNav"); if(cur) nav.scrollLeft = cur.offsetLeft - nav.offsetLeft - 20;
  document.getElementById("progBar").style.width = "100%";
  const subj = encodeURIComponent("Onboarding AI Staff — "+(p.bizName||"")), body = encodeURIComponent(summaryText(p));
  const mail = `mailto:${CONTACT_EMAIL}?subject=${subj}&body=${body}`;
  document.getElementById("stepHost").innerHTML = `<div class="card finish"><div class="ok">✓</div><h1>${esc(sent ? t("doneT") : t("fallbackT"))}</h1><p class="lead" style="margin:0 auto">${esc(sent ? t("doneL") : t("fallbackL"))}</p>`+
    (sent ? `<ol>${t("doneSteps").map(s=>`<li>${s}</li>`).join("")}</ol>` : "")+
    `<div class="alt">${sent ? "" : `<a class="btn btn-blue" href="${mail}">✉️ ${esc(t("mailBtn"))}</a><button class="btn btn-ghost" id="cpBtn">📋 ${esc(t("cpBtn"))}</button>`}<button class="btn btn-ghost" id="dlBtn">⬇ ${esc(t("dlBtn"))}</button><a class="btn btn-ghost" href="tel:+14388058804">${esc(t("callUs"))}</a><a class="btn btn-ghost" href="/${lang==="fr"?"":"?lang="+lang}">${esc(t("home"))}</a></div>`+
    (sent ? "" : `<ol>${t("doneSteps").map(s=>`<li>${s}</li>`).join("")}</ol>`)+`</div>`;
  const cp = document.getElementById("cpBtn");
  if(cp) cp.addEventListener("click", ()=>{ const txt = summaryText(p); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast(t("copied")), ()=>{ const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast(t("copied")); }catch(e){} ta.remove(); }); });
  document.getElementById("dlBtn").addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify(p, null, 2)], {type:"application/json"}), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "onboarding-"+(p.bizName||"aistaff").toLowerCase().replace(/[^a-z0-9]+/g,"-")+".json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  });
  if(sent){ try{ localStorage.removeItem(KEY); }catch(e){} }
}

/* ---------- chrome ---------- */
let toastT;
function toast(m){ const el = document.getElementById("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("show"), 2200); }
const themeBtn = document.getElementById("themeToggle");
function paintTheme(){ themeBtn.textContent = document.documentElement.getAttribute("data-theme")==="dark" ? "☀️" : "🌙"; }
themeBtn.addEventListener("click", ()=>{ const n = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n); try{ localStorage.setItem("aistaff-theme", n); }catch(e){} paintTheme(); });
paintTheme();
document.querySelectorAll("#langSeg button").forEach(b=>b.addEventListener("click",()=>{ lang = b.dataset.lang; if(!A.prefLang) A.prefLang = lang; try{ const p = new URLSearchParams(location.search); lang==="fr" ? p.delete("lang") : p.set("lang", lang); history.replaceState(null,"",location.pathname+(p.toString()?"?"+p:"")); }catch(e){} render(); }));
render();
})();
</script>
</body>
