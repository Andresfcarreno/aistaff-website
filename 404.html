<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>AI Staff — Page introuvable</title>
<style>
:root{--bg:#EDF0F6;--card:#fff;--ink:#0B1B33;--muted:#5B6B82;--line:rgba(11,27,51,.1);--blue:#1F6FEB;}
@media (prefers-color-scheme:dark){:root{--bg:#071120;--card:#0D1C36;--ink:#EAF0FA;--muted:#93A3BD;--line:rgba(148,178,226,.14);}}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:40px 32px;max-width:460px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(10,26,51,.14);}
.mk{width:52px;height:52px;margin:0 auto 18px;border-radius:16px;background:linear-gradient(135deg,#0A1A33,#1F6FEB);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;}
h1{font-size:26px;letter-spacing:-.5px;margin-bottom:10px;}
p{color:var(--muted);line-height:1.6;font-size:15px;margin-bottom:6px;}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px;}
a.btn{display:inline-block;text-decoration:none;font-weight:700;border-radius:14px;padding:13px 22px;font-size:15px;}
.b1{background:linear-gradient(135deg,#3B82F6,#1858C4);color:#fff;}
.b2{border:1.5px solid var(--line);color:var(--ink);}
</style>
</head>
<body>
<div class="card">
  <div class="mk">AI</div>
  <h1>Page introuvable</h1>
  <p>Cette page n'existe pas ou a été déplacée.</p>
  <p lang="en">This page doesn't exist or has moved.</p>
  <p lang="es">Esta página no existe o fue movida.</p>
  <div class="btns">
    <a class="btn b1" href="/">Accueil · Home · Inicio</a>
    <a class="btn b2" href="tel:+14388058804">📞 +1 (438) 805-8804</a>
  </div>
</div>
</body>
</html>
