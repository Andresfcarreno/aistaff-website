<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<script>
(function(){try{var t=localStorage.getItem("aistaff-theme");if(!t){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<title>AI Staff — Tableau de bord</title>
<meta name="description" content="Démo du tableau de bord client AI Staff : appels, messages, courriel, agenda, briefings et réseaux, gérés par votre assistante IA.">
<style>
  :root{
    --cream:#F5EFE1;
    --cream-2:#EFE7D3;
    --card:#FFFDF7;
    --ink:#221B10;
    --muted:#8B7C60;
    --gold:#C79A3B;
    --gold-light:#F0D79A;
    --gold-deep:#9A741F;
    --bronze:#7A5C1E;
    --line:rgba(160,125,45,.16);
    --shadow:0 10px 34px rgba(140,105,35,.10);
    --green:#2FA84F;
    --orange:#E8830C;
    --radius:24px;
    color-scheme:light dark;
  }
  html[data-theme="dark"]{
      --cream:#17150F;
      --cream-2:#201C13;
      --card:#242016;
      --ink:#F8F0DF;
      --muted:#C0B395;
      --gold:#D8AD55;
      --gold-light:#7A6030;
      --gold-deep:#F0CF83;
      --bronze:#E3C171;
      --line:rgba(226,193,113,.17);
      --shadow:0 10px 34px rgba(0,0,0,.28);
      --green:#6FD18A;
      --orange:#F5A33B;
    }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
    background:var(--cream);color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    min-height:100vh;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;
    background:
      radial-gradient(600px 300px at 90% -40px, rgba(240,215,154,.45), transparent 60%),
      radial-gradient(500px 260px at -20% 10%, rgba(199,154,59,.12), transparent 60%),
      var(--cream);
    padding:0 18px calc(110px + env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 4px;}
  .date{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);}
  .top-actions{display:flex;align-items:center;gap:10px;}
  .language-switch{display:flex;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow);}
  .language-switch button{min-width:34px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:10px;font-weight:800;padding:7px 6px;border-radius:9px;cursor:pointer;}
  .language-switch button.on{background:var(--ink);color:var(--card);}
  .avatar{width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,var(--gold-light),var(--gold) 60%,var(--gold-deep));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;color:#fff;letter-spacing:.02em;
    box-shadow:0 6px 16px rgba(160,120,40,.35), inset 0 1px 2px rgba(255,255,255,.5);}
  h1{font-size:34px;font-weight:700;letter-spacing:-.8px;margin:2px 0 2px;}
  .sub{font-size:15px;color:var(--muted);margin-bottom:6px;}
  .demo-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    color:var(--bronze);background:rgba(199,154,59,.14);border:1px solid var(--line);
    padding:5px 11px;border-radius:999px;margin-top:6px;}

  /* ---------- Live pill ---------- */
  .live{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:10px 16px;margin:14px 0 18px;box-shadow:var(--shadow);font-size:13.5px;font-weight:600;}
  .live .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--gold-light),var(--gold-deep));
    box-shadow:0 0 0 4px rgba(199,154,59,.18);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(.72);}}
  .live small{margin-left:auto;color:var(--muted);font-weight:500;}

  /* ---------- Cards ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px;margin-bottom:16px;}
  .card h3{font-size:16.5px;font-weight:700;letter-spacing:-.2px;margin-bottom:2px;}
  .card .hint{font-size:13px;color:var(--muted);margin-bottom:14px;}

  /* Hero */
  .hero{background:linear-gradient(150deg,#FFFDF7 0%,#FBF3DF 55%,#F5E8C8 100%);
    border:1px solid rgba(160,125,45,.28);position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;top:-70px;right:-70px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(240,215,154,.55),transparent 70%);}
  .hero-num{font-size:52px;font-weight:800;letter-spacing:-1.5px;line-height:1;
    background:linear-gradient(120deg,#8A6420,#C79A3B 55%,#8A6420);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .hero-label{font-size:14.5px;font-weight:600;margin-top:6px;}
  .wave{display:flex;align-items:center;gap:4px;height:44px;margin:14px 0 4px;}
  .wave span{width:5px;border-radius:3px;background:linear-gradient(180deg,var(--gold-light),var(--gold-deep));
    animation:wv 1.1s ease-in-out infinite;}
  @keyframes wv{0%,100%{transform:scaleY(.35);}50%{transform:scaleY(1);}}
  .hero-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;
    font-size:13px;color:var(--muted);}
  .hero-foot b{color:var(--ink);}

  /* KPI grid */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px 16px 14px;}
  .kpi .v{font-size:29px;font-weight:800;letter-spacing:-.8px;}
  .kpi .v.gold{background:linear-gradient(120deg,#8A6420,#C79A3B 60%,#8A6420);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .kpi .l{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:3px;}
  .kpi .d{font-size:12px;font-weight:700;color:var(--green);margin-top:5px;}

  /* Chart */
  .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:6px 2px 0;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end;}
  .bar{width:100%;max-width:38px;border-radius:10px 10px 6px 6px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    box-shadow:inset 0 1px 2px rgba(255,255,255,.6), 0 4px 12px rgba(160,120,40,.18);
    transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.9,.25,1.2) backwards;}
  .bar.today{background:linear-gradient(180deg,#F5E3AC,var(--gold-deep));}
  @keyframes grow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  .bar-col span{font-size:11px;font-weight:600;color:var(--muted);}
  .bar-col.today span{color:var(--gold-deep);font-weight:800;}

  /* Lists */
  .row{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid rgba(160,125,45,.10);}
  .row:last-child{border-bottom:none;}
  .pic{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;color:#fff;letter-spacing:.02em;
    box-shadow:inset 0 1px 2px rgba(255,255,255,.4), 0 4px 10px rgba(140,105,35,.20);}
  .row .info{flex:1;min-width:0;}
  .row .name{font-size:15px;font-weight:600;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;}
  .b-chaud{background:linear-gradient(135deg,#F5E0A8,#E4B84F);color:#6E4E0E;}
  .b-tiede{background:#FBEEDC;color:#B25E09;}
  .b-froid{background:#EEE9DB;color:#8B7C60;}
  .b-ok{background:#E3F4E8;color:#1E7A3A;}
  .chev{color:#C4B48E;font-size:18px;font-weight:300;}

  /* Visit cards */
  .visit{display:flex;gap:14px;align-items:center;background:linear-gradient(150deg,#FFFDF7,#FAF1DC);
    border:1px solid rgba(160,125,45,.25);border-radius:18px;padding:15px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
  .vdate{width:52px;height:56px;border-radius:14px;background:linear-gradient(160deg,var(--gold-light),var(--gold));
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
    box-shadow:0 6px 14px rgba(160,120,40,.3);}
  .vdate b{font-size:19px;line-height:1;}
  .vdate span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
  .visit .info{flex:1;}
  .visit .t{font-size:15px;font-weight:700;}
  .visit .a{font-size:12.5px;color:var(--muted);margin-top:2px;}

  /* Segmented */
  .seg{display:flex;background:#EAE1CC;border-radius:14px;padding:3px;margin-bottom:16px;}
  .seg button{flex:1;border:none;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);
    padding:9px 0;border-radius:11px;cursor:pointer;transition:all .2s;}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(120,90,30,.15);}

  /* Search */
  .search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;margin-bottom:14px;color:var(--muted);font-size:15px;box-shadow:var(--shadow);}
  .search input{border:none;background:none;outline:none;font:inherit;flex:1;color:var(--ink);}

  /* Week strip */
  .week{display:flex;gap:8px;margin-bottom:16px;}
  .day{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 0;text-align:center;
    font-size:11px;font-weight:700;color:var(--muted);box-shadow:var(--shadow);}
  .day b{display:block;font-size:16px;margin-top:3px;color:var(--ink);}
  .day.on{background:linear-gradient(160deg,var(--gold-light),var(--gold));color:#fff;border:none;}
  .day.on b{color:#fff;}

  /* Alex pane */
  .alex-hero{text-align:center;padding:30px 20px 26px;}
  .orb{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 35% 30%, #F7E7BC, #D9AE54 55%, #9A741F);
    box-shadow:0 18px 44px rgba(160,120,40,.4), inset 0 2px 6px rgba(255,255,255,.6);
    animation:breath 3.2s ease-in-out infinite;}
  @keyframes breath{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  .orb::before,.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(199,154,59,.4);
    animation:ring 3.2s ease-out infinite;}
  .orb::after{animation-delay:1.6s;}
  @keyframes ring{from{transform:scale(.8);opacity:1;}to{transform:scale(1.25);opacity:0;}}
  .lang-row{display:flex;gap:10px;margin-top:16px;}
  .lang{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px;font-size:14px;
    font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);}
  .lang.on{border-color:var(--gold);color:var(--bronze);background:#FBF3DF;box-shadow:0 4px 14px rgba(160,120,40,.18);}
  .cta{width:100%;border:none;cursor:pointer;font:inherit;font-size:16px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#D9AE54,#9A741F);border-radius:18px;padding:17px;margin-top:14px;
    box-shadow:0 10px 26px rgba(150,110,30,.4), inset 0 1px 2px rgba(255,255,255,.5);}
  .cta:active{transform:scale(.98);}
  .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#221B10;color:#FFFDF7;font-size:14px;font-weight:600;padding:13px 20px;border-radius:999px;
    box-shadow:0 12px 30px rgba(0,0,0,.25);transition:all .3s;pointer-events:none;z-index:50;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- Tab bar ---------- */
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:40;
    background:rgba(255,253,247,.82);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
    border-top:1px solid var(--line);display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom));}
  .tab{flex:1;border:none;background:none;font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;font-weight:600;color:#A99A76;cursor:pointer;padding:4px 0;}
  .tab svg{width:24px;height:24px;}
  .tab.on{color:var(--gold-deep);}
  .tab.on svg{filter:drop-shadow(0 2px 6px rgba(160,120,40,.4));}

  .pane{display:none;}
  .pane.on{display:block;}
  .section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px;}
  .section-title h2{font-size:19px;font-weight:700;letter-spacing:-.3px;}
  .section-title a{font-size:13px;font-weight:600;color:var(--gold-deep);text-decoration:none;}
  .foot-note{text-align:center;font-size:12px;color:var(--muted);margin:26px 0 6px;line-height:1.6;}
  .sim-action{margin-left:auto;border:0;background:transparent;color:var(--gold-deep);font:inherit;font-size:12px;font-weight:800;cursor:pointer;padding:4px 0;}
  .sim-action:focus-visible,.tab:focus-visible,.seg button:focus-visible,.lang:focus-visible,.cta:focus-visible{outline:3px solid rgba(199,154,59,.42);outline-offset:3px;}
  .live.running .dot{animation:pulse .65s infinite;}
  .live.running .sim-action{opacity:.55;cursor:wait;}
  html[data-theme="dark"] .app{background:radial-gradient(600px 300px at 90% -40px,rgba(216,173,85,.16),transparent 60%),radial-gradient(500px 260px at -20% 10%,rgba(199,154,59,.08),transparent 60%),var(--cream);}
html[data-theme="dark"] .hero,html[data-theme="dark"] .visit{background:linear-gradient(150deg,#292318 0%,#241F16 60%,#302616 100%);}
html[data-theme="dark"] .seg{background:#302A1E;}
html[data-theme="dark"] .lang.on{background:#302716;}
html[data-theme="dark"] .tabbar{background:rgba(36,32,22,.9);}
html[data-theme="dark"] .b-tiede{background:#49331D;color:#F2B96D;}
html[data-theme="dark"] .b-froid{background:#343027;color:#C0B395;}
html[data-theme="dark"] .b-ok{background:#1F3A27;color:#7CE198;}
html[data-theme="dark"] .b-chaud{background:#5A4218;color:#F3D58F;}
html[data-theme="dark"] .toast{background:#F8F0DF;color:#221B10;}
  @media (min-width:760px){
    .app{max-width:760px;padding-left:34px;padding-right:34px;}
    .tabbar{max-width:760px;padding-left:90px;padding-right:90px;}
    .kpis{grid-template-columns:repeat(4,1fr);}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  }

  /* 2026 redesign — calm, high-trust SaaS dashboard */
  :root{
    --cream:#F4F6F8;
    --cream-2:#E9EDF2;
    --card:#FFFFFF;
    --ink:#172033;
    --muted:#687386;
    --gold:#2563EB;
    --gold-light:#DCE8FF;
    --gold-deep:#1D4ED8;
    --bronze:#1D4ED8;
    --line:#E2E7EE;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.055);
    --green:#16856F;
    --orange:#B85C16;
    --navy:#111B2E;
    --radius:16px;
  }
  body{background:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;}
  .app{max-width:1120px;margin:0 auto;background:var(--cream);padding:0 22px calc(108px + env(safe-area-inset-bottom));}
  .topbar{padding:28px 0 2px;}
  .date{font-size:12px;letter-spacing:.04em;text-transform:none;color:var(--muted);}
  .top-actions{gap:12px;}
  .language-switch{padding:2px;border-color:var(--line);border-radius:9px;box-shadow:none;}
  .language-switch button{min-width:31px;padding:6px 5px;border-radius:7px;color:var(--muted);}
  .language-switch button.on{background:var(--navy);color:#fff;}
  html[data-theme="light"]{color-scheme:light;}
  html[data-theme="dark"]{color-scheme:dark;}
  .theme-toggle{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0;}
  .theme-toggle svg{width:18px;height:18px;}
  .theme-toggle .ic-sun{display:none;}
  html[data-theme="dark"] .theme-toggle .ic-sun{display:block;}
  html[data-theme="dark"] .theme-toggle .ic-moon{display:none;}
  .avatar{width:38px;height:38px;background:var(--navy);box-shadow:none;font-size:12px;}
  h1{font-size:30px;font-weight:720;letter-spacing:-.7px;margin:6px 0 4px;}
  .sub{font-size:14px;margin-bottom:7px;}
  .demo-chip{margin-top:4px;padding:5px 9px;border-radius:7px;background:#EDF3FF;border-color:#D8E5FF;color:#2458B8;font-size:11px;}
  .live{margin:16px 0 20px;border-radius:12px;padding:11px 14px;box-shadow:none;border-color:var(--line);font-size:13px;}
  .live .dot{width:8px;height:8px;background:#22A06B;box-shadow:0 0 0 3px rgba(34,160,107,.13);}
  .live small{font-size:11px;letter-spacing:.04em;}
  .sim-action{color:var(--gold-deep);padding:5px 8px;border-radius:7px;}
  .sim-action:hover{background:#EDF3FF;}

  .card{border-color:var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;}
  .card h3{font-size:15px;font-weight:700;}
  .card .hint{font-size:12px;}
  .hero{background:var(--navy);border:0;color:#fff;min-height:180px;display:flex;flex-direction:column;justify-content:center;}
  .hero::after{display:none;}
  .hero-num{font-size:50px;font-weight:720;color:#fff;background:none;-webkit-text-fill-color:currentColor;}
  .hero-label{color:#DCE5F5;font-size:14px;font-weight:500;}
  .wave{height:34px;margin:12px 0 5px;gap:4px;overflow:hidden;}
  .wave span{width:4px;background:#5B8DEF;border-radius:3px;}
  .hero-foot{color:#9FACC1;font-size:12px;gap:14px;}
  .hero-foot b{color:#fff;}
  .kpis{gap:12px;}
  .kpi{border-radius:14px;border-color:var(--line);box-shadow:var(--shadow);padding:16px;min-height:112px;}
  .kpi .v{font-size:27px;font-weight:720;}
  .kpi .v.gold{background:none;-webkit-text-fill-color:currentColor;color:var(--gold-deep);}
  .kpi .l{font-size:12px;line-height:1.35;}
  .kpi .d{font-size:11px;color:var(--green);}
  .bars{height:170px;gap:12px;padding-top:12px;}
  .bar{max-width:none;border-radius:5px 5px 2px 2px;background:#D8E4FA;box-shadow:none;}
  .bar.today{background:var(--gold);}
  .bar-col.today span{color:var(--gold-deep);}
  .section-title{margin:22px 1px 10px;}
  .section-title h2{font-size:17px;letter-spacing:-.2px;}
  .section-title a{color:var(--gold-deep);font-size:12px;}
  .row{padding:14px 2px;border-color:var(--line);}
  .pic{width:40px;height:40px;border-radius:11px;box-shadow:none;font-size:12px;}
  .row .name{font-size:14px;}
  .row .meta{font-size:12px;}
  .badge{font-size:10px;padding:5px 8px;border-radius:7px;}
  .b-chaud{background:#FFF3D6;color:#8A5A00;}
  .b-tiede{background:#FFF0E5;color:#9A4A14;}
  .b-froid{background:#EEF1F4;color:#596579;}
  .b-ok{background:#E4F5EF;color:#08765B;}
  .visit{background:var(--card);border-color:var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);}
  .vdate{width:48px;height:50px;border-radius:10px;background:#EDF3FF;color:var(--gold-deep);box-shadow:none;}
  .vdate b{font-size:17px;}
  .visit .t{font-size:14px;}
  .visit .a{font-size:12px;}
  .seg{background:#E7EBF0;border-radius:10px;padding:3px;}
  .seg button{border-radius:8px;font-size:13px;padding:8px 0;}
  .seg button.on{box-shadow:0 1px 3px rgba(16,24,40,.12);}
  .search{border-radius:11px;padding:11px 13px;box-shadow:none;}
  .week{gap:7px;}
  .day{border-radius:10px;box-shadow:none;padding:9px 0;}
  .day.on{background:var(--navy);}

  .hero-next button{margin-left:auto;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:8px;cursor:pointer;}
  .hero-next button:hover{background:rgba(255,255,255,.16);}

  /* channel chips */
  .ch{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.03em;padding:4px 7px;border-radius:6px;white-space:nowrap;}
  .ch-sms{background:#EAF1FF;color:#2458B8;}
  .ch-wa{background:#E4F5EF;color:#08765B;}
  .ch-ig{background:#FCE8F3;color:#A0296A;}
  .ch-fb{background:#E7EEFD;color:#2D4FA3;}
  html[data-theme="dark"] .ch-sms{background:#1B3561;color:#AFC7FF;}
  html[data-theme="dark"] .ch-wa{background:#15382E;color:#79D8BC;}
  html[data-theme="dark"] .ch-ig{background:#43213A;color:#F3A6D0;}
  html[data-theme="dark"] .ch-fb{background:#1D2D55;color:#A9C0F5;}
  .msg-bubble-row{display:flex;margin-bottom:10px;}
  .msg-bubble-row.ai{justify-content:flex-end;}
  .msg-bubble{max-width:82%;font-size:12.5px;line-height:1.5;padding:10px 12px;border-radius:12px 12px 12px 4px;background:var(--cream);border:1px solid var(--line);}
  .msg-bubble-row.ai .msg-bubble{background:#EAF1FF;border-color:#DCE7FC;border-radius:12px 12px 4px 12px;}
  html[data-theme="dark"] .msg-bubble-row.ai .msg-bubble{background:#172A4A;border-color:#294270;}
  .msg-bubble small{display:block;font-size:10px;color:var(--muted);margin-top:4px;font-weight:700;}
  .approve-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:var(--cream);}
  .approve-bar span{font-size:11px;color:var(--muted);margin-right:auto;}

  /* briefings */
  .brief-layout{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.2fr);gap:16px;align-items:start;}
  @media (max-width:899px){.brief-layout{grid-template-columns:1fr;}}
  .slot{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .slot:last-of-type{border-bottom:0;}
  .slot-time{font-size:18px;font-weight:750;letter-spacing:-.3px;width:62px;}
  .slot-info{flex:1;min-width:0;}
  .slot-info b{display:block;font-size:13px;}
  .slot-info span{font-size:11.5px;color:var(--muted);}
  .switch{position:relative;width:42px;height:24px;border-radius:999px;border:0;background:#CBD3DF;cursor:pointer;flex:0 0 auto;transition:background .2s;}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s;}
  .switch.on{background:var(--gold);}
  .switch.on::after{transform:translateX(18px);}
  html[data-theme="dark"] .switch{background:#34425A;}
  html[data-theme="dark"] .switch.on{background:var(--gold);}
  .brief-row{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 4px;}
  .brief-row:last-child{border-bottom:0;}
  .brief-row:hover{background:var(--cream);}
  .brief-row.active{background:#EDF3FF;border-radius:10px;padding-left:10px;padding-right:10px;}
  html[data-theme="dark"] .brief-row.active{background:#172A4A;}
  .brief-ico{width:38px;height:38px;border-radius:11px;background:#EDF3FF;color:var(--gold-deep);display:grid;place-items:center;font-size:17px;flex:0 0 auto;}
  html[data-theme="dark"] .brief-ico{background:#172A4A;}
  .brief-row .info b{display:block;font-size:13.5px;}
  .brief-row .info span{font-size:11.5px;color:var(--muted);}
  .action-list{list-style:none;margin:4px 0 0;}
  .action-list li{font-size:12px;line-height:1.5;padding:6px 0 6px 20px;position:relative;border-bottom:1px dashed var(--line);}
  .action-list li:last-child{border-bottom:0;}
  .action-list li::before{content:"✓";position:absolute;left:2px;color:var(--green);font-weight:800;}

  /* réseaux */
  .soc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:760px){.soc-grid{grid-template-columns:1fr;}}
  .soc-head{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .soc-logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;}
  .soc-logo.ig{background:linear-gradient(135deg,#F58529,#DD2A7B 55%,#8134AF);}
  .soc-logo.fb{background:#1877F2;}
  .post-thumb{display:flex;gap:12px;align-items:center;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;}
  .post-thumb .img{width:54px;height:54px;border-radius:9px;background:linear-gradient(135deg,#DCE8FF,#9DBCFB);flex:0 0 auto;display:grid;place-items:center;font-size:22px;}
  html[data-theme="dark"] .post-thumb .img{background:linear-gradient(135deg,#243B68,#3B74E8);}
  .post-thumb b{display:block;font-size:12.5px;}
  .post-thumb span{font-size:11px;color:var(--muted);}
  .metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .metric{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px;}
  .metric b{display:block;font-size:19px;letter-spacing:-.4px;}
  .metric span{font-size:10.5px;color:var(--muted);}
  .mini-bars{display:flex;align-items:flex-end;gap:6px;height:60px;margin-top:14px;}
  .mini-bars div{flex:1;border-radius:4px 4px 2px 2px;background:#D8E4FA;}
  .mini-bars div.last{background:var(--gold);}
  html[data-theme="dark"] .mini-bars div{background:#263A60;}
  html[data-theme="dark"] .mini-bars div.last{background:#6E9BFF;}

  /* assistant + chat */
  .asst-layout{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.2fr);gap:16px;align-items:start;}
  @media (max-width:899px){.asst-layout{grid-template-columns:1fr;}}
  .orb{display:grid;place-items:center;color:#fff;font-size:26px;font-weight:800;}
  .persona-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .persona-btn{flex:1;min-width:88px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 8px;font:inherit;font-size:12.5px;font-weight:750;color:var(--muted);cursor:pointer;}
  .persona-btn.on{border-color:#B9CDF8;color:var(--gold-deep);background:#EDF3FF;}
  html[data-theme="dark"] .persona-btn.on{background:#172A4A;border-color:#294270;}
  .chat{padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:520px;}
  .chat-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);}
  .chat-head .mini-orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9DBCFB,#3B74E8 58%,#173F94);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;}
  .chat-head b{font-size:14px;display:block;}
  .chat-head span{font-size:11px;color:var(--green);font-weight:700;}
  .chat-body{flex:1;padding:16px 18px;overflow-y:auto;max-height:430px;display:flex;flex-direction:column;gap:9px;}
  .cmsg{max-width:84%;font-size:13px;line-height:1.5;padding:10px 13px;border-radius:14px;white-space:pre-line;animation:cin .25s ease;}
  @keyframes cin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .cmsg.ai{align-self:flex-start;background:var(--cream);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .cmsg.me{align-self:flex-end;background:var(--gold);color:#fff;border-bottom-right-radius:4px;}
  .cmsg.typing{display:flex;gap:4px;padding:12px 14px;}
  .cmsg.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tdot 1s infinite;}
  .cmsg.typing i:nth-child(2){animation-delay:.15s}.cmsg.typing i:nth-child(3){animation-delay:.3s}
  @keyframes tdot{0%,100%{opacity:.3;}50%{opacity:1;}}
  .chat-sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 12px;}
  .chat-sugg button{border:1px solid var(--line);background:var(--card);color:var(--gold-deep);font:inherit;font-size:11.5px;font-weight:700;padding:7px 10px;border-radius:999px;cursor:pointer;}
  .chat-form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--cream);}
  .chat-form input{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:11px 13px;border-radius:10px;outline:0;}
  .chat-form input:focus{border-color:var(--gold);}
  .chat-form button{border:0;background:var(--gold);color:#fff;font:inherit;font-weight:750;font-size:13px;padding:0 16px;border-radius:10px;cursor:pointer;}
  .human-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--cream);border:1px solid var(--line);}
  .variant-link{font-size:11px;font-weight:700;color:var(--gold-deep);text-decoration:none;}
</style>
</head>

/* ================= STATIC TEXT ================= */
function applyStatic(){
  document.documentElement.lang = uiLang;
  document.querySelectorAll("[data-t]").forEach(el=>{ const k = el.dataset.t; if(U[uiLang][k]!==undefined) el.innerHTML = fill(U[uiLang][k]); });
  document.querySelectorAll("[data-ui-lang]").forEach(b=>b.classList.toggle("on", b.dataset.uiLang===uiLang));
  document.getElementById("tabAsst").textContent = P().name;
  document.getElementById("emailSearch").placeholder = u("search");
  document.getElementById("q").placeholder = u("qph");
  document.getElementById("chatInput").placeholder = fill(u("chatPh"));
  document.getElementById("clientAv").textContent = client.slice(0,2).toUpperCase();
  const now = new Date(2026,8,22,8,5,0), h = now.getHours();
  document.getElementById("greeting").textContent = u("greet")[h<12?0:h<18?1:2]+", "+client;
  document.getElementById("dateLine").textContent = now.toLocaleDateString(u("locale"),{weekday:"long",day:"numeric",month:"long"}).replace(/^./,c=>c.toUpperCase());
  document.title = "AI Staff — "+(uiLang==="en"?"Dashboard":uiLang==="es"?"Panel":"Tableau de bord")+" · "+P().name;

}
function paintSim(){
  const top = document.getElementById("simulateCall"), big = document.getElementById("simulateCallAsst");
  if(simRunning){ document.getElementById("liveLabel").textContent = fill(u("simRun")); top.textContent = big.textContent = u("simProg"); }

}

function buildWave(){
