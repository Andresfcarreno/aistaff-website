<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<script>
(function(){try{var t=localStorage.getItem("aistaff-theme");if(!t){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<title>AI Staff · Tableau de bord</title>
<meta name="description" content="Tableau de bord AI Staff : appels, messages, courriels, agenda et contacts, avec votre assistante IA.">
<style>
/* ================= tokens: aluminium (clair) / graphite (sombre) ================= */
:root{
  --bg:#ECEEF2; --bg-grad:linear-gradient(180deg,#F4F5F8 0%,#E9EBF0 100%);
  --side:rgba(244,245,248,.78); --side-line:rgba(0,0,0,.07);
  --card:#FFFFFF; --card-2:#F7F8FA; --raise:#FFFFFF;
  --ink:#1D1D1F; --ink-2:#3A3A3C; --muted:#6E6E73; --faint:#A1A1A6;
  --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.05);
  --blue:#1F6FEB; --blue-2:#1858C4; --blue-soft:rgba(31,111,235,.10);
  --green:#1E9E52; --amber:#B86E00; --red:#D93B3B; --violet:#6E56F8;
  --amber-soft:rgba(232,154,0,.13); --green-soft:rgba(30,158,82,.11); --red-soft:rgba(217,59,59,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --seq:42,120,214;
  --sms:#2DBE5A; --wa:#00A884; --ig1:#F58529; --ig2:#DD2A7B; --ig3:#8134AF; --fb:#0866FF; --mail:#1F6FEB; --call:#5E5CE6;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05);
  --shadow-lg:0 22px 60px rgba(16,24,40,.18),0 2px 8px rgba(16,24,40,.06);
  --r:16px; --r-sm:11px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121316; --bg-grad:linear-gradient(180deg,#17181B 0%,#111214 100%);
  --side:rgba(30,31,35,.78); --side-line:rgba(255,255,255,.07);
  --card:#1C1D21; --card-2:#232429; --raise:#26272C;
  --ink:#F5F5F7; --ink-2:#D1D1D6; --muted:#98989D; --faint:#6B6B70;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.05);
  --blue:#3B82F6; --blue-2:#2F6FDB; --blue-soft:rgba(59,130,246,.16);
  --green:#34C77B; --amber:#F0A53C; --red:#F06E6E; --violet:#9A87FF;
  --amber-soft:rgba(240,165,60,.15); --green-soft:rgba(52,199,123,.14); --red-soft:rgba(240,110,110,.14);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --seq:57,135,229;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --shadow-lg:0 22px 60px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg-grad);background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
::selection{background:var(--blue-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ================= shell ================= */
.app{display:grid;grid-template-columns:236px 1fr;height:100vh;height:100dvh}
.side{background:var(--side);backdrop-filter:saturate(1.8) blur(24px);-webkit-backdrop-filter:saturate(1.8) blur(24px);border-right:1px solid var(--side-line);display:flex;flex-direction:column;padding:14px 10px 12px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 210deg,#1F6FEB,#7C5CFF,#22C7E8,#1F6FEB);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 4px 10px rgba(31,111,235,.3)}
.brand b{display:block;font-size:14.5px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav-h{font-size:11px;font-weight:600;color:var(--faint);padding:12px 12px 4px;letter-spacing:.02em}
.ni{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 10px;border-radius:9px;color:var(--ink-2);font-size:14px;text-align:left;width:100%;transition:background .15s}
.ni svg{width:18px;height:18px;flex:none;color:var(--muted)}
.ni:hover{background:var(--line-2)}
.ni.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.ni.on svg{color:var(--blue)}
.ni .cnt{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--line-2);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.ni .cnt.hot{background:var(--blue);color:#fff}
.asst-card{margin-top:10px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:var(--shadow)}
.asst-card .mini{width:38px;height:38px;border-radius:50%;flex:none;position:relative;background:radial-gradient(circle at 50% 45%,#12305e,#030812);overflow:hidden}
.asst-card .mini canvas{position:absolute;inset:0;width:100%;height:100%}
.asst-card b{display:block;font-size:13.5px}
.asst-card small{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.acct{display:flex;align-items:center;gap:8px;margin-top:8px;border:0;background:none;padding:8px 10px;border-radius:9px;color:var(--muted);font-size:13px;width:100%;text-align:left}
.acct:hover{background:var(--line-2);color:var(--ink)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px 12px;min-height:62px}
.top h1{font-size:22px;letter-spacing:-.02em;margin:0;font-weight:700}
.top .sub{color:var(--muted);font-size:13px;margin-left:2px}
.top .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--muted);min-width:220px;cursor:text;box-shadow:var(--shadow)}
.search svg{width:15px;height:15px}
.search kbd{margin-left:auto;font-family:var(--font);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--faint)}
.seg{display:inline-flex;background:var(--line-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:4px 9px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ibtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--shadow)}
.ibtn svg{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.pill.live{color:var(--green)}
.views{flex:1;min-height:0;overflow:auto;padding:4px 26px 26px;scroll-behavior:smooth}
.view{display:none;animation:vin .32s cubic-bezier(.2,.7,.2,1)}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ================= building blocks ================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.ch h3{margin:0;font-size:14px;font-weight:600}
.ch .muted{margin-left:auto}
.cb{padding:12px 16px 16px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;border:1px solid var(--line);background:var(--card);padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:0 1px 1px rgba(0,0,0,.04);transition:background .15s,transform .1s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--card-2)}
.btn:active{transform:scale(.98)}
.btn svg{width:15px;height:15px}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:var(--blue-2)}
.btn.ghost{background:none;box-shadow:none;border-color:transparent;color:var(--blue)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.hot{color:var(--red);background:var(--red-soft)} .tag.req{color:var(--amber);background:var(--amber-soft)}
.tag.ok{color:var(--green);background:var(--green-soft)} .tag.info{color:var(--blue);background:var(--blue-soft)}
.tag.miss{color:var(--muted);background:var(--line-2)} .tag.ph{color:var(--violet);background:color-mix(in srgb,var(--violet) 13%,transparent)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12.5px;font-weight:700;flex:none;letter-spacing:.02em}
.av.lg{width:52px;height:52px;font-size:17px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.spark{display:block;width:100%;height:34px}
.dotc{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.kbd{font-size:11px;color:var(--faint)}

/* ================= home ================= */
.home{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.span-3{grid-column:span 3}
.hello{display:flex;gap:22px;align-items:center;padding:20px 22px;background:linear-gradient(135deg,var(--card) 0%,var(--card-2) 100%);position:relative;overflow:hidden}
.hello:after{content:"";position:absolute;right:-120px;top:-140px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.10),transparent 65%);pointer-events:none}
.orbx{width:128px;height:128px;border-radius:50%;flex:none;position:relative;cursor:pointer;background:radial-gradient(circle at 50% 45%,rgba(18,40,90,.96) 0%,#06122a 55%,#020610 100%);box-shadow:0 10px 30px rgba(31,80,200,.28),inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .25s}
.orbx:hover{transform:scale(1.03)}
.orbx canvas{position:absolute;inset:0;width:100%;height:100%}
.orbx .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;font-size:13px;opacity:0;transition:opacity .2s}
.orbx:hover .play{opacity:1}
.hello h2{margin:0;font-size:26px;letter-spacing:-.025em;font-weight:700}
.hello .date{color:var(--muted);font-size:13px;margin:2px 0 10px}
.brief{font-size:15px;line-height:1.55;color:var(--ink-2);max-width:780px;min-height:46px}
.brief .w{transition:color .15s,opacity .15s}
.brief.reading .w{opacity:.38}.brief.reading .w.on{opacity:1}
.hello .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.shimmer{display:inline-block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line-2),var(--line),var(--line-2));background-size:200% 100%;animation:sh 1.2s linear infinite;margin:4px 0}
@keyframes sh{to{background-position:-200% 0}}
.todo{display:flex;flex-direction:column}
.todo-i{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line-2);cursor:pointer;transition:background .15s;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;width:100%}
.todo-i:first-child{border-top:0}
.todo-i:hover{background:var(--card-2)}
.todo-i .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:14px}
.todo-i b{display:block;font-size:13.5px;font-weight:600}
.todo-i small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.todo-i .go{margin-left:auto;color:var(--faint)}
.kpi{padding:14px 16px 12px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi .d.up{color:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart .axis{font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--raise);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:8px 10px;font-size:12.5px;min-width:130px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip b{display:block;margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:7px;justify-content:space-between}
.tip .r span{display:flex;align-items:center;gap:6px;color:var(--muted)}
.hm{display:grid;gap:3px}
.hm .c{border-radius:5px;height:24px;position:relative}
.hm .lab{font-size:11px;color:var(--muted);display:flex;align-items:center}
.hbar{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .t{height:10px;border-radius:0 5px 5px 0;background:var(--s1)}
.hbar .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.stack100{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0 10px}
.agenda-mini .ev{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line-2);align-items:flex-start}
.agenda-mini .ev:first-child{border-top:0}
.agenda-mini .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;width:46px;flex:none}
.agenda-mini .bar{width:3px;border-radius:2px;align-self:stretch;flex:none}

/* ================= split views (calls, messages, email) ================= */
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;height:calc(100vh - 100px);height:calc(100dvh - 100px);min-height:520px}
.list{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.list-h{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line-2)}
.list-b{overflow:auto;flex:1;padding:6px}
.field{display:flex;align-items:center;gap:8px;background:var(--card-2);border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;color:var(--muted)}
.field input{border:0;background:none;outline:0;flex:1;min-width:0;font-size:13.5px;color:var(--ink)}
.field svg{width:14px;height:14px}
.row{display:flex;gap:11px;padding:10px;border-radius:11px;cursor:pointer;align-items:flex-start;border:0;background:none;width:100%;text-align:left;transition:background .12s}
.row:hover{background:var(--card-2)}
.row.on{background:var(--blue-soft)}
.row .body{flex:1;min-width:0}
.row .t1{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px}
.row .t1 .when{margin-left:auto;font-weight:500;font-size:12px;color:var(--muted);white-space:nowrap}
.row .t2{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.row .unread{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none;margin-top:6px}
.pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane-h{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.pane-h h2{margin:0;font-size:18px;letter-spacing:-.015em}
.pane-h .meta{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.pane-h .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.pane-b{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:0}
.pane-b>.col{min-height:0;overflow:auto;padding:16px 18px}
.pane-b>.col+.col{border-left:1px solid var(--line-2)}
.ai-sum{border-radius:14px;padding:14px 14px 12px;background:linear-gradient(135deg,rgba(31,111,235,.07),rgba(124,92,255,.07));border:1px solid rgba(31,111,235,.16)}
.ai-sum .who{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--blue);margin-bottom:6px;letter-spacing:.01em}
.ai-sum .who i{width:16px;height:16px;border-radius:50%;background:conic-gradient(from 210deg,#1F6FEB,#7C5CFF,#22C7E8,#1F6FEB)}
.ai-sum p{margin:0;font-size:14px;line-height:1.5}
.ai-sum .next{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.fact{background:var(--card-2);border-radius:11px;padding:9px 11px}
.fact span{display:block;font-size:11.5px;color:var(--muted)}
.fact b{font-size:13.5px;font-weight:600}
.sec-t{font-size:12px;font-weight:700;color:var(--muted);margin:18px 0 8px;letter-spacing:.02em;text-transform:uppercase}
.bubbles{display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;font-size:13.5px;line-height:1.42;position:relative}
.bub.them{align-self:flex-start;background:var(--card-2);border:1px solid var(--line-2);border-bottom-left-radius:5px}
.bub.us{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.bub.owner{align-self:flex-end;background:var(--ink);color:var(--card);border-bottom-right-radius:5px}
.bub small{display:block;font-size:10.5px;opacity:.7;margin-top:3px}
.bub .by{display:block;font-size:10.5px;font-weight:700;opacity:.85;margin-bottom:1px}
.tr-h{display:flex;align-items:center;gap:8px;position:sticky;top:-16px;background:var(--card);padding:6px 0 10px;z-index:1}

/* messages */
.chs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:all .15s}
.chb .ico{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:10px}
.chb.on{color:#fff;border-color:transparent}
.chb .n{font-size:11px;opacity:.75}
.ico.sms{background:var(--sms)}.ico.wa{background:var(--wa)}.ico.ig{background:linear-gradient(45deg,var(--ig1),var(--ig2),var(--ig3))}.ico.fb{background:var(--fb)}.ico.all{background:#8E8E93}.ico.mail{background:var(--mail)}.ico.call{background:var(--call)}
.chb.on.all{background:#3A3A3C}.chb.on.sms{background:var(--sms)}.chb.on.wa{background:var(--wa)}.chb.on.ig{background:linear-gradient(45deg,var(--ig1),var(--ig2),var(--ig3))}.chb.on.fb{background:var(--fb)}
.chb.on .ico{background:rgba(255,255,255,.25)}
.chat-pane{display:flex;flex-direction:column;min-height:0;flex:1}
.chat-scroll{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.chat-scroll .day{align-self:center;font-size:11.5px;color:var(--faint);margin:6px 0}
.bub.ch-sms.us{background:var(--sms)}.bub.ch-wa.us{background:var(--wa)}.bub.ch-ig.us{background:linear-gradient(135deg,var(--ig2),var(--ig3))}.bub.ch-fb.us{background:var(--fb)}
.composer{border-top:1px solid var(--line-2);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.qr{display:flex;gap:6px;flex-wrap:wrap}
.qr button{border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink-2)}
.qr button:hover{border-color:var(--blue);color:var(--blue)}
.cbox{display:flex;align-items:flex-end;gap:8px;background:var(--card-2);border:1px solid var(--line);border-radius:18px;padding:6px 6px 6px 14px}
.cbox textarea{flex:1;border:0;background:none;outline:0;resize:none;max-height:120px;font-size:14px;padding:5px 0;min-height:22px}
.send{width:32px;height:32px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.send svg{width:15px;height:15px}
.send[disabled]{opacity:.4}
.cnote{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}

/* email */
.mail-body{font-size:14.5px;line-height:1.6;white-space:pre-wrap;color:var(--ink-2)}
.replies{display:flex;flex-direction:column;gap:8px}
.reply-opt{border:1px solid var(--line);background:var(--card-2);border-radius:12px;padding:10px 12px;font-size:13.5px;text-align:left;line-height:1.45;color:var(--ink-2);transition:border-color .15s}
.reply-opt:hover{border-color:var(--blue)}
.reply-opt b{display:block;font-size:11.5px;color:var(--blue);margin-bottom:2px}
.draft{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;background:var(--card-2);padding:10px 12px;font-size:14px;line-height:1.5;resize:vertical;outline:0}
.draft:focus{border-color:var(--blue)}

/* agenda */
.cal{display:grid;grid-template-columns:52px repeat(7,1fr);position:relative;min-width:760px}
.cal-wrap{overflow:auto;max-height:calc(100vh - 210px);max-height:calc(100dvh - 210px)}
.cal .hd{position:sticky;top:0;background:var(--card);z-index:2;padding:10px 6px 8px;text-align:center;border-bottom:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.cal .hd b{display:block;font-size:19px;color:var(--ink);font-weight:600}
.cal .hd.today b{background:var(--blue);color:#fff;border-radius:50%;width:32px;height:32px;line-height:32px;margin:2px auto 0}
.cal .hr{height:52px;border-top:1px solid var(--line-2);font-size:11px;color:var(--faint);text-align:right;padding-right:8px;transform:translateY(-7px)}
.cal .col{position:relative;border-left:1px solid var(--line-2)}
.cal .col .slot{height:52px;border-top:1px solid var(--line-2)}
.cal .ev{position:absolute;left:4px;right:4px;border-radius:8px;padding:5px 7px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;border-left:3px solid;transition:transform .12s}
.cal .ev:hover{transform:scale(1.02);z-index:3}
.cal .ev b{display:block;font-weight:600}
.ev.conf{background:color-mix(in srgb,var(--s1) 13%,var(--card));border-color:var(--s1)}
.ev.req{background:var(--amber-soft);border-color:var(--amber);border-style:dashed}
.ev.out{background:color-mix(in srgb,var(--violet) 12%,var(--card));border-color:var(--violet)}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:2}
.now-line:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.cal-side{display:flex;flex-direction:column;gap:16px}

/* contacts */
.ctable{width:100%;border-collapse:collapse;font-size:13.5px}
.ctable th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.ctable td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.ctable tr{cursor:pointer;transition:background .12s}
.ctable tbody tr:hover{background:var(--card-2)}
.chan{display:flex;gap:4px}
.chan .ico{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:10px}

/* sheet (slide-over) + modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.28);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:12px;right:12px;bottom:12px;width:min(440px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);z-index:61;transform:translateX(110%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
.sheet.on{transform:none}
.sheet-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.sheet-b{flex:1;overflow:auto;padding:16px 18px}
.modal{position:fixed;left:50%;top:14vh;transform:translate(-50%,-10px) scale(.98);width:min(560px,calc(100vw - 24px));background:var(--raise);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);z-index:61;opacity:0;pointer-events:none;transition:all .2s;overflow:hidden}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.cmdk input{width:100%;border:0;outline:0;background:none;font-size:16px;padding:16px 18px;border-bottom:1px solid var(--line)}
.cmdk .res{max-height:50vh;overflow:auto;padding:6px}
.cmdk .it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer}
.cmdk .it.on,.cmdk .it:hover{background:var(--blue-soft)}
.cmdk .it small{margin-left:auto;color:var(--muted)}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ti{position:relative;padding:6px 0 10px}
.tl .ti:before{content:"";position:absolute;left:-17px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--blue)}
.tl .ti small{color:var(--muted);display:block}
.form{display:grid;gap:10px}
.form label{font-size:12px;color:var(--muted);display:grid;gap:4px}
.form input,.form textarea{border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:8px 10px;outline:0;font-size:14px}
.form input:focus,.form textarea:focus{border-color:var(--blue)}

/* assistant */
.asst{display:grid;grid-template-columns:1fr 320px;gap:16px;height:calc(100vh - 100px);height:calc(100dvh - 100px);min-height:520px}
.asst .chatbox{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.asst-h{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.asst-h .orbx{width:52px;height:52px;box-shadow:0 6px 16px rgba(31,80,200,.25)}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:10px;max-width:86%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m .bb{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.m.ai .bb{background:var(--card-2);border:1px solid var(--line-2);border-top-left-radius:6px}
.m.me .bb{background:var(--blue);color:#fff;border-top-right-radius:6px}
.m .mo{width:28px;height:28px;border-radius:50%;flex:none;background:conic-gradient(from 210deg,#1F6FEB,#7C5CFF,#22C7E8,#1F6FEB);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.m .tools{display:flex;gap:4px;margin-top:4px}
.m .tools button{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:6px}
.m .tools button:hover{background:var(--line-2);color:var(--ink)}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px}
.sugg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-2);box-shadow:0 1px 1px rgba(0,0,0,.03)}
.sugg button:hover{border-color:var(--blue);color:var(--blue)}
.slots .s{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-2)}
.slots .s:first-child{border-top:0}
.sw{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;border:0;flex:none;transition:background .2s;margin-left:auto}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--green)}.sw.on:after{transform:translateX(16px)}
.bignum{font-size:22px;font-weight:700;letter-spacing:-.02em;text-decoration:none;color:var(--ink);display:block;margin:2px 0 8px}

/* settings */
.set{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
.set-nav{position:sticky;top:0;display:flex;flex-direction:column;gap:2px}
.set-sec{margin-bottom:16px;scroll-margin-top:12px}
.set-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line-2)}
.set-row:first-of-type{border-top:0}
.set-row .lbl{flex:1}
.set-row .lbl small{display:block;color:var(--muted);font-size:12.5px}
.pers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px}
.per{border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:var(--card-2);transition:all .15s}
.per.on{border-color:var(--blue);background:var(--blue-soft)}
.per b{display:block;margin-top:8px}
.per small{color:var(--muted)}
.per .av{margin:0 auto;width:46px;height:46px;font-size:16px}
.ints{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:14px 16px}
.int{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:var(--card-2)}
.int .lg{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.int b{display:block;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 16px}
.chipx{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;background:var(--card-2);display:inline-flex;gap:6px;align-items:center}
.chipx.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);font-weight:600}
.plan-c{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px}
.plan{border:1.5px solid var(--line);border-radius:14px;padding:14px;background:var(--card-2)}
.plan.on{border-color:var(--blue);background:var(--blue-soft)}
.plan b{font-size:15px}.plan .pr{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:4px 0}
.plan small{color:var(--muted)}

/* voice console */
.vc{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at 50% 40%,rgba(18,40,90,.72),rgba(2,6,16,.92));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff}
.vc.on{display:flex;animation:vin .3s ease}
.vc-in{width:min(560px,100%);text-align:center}
.vc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;text-align:left}
.vc-top b{display:block;font-size:15px}.vc-top span{font-size:12px;color:#9FB3D9}
.vc-x{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font-size:18px}
.vc-stage{position:relative;width:min(380px,80vw);aspect-ratio:1;margin:0 auto}
.vc-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.vc-cap{min-height:96px;max-width:480px;margin:6px auto 0;font-size:18px;line-height:1.5;font-weight:600;color:rgba(234,241,255,.45)}
.vc-cap .w.on{color:#fff;text-shadow:0 0 14px rgba(120,180,255,.55)}
.vc-who{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7FB8FF;margin-bottom:6px}
.vc-ctrl{display:flex;justify-content:center;gap:12px;margin-top:14px}
.vc-btn{width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(135deg,#3B82F6,#1858C4);color:#fff;font-size:18px;box-shadow:0 0 30px rgba(59,130,246,.6)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:95;opacity:0;transition:all .25s;pointer-events:none;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tabbar{display:none}
.back{display:none}

/* ================= responsive ================= */
@media (max-width:1180px){
  .span-8,.span-7{grid-column:span 12}.span-4,.span-5{grid-column:span 12}
  .span-3{grid-column:span 6}
  .pane-b{grid-template-columns:1fr}
  .pane-b>.col+.col{border-left:0;border-top:1px solid var(--line-2)}
  .asst{grid-template-columns:1fr}.asst .side-cards{display:none}
}
@media (max-width:860px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto;min-height:100dvh}
  .side{display:none}
  .top{padding:12px 16px 8px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .top h1{font-size:20px}
  .search{min-width:0;width:34px;padding:0;justify-content:center;height:34px}.search span,.search kbd{display:none}
  .top .pill{display:none}
  .views{padding:4px 14px 96px;overflow:visible}
  .home{gap:12px}.span-3,.span-6{grid-column:span 12}
  .home .kpis{grid-column:span 12;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hello{flex-direction:column;align-items:flex-start;padding:18px}
  .orbx{width:96px;height:96px}
  .split{display:block;height:auto}
  .split .pane{display:none}
  .split.detail .list{display:none}
  .split.detail .pane{display:flex;min-height:calc(100dvh - 170px)}
  .back{display:inline-flex}
  .pane-b{display:block}.pane-b>.col{overflow:visible}
  .asst{display:block;height:auto}.asst .chatbox{min-height:calc(100dvh - 170px)}
  .set{grid-template-columns:1fr}.set-nav{display:none}
  .pers,.plan-c{grid-template-columns:1fr}
  .tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;background:var(--side);backdrop-filter:saturate(1.8) blur(22px);-webkit-backdrop-filter:saturate(1.8) blur(22px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:6px}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:5px 0;border-radius:12px}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button.on{color:var(--blue)}
  .sheet{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:86dvh;transform:translateY(110%)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= compléments ================= */
.ico svg{width:11px;height:11px;display:block}
.back[hidden]{display:none!important}
.seg.sm button{padding:3px 8px;font-size:11.5px}
.seg.full{display:flex}.seg.full button{flex:1}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.sm svg{width:13px;height:13px}
.cnt-b{font-size:11.5px;font-weight:700;color:#fff;background:var(--blue);border-radius:999px;padding:1px 7px;margin-left:2px}
.cnt-b.amber{background:var(--amber)}
.av.sm{width:26px;height:26px;font-size:10px;margin-left:-6px;box-shadow:0 0 0 2px var(--card)}
.av.xs{width:22px;height:22px;font-size:9px}
.av svg{width:55%;height:55%}
.ppl{display:flex;padding:8px 0 4px 6px;min-height:34px}
.kpis{grid-column:span 12;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi .spark{margin-top:6px}

.nm-edit{border:0;background:none;color:var(--faint);font-size:13px;font-weight:500;padding:2px 6px;border-radius:7px;opacity:.0;transition:opacity .2s}
.hello:hover .nm-edit,.nm-edit:focus{opacity:1}
.nm-edit:hover{background:var(--line-2);color:var(--ink)}
.nm-in{font-size:22px;font-weight:700;letter-spacing:-.02em;width:min(320px,100%)}
.orbx.speaking{box-shadow:0 0 0 6px rgba(59,130,246,.12),0 12px 44px rgba(31,80,200,.45)}
.orbx .play svg{width:14px;height:14px}
.h-act{grid-column:span 8}.h-todo{grid-column:span 4}.h-heat{grid-column:span 5}.h-why{grid-column:span 4}.h-ag{grid-column:span 3}
.todo-i .ic .ico{width:30px;height:30px;border-radius:9px}
.todo-i .ic .ico svg{width:15px;height:15px}
.todo-i .ic svg{width:16px;height:16px}
.todo-i .go svg{width:14px;height:14px}

.hm-leg{display:flex;align-items:center;gap:3px;justify-content:flex-end;margin-top:10px;font-size:11px;color:var(--muted)}
.hm-leg i{width:16px;height:9px;border-radius:3px;display:inline-block}
.hm-leg span{margin:0 4px}
.hbar>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar{cursor:default}
.stack100 span{display:block;height:100%}
.chart .hit{cursor:crosshair}

.chart svg{height:auto}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .t1 .tag{flex:none}
.row-h{display:flex;align-items:center;gap:8px;padding:4px 2px}
.row-h b{font-size:15px}.row-h .tag{margin-left:auto}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.av-ch{position:relative;flex:none;display:inline-flex}
.av-ch>.ico{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:6px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}
.av-ch>.ico svg{width:10px;height:10px}
.chip-ch{display:inline-flex;align-items:center;gap:5px}
.chip-ch .ico,.chan .ico{width:18px;height:18px;border-radius:6px;display:inline-grid;place-items:center}
.pane-h .av.lg{flex:none}
.ai-sum .next svg{width:15px;height:15px;color:var(--blue);flex:none}
.sum-strip{display:flex;gap:10px;align-items:baseline;padding:10px 18px;border-bottom:1px solid var(--line-2);background:linear-gradient(90deg,rgba(31,111,235,.06),rgba(124,92,255,.05));font-size:13px}
.sum-strip .who{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--blue);white-space:nowrap}
.sum-strip .who i{width:12px;height:12px;border-radius:50%;background:conic-gradient(from 210deg,#1F6FEB,#7C5CFF,#22C7E8,#1F6FEB)}
.cnote svg{width:13px;height:13px;flex:none}
.reply-opt.on{border-color:var(--blue);background:var(--blue-soft)}
.tr-h .btn{font-weight:600}
.person{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px;border-radius:12px;background:var(--card-2)}
/* agenda */
.agenda-l{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.cal-bar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.cal-bar h3{margin:0;font-size:15px;font-weight:600}
.cal .hrs{position:relative}
.cal .hr:first-child{visibility:hidden}
.cal .ev{color:var(--ink)}
.cal-list{display:none;padding:4px 16px 14px}
.cl-day .sec-t{margin-top:14px}
.mm-h{display:flex;align-items:center;margin-bottom:8px}.mm-h b{font-size:14px}
.mm{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mm .h{font-size:10.5px;color:var(--faint);font-weight:600;padding:2px 0 4px}
.mm button{border:0;background:none;font-size:12.5px;padding:6px 0;border-radius:8px;color:var(--ink-2);position:relative;font-variant-numeric:tabular-nums}
.mm button:hover{background:var(--line-2)}
.mm button.o{color:var(--faint)}
.mm button.wk{background:var(--blue-soft);border-radius:0}
.mm button.t{background:var(--blue);color:#fff;font-weight:700;border-radius:8px}
.mm button.e:after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--s1)}
.mm button.t.e:after{background:#fff}
/* contacts */
.ct-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.ct-n{display:flex;align-items:center;gap:10px}
.ct-n .av{width:30px;height:30px;font-size:11px}
.ctable td{white-space:nowrap}
.tl .ti .ico{width:16px;height:16px;border-radius:5px;display:inline-grid;place-items:center;vertical-align:-3px;margin-right:4px}
.tl .ti .ico svg{width:9px;height:9px}
.tl .ti span{display:block;margin-top:2px}
/* assistant */
.side-cards{display:flex;flex-direction:column;gap:16px;min-height:0;overflow:auto}
.asst-h #asstOrbSlot,.asst-h .orbx{flex:none}
.m .tools button{display:inline-flex;align-items:center;gap:4px}
.composer .cnote{margin-top:2px}
.can-i{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:13.5px;line-height:1.4}
.can-i .ok{width:18px;height:18px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none;margin-top:1px}
.can-i .ok svg{width:11px;height:11px}
.can-i .tag{flex:none}
.sw[disabled]{opacity:.45;cursor:not-allowed}
/* settings */
.set-nav{padding:6px}
.inp{border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:8px 10px;outline:0;font-size:14px;width:220px;max-width:100%}
.inp:focus{border-color:var(--blue)}
.int .tag{margin-top:3px}
.chipx svg{width:12px;height:12px}
.chipx.off{color:var(--muted);background:none;border-style:dashed}
.plan .tag{vertical-align:2px}
.per{cursor:pointer}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.more-grid .ni{border:1px solid var(--line);background:var(--card-2);padding:12px}
.sheet .acct{margin-top:12px}
.sheet-h .av.lg{flex:none}
.cmdk .it .av{flex:none}
.cmdk .it svg{width:17px;height:17px;color:var(--muted)}
.cmdk .nav-h{padding:10px 12px 4px}
.chs{flex-wrap:wrap;overflow:visible}
.cal .ev.short{padding:3px 6px;white-space:nowrap;text-overflow:ellipsis}
.cal .ev.short b{display:inline;font-size:11.5px}
.cal .ev{font-size:11.5px}
.tots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.tot .l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tot .l i{width:8px;height:8px;border-radius:50%}
.tot b{display:block;font-size:20px;letter-spacing:-.02em;margin-top:2px}
.tot small{color:var(--muted);font-size:11.5px}
.av.sm{margin-left:-4px}
.ct-top{grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.6fr)}
.ct-top .legend{gap:4px 10px;font-size:11.5px}
.cal .ev{padding:3px 6px;line-height:1.25}
.cal .ev b,.cal .ev span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .h-act,.h-todo,.h-heat{grid-column:span 12}.h-why,.h-ag{grid-column:span 6}
  .agenda-l{grid-template-columns:1fr}
  .cal-side{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .ct-top{grid-template-columns:repeat(2,minmax(0,1fr))}
  .asst{grid-template-columns:1fr;height:auto}
  .asst .chatbox{height:calc(100vh - 110px);height:calc(100dvh - 110px);min-height:480px}
  .asst .side-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));overflow:visible}
}
@media (max-width:860px){
  .kpis{gap:12px}
  .kpi .v{font-size:24px}
  .h-why,.h-ag{grid-column:span 12}
  .hello{order:0}.h-todo{order:1}.kpis{order:2}.h-ag{order:3}.h-act{order:4}.h-heat{order:5}.h-why{order:6}
  .nm-edit{opacity:1}
  .cal-wrap{display:none}.cal-list{display:block}
  .cal-bar .legend{margin-left:0!important}
  .cal-side{grid-template-columns:1fr}
  .ctable .hide-m{display:none}
  .ct-top{gap:12px}
  .pane-h{padding:14px}
  .pane-h .acts{margin-left:0;width:100%}
  .split.detail .pane{min-height:calc(100dvh - 120px)}
  .chat-pane{min-height:0}
  body.chat-open .tabbar{display:none}
  body.chat-open .views{padding-bottom:8px}
  body.chat-open .split.detail .pane{height:calc(100dvh - 74px);min-height:0}
  .qr{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .qr button{white-space:nowrap}
  .asst .chatbox{height:calc(100dvh - 150px);min-height:440px}
  .set-row{flex-wrap:wrap}
  .inp{width:100%}
}
</style>
</head>

}
async function token(){
  let s = getSes(); if(!s) return null;
  if(s.expires_at - 60 > Date.now()/1000) return s.access_token;
  try{
    const r = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {method:"POST", headers:{apikey:SB_KEY, "Content-Type":"application/json"}, body:JSON.stringify({refresh_token:s.refresh_token})});
    if(!r.ok) throw 0;
    const j = await r.json();
    s = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Math.floor(Date.now()/1000) + (j.expires_in || 3600)};

/* ---- brief : lecture à voix haute, mot par mot ---- */
let briefCtl = null;
function paintBriefBtn(){
  const b = $("#briefPlay"); if(!b) return;
  b.innerHTML = briefCtl ? `${ic("stop")}<span>${esc(B("stop"))}</span>` : `${ic("play")}<span>${esc(t("listen"))}</span>`;
  if(helloOrb) helloOrb.el.classList.toggle("speaking", !!briefCtl);
}
function briefStop(){
  if(briefCtl){ briefCtl.cancel(); briefCtl = null; }
  if(helloOrb) helloOrb.speaking = false;
  const el = $("#briefTxt"); if(el){ el.classList.remove("reading"); el.querySelectorAll(".w.on").forEach(s => s.classList.remove("on")); }
  paintBriefBtn();
}
function briefPlay(){
  if(briefCtl){ briefStop(); return; }
  const b = M.briefs[ui.briefIdx]; if(!b) return;
  const el = $("#briefTxt"); if(!el) return;
  const spans = el.querySelectorAll(".w");
  el.classList.add("reading");
  helloOrb.speaking = true;
  briefCtl = speak(briefText(b), {
    onWord(k){ if(spans[k]){ spans[k].classList.add("on"); } helloOrb.pulse = Math.min(1.2, helloOrb.pulse + .5); },
    onEnd(){ briefCtl = null; helloOrb.speaking = false; setTimeout(() => { if(!briefCtl) briefStop(); }, 900); }
  });
  paintBriefBtn();
}
async function newBrief(){
  if(ui.briefBusy) return;
  briefStop();
  ui.briefBusy = true; renderHome();
  try{
    if(M.demo){
      await new Promise(r => setTimeout(r, 1400));
      const keep = lang, text = {};
      ["fr","en","es"].forEach(l => { lang = l; text[l] = demoBrief(); }); lang = keep;
      M.briefs.unshift({at:new Date(), text});
    } else {
      const j = await ai({action:"brief"});
      M.briefs.unshift({at:new Date(j.created_at || Date.now()), text:j.text});
    }
    ui.briefIdx = 0; ui.briefBusy = false;
    if(view === "home"){ renderHome(); toast(B("briefReady")); briefPlay(); }
  }catch(e){
    ui.briefBusy = false; if(view === "home") renderHome(); toast(f(t("aiErr")));
  }
}
// Démo : un brief construit à partir des données d'exemple, selon l'heure.
function demoBrief(){
  const h = new Date().getHours(), nb = B("nb"), now = Date.now();
  const c24 = M.calls.filter(c => now - c.at < 864e5 && c.dur > 0).length;
  const reqs = M.events.filter(e => e.kind === "req" && e.at > now);
  const mails = M.mails.filter(e => e.status === "reply").length;
  const left = M.events.filter(e => dayDiff(e.at) === 0 && e.at > now).sort((a, b) => a.at - b.at);
  return [f(nb.hi, {h: t("hello")[h < 5 ? 0 : h < 12 ? 1 : h < 18 ? 2 : 3]}), f(nb.calls, {c:c24}),
    reqs.length ? f(nb.req, {k:reqs.length, l:reqs.map(e => `${pname(e.p)} (${whenShort(e.at)})`).join(", ")}) : "",
    mails ? f(nb.mail, {m:mails}) : "",
    left.length ? f(nb.left, {k:left.length, t:hm(left[0].at)}) : nb.none,
    reqs.length ? nb.next : nb.ok].filter(Boolean).join(" ");
}

function monday(d){ const x = sod(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
const hourL = h => lang === "en" ? dtf({hour:"numeric"}).format(new Date(2024, 0, 1, h)) : h + " h";
function lanes(list){
  // événements qui se chevauchent : côte à côte, comme dans Calendrier
  const out = []; let group = [], end = 0;
  const flush = () => { const n = Math.max(1, ...group.map(g => g.lane + 1)); group.forEach(g => g.n = n); out.push(...group); group = []; };
  list.slice().sort((a, b) => a.at - b.at).forEach(e => {
    if(group.length && e.at >= end) flush();
    const used = group.filter(g => g.end > e.at).map(g => g.lane);
    let lane = 0; while(used.includes(lane)) lane++;
    group.push(Object.assign({lane}, e)); end = Math.max(end, +e.end);
  });
  if(group.length) flush();
  return out;
}
const H0 = 7, H1 = 21, RH = 52;
function renderAgenda(){
  if(!ui.weekStart) ui.weekStart = sod(new Date());
  const ws = ui.weekStart, days = Array.from({length:7}, (_, i) => { const d = new Date(ws); d.setDate(d.getDate() + i); return d; });
  const we = new Date(ws); we.setDate(we.getDate() + 7);
  const evs = M.events.map((e, i) => Object.assign({i}, e)).filter(e => e.at >= ws && e.at < we);
  const col = {conf:"var(--s1)", req:"var(--amber)", out:"var(--violet)"};

async function aiSend(text){
  text = String(text || "").trim(); if(!text || ui.chatBusy) return;
  ui.chat.push({role:"user", text}); ui.chatBusy = true; paintChat();
  const ta = $("#aiIn"); if(ta){ ta.value = ""; ta.style.height = ""; }

function demoAnswer(q){
  const s = q.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""), D = k => B("da." + k);
  const evLine = e => `• ${hm(e.at)} · ${TX(e.title)}${e.p ? " · " + pname(e.p) : ""}`;
  const dayEv = k => M.events.filter(e => dayDiff(e.at) === k).sort((a, b) => a.at - b.at);
  if(/confirm/.test(s)){ const r = M.events.filter(e => e.kind === "req"); return r.length ? f(D("confirm"), {k:r.length, l:r.map(e => `• ${pname(e.p)} · ${whenShort(e.at)} · ${TX(e.title)}`).join("\n")}) : D("confirmNone"); }
  if(/demain|tomorrow|manana/.test(s)){ const e = dayEv(1), d = new Date(); d.setDate(d.getDate() + 1); return e.length ? f(D("tomorrow"), {d:dtf({weekday:"long", day:"numeric", month:"long"}).format(d), l:e.map(evLine).join("\n")}) : D("tomorrowNone"); }
  if(/important|urgent|urgen/.test(s)){ const c = M.calls.filter(x => x.tag === "hot" || x.tag === "req"); return f(D("hot"), {l:c.map(x => `• ${pname(x.p)} (${rel(x.at)}) · ${TX(x.next)}`).join("\n")}); }
  if(/courriel|mail|correo/.test(s)){ const m = M.mails.filter(e => e.status === "reply"); return f(D("mail"), {k:m.length, l:m.map(e => `• ${e.from} · ${TX(e.sum)}`).join("\n")}); }
  if(/message|texto|sms|whatsapp|mensaje|instagram|facebook/.test(s)) return f(D("msgs"), {l:M.msgs.slice(0, 4).map(x => `• ${CH[x.ch]} · ${pname(x.p)} · ${TX(x.sum)}`).join("\n")});
  if(/aujourd|today|hoy|agenda|calend|rendez|cita|rdv/.test(s)){ const e = dayEv(0); return e.length ? f(D("today"), {l:e.map(evLine).join("\n")}) : D("todayNone"); }
  return f(D("fallback"));
}
function readAloud(text, btn){

      <section class="card set-sec" id="s-langs"><div class="ch"><h3>${esc(t("setLangs"))}</h3></div><p class="muted" style="margin:6px 16px 0;font-size:13px">${esc(t("langsSub"))}</p>
        <div class="chips">${["fr","en","es"].map(k => `<span class="chipx on">${ic("check", 2.4)}${esc(t("lang3." + k))}</span>`).join("")}${MORE_LANGS.map(l => `<span class="chipx off">${esc(l)}</span>`).join("")}</div>
        <div class="set-row"><div class="lbl"><small>${esc(t("langsMore"))}</small></div><a class="btn" href="mailto:hello@meetaistaff.com?subject=${encodeURIComponent(B("langAsk"))}">${esc(B("langAsk"))}</a></div></section>
      <section class="card set-sec" id="s-int"><div class="ch"><h3>${esc(t("setInt"))}</h3></div><div class="ints">${t("intsList").map(([n, l, c, s0]) => [n, l, c, M.demo ? s0 : intLive(l, s0)]).map(([n, l, c, s]) => `<div class="int"><span class="lg" style="background:${c}">${esc(l)}</span><span style="min-width:0"><b>${esc(n)}</b><span class="tag ${s === "on" ? "ok" : s === "ph" ? "ph" : "miss"}">${esc(t("intState." + s))}</span></span></div>`).join("")}</div></section>
      <section class="card set-sec" id="s-plan"><div class="ch"><h3>${esc(t("setPlan"))}</h3></div><div class="plan-c">${t("plans").map(([n, pr, d], i) => `<div class="plan ${i === cur ? "on" : ""}"><b>${esc(n)}</b>${i === cur ? ` <span class="tag info">${esc(t("current"))}</span>` : ""}<div class="pr">${pr} $</div><small>${esc(t("perMonth"))}</small><p style="margin:8px 0 0;font-size:13px;color:var(--ink-2)">${esc(d)}</p></div>`).join("")}</div>
        <div class="set-row"><div class="lbl"><small>${esc(B("rollout"))}</small></div><a class="btn" href="mailto:hello@meetaistaff.com?subject=${encodeURIComponent(B("planAsk"))}">${esc(B("planAsk"))}</a></div></section>
      <section class="card set-sec" id="s-notif"><div class="ch"><h3>${esc(t("setNotif"))}</h3></div><div style="padding:6px 0">
        <div class="set-row"><div class="lbl">${esc(t("nSms"))}<small>${esc(t("nSmsSub"))}</small></div><span class="tag ok">${esc(B("on"))}</span></div>
        <div class="set-row"><div class="lbl">${esc(t("nLead"))}</div><span class="tag ok">${esc(B("on"))}</span></div></div></section>
      <section class="card set-sec" id="s-priv"><div class="ch"><h3>${esc(t("setPriv"))}</h3></div><div class="cb">${t("priv").map(s => `<div class="can-i"><span class="ok">${ic("check", 2.4)}</span><span>${esc(s)}</span></div>`).join("")}<a class="btn ghost" href="/confidentialite/?lang=${lang}" style="margin-top:8px;padding-left:0">${esc(t("privLink"))} ${ic("chev", 2)}</a></div></section>
    </div>
  </div>`;
}

// En direct, une connexion n'est « Connecté » que si des données en arrivent vraiment.
function intLive(l, s0){
  if(l === "T") return M.tenant.number ? "on" : "req";
  if(l === "S") return "on";
  if(l === "G") return M.events.some(e => e.kind === "conf" && !e.p) ? "on" : "req";
  if(l === "M") return M.mails.length ? "on" : "req";
  return s0;
}
/* ================= recherche ⌘K ================= */
function cmdItems(q){
  q = q.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const m = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(q);
  const out = VIEWS.filter(v => !q || m(navLabel(v))).map(v => ({h:t("cmdNav"), ic:ic(v), l:navLabel(v), a:`data-act="go" data-v="${v}"`}));
  if(q) contacts().filter(c => m(`${c.name} ${c.phone} ${c.email}`)).slice(0, 8).forEach(c => out.push({h:t("cmdPeople"), ic:avatar(c.name, "xs"), l:c.name, s:c.phone || c.email, a:`data-act="contact" data-k="${esc(c.key)}"`}));
  return out;
}
function renderCmdk(){
  const items = cmdItems($("#cmdkIn").value);
  ui.cmdI = Math.min(ui.cmdI, Math.max(0, items.length - 1));
  let h = "", last = "";
  items.forEach((x, i) => { if(x.h !== last){ h += `<div class="nav-h">${esc(x.h)}</div>`; last = x.h; } h += `<div class="it ${i === ui.cmdI ? "on" : ""}" ${x.a} data-ci="${i}" role="option">${x.ic}<span>${esc(x.l)}</span>${x.s ? `<small>${esc(x.s)}</small>` : ""}</div>`; });
  $("#cmdkRes").innerHTML = h || `<div class="empty">${esc(t("cmdNone"))}</div>`;
}
function openCmdk(){ closeAll(); $("#cmdk").classList.add("on"); $("#scrim").classList.add("on"); const i = $("#cmdkIn"); i.value = ""; i.placeholder = t("search") + "…"; ui.cmdI = 0; renderCmdk(); i.focus(); }

/* ================= connexion ================= */
function authModal(){
  closeAll();
  const m = $("#authModal");
  m.innerHTML = `<div style="padding:22px"><h3 style="margin:0 0 6px;font-size:18px">${esc(t("authTitle"))}</h3><p class="muted" style="margin:0 0 14px;font-size:13.5px">${esc(t("authHint"))}</p><div class="form"><input id="authEmail" type="email" autocomplete="email" placeholder="email@…" aria-label="Email"></div><div id="authMsg" class="muted" style="min-height:18px;margin:10px 0;font-size:12.5px" aria-live="polite"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" type="button" data-act="close">${esc(t("close"))}</button><button class="btn p" type="button" data-act="auth-send">${esc(t("authSend"))}</button></div></div>`;
  m.classList.add("on"); $("#scrim").classList.add("on");
  setTimeout(() => $("#authEmail").focus(), 30);
}
async function authSend(){
  const email = $("#authEmail").value.trim(), msg = $("#authMsg"); if(!email) return;
  try{
    const r = await fetch(SB_URL + "/auth/v1/otp?redirect_to=" + encodeURIComponent(location.origin + location.pathname), {method:"POST", headers:{apikey:SB_KEY, "Content-Type":"application/json"}, body:JSON.stringify({email, create_user:true})});
    msg.textContent = r.ok ? f(t("authSent"), {e:email}) : t("authErr");
  }catch(e){ msg.textContent = t("authErr"); }
}
function acct(){
  if(M.demo){ authModal(); return; }
  setSes(null); M = prepDemo(); ui.chat = []; ui.mailAI = {}; ui.briefIdx = 0; renderChrome(); renderView();
}

/* ================= événements ================= */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch(a){
    case "go": go(el.dataset.v, id); break;
    case "more": openSheet(sheetHead(`<b>${esc(t("more"))}</b>`) + `<div class="sheet-b"><div class="more-grid">${["mail","agenda","contacts","settings"].map(k => `<button class="ni ${view === k ? "on" : ""}" type="button" data-act="go" data-v="${k}">${ic(k)}<span>${esc(navLabel(k))}</span></button>`).join("")}</div>
      <div class="set-row" style="padding:16px 0 0"><div class="seg">${["fr","en","es"].map(l => `<button type="button" class="${l === lang ? "on" : ""}" data-act="lang" data-l="${l}">${l.toUpperCase()}</button>`).join("")}</div><button class="ibtn" type="button" data-act="theme" aria-label="Theme" style="margin-left:auto">${ic("sun")}</button></div>
      <button class="acct" type="button" data-act="acct">${ic("user")}<span>${esc(M.demo ? t("login") : t("logout"))}</span></button></div>`); break;
    case "close": closeAll(); break;
    case "lang": setLang(el.dataset.l); break;
    case "theme": toggleTheme(); break;
    case "acct": closeAll(); acct(); break;
    case "play-brief": briefPlay(); break;
    case "new-brief": newBrief(); break;
    case "brief-hist": briefHistory(); break;
    case "brief-pick": ui.briefIdx = +el.dataset.i; closeAll(); briefStop(); renderHome(); briefPlay(); break;
    case "name-edit": nameEdit(); break;
    case "chart": ui.chart = el.dataset.m; $$("[data-act=chart]").forEach(b => b.classList.toggle("on", b === el)); drawActivity(); break;
    case "ev": evSheet(+el.dataset.i); break;
    case "callf": ui.callF = el.dataset.k; renderCalls(); break;
    case "call-sel": ui.callSel = id; if(isMobile()) ui.detail = "calls"; renderCalls(); renderChrome(); break;
    case "replay": { const c = M.calls.find(x => x.id === id); if(c) vcOpen(c); break; }
    case "contact": closeAll(); ctSheet(el.dataset.k); break;
    case "ct-save": ctSave(el.dataset.k); break;
    case "chf": ui.msgCh = el.dataset.k; ui.msgSel = null; renderMsgs(); break;
    case "msg-sel": { ui.msgSel = id; const x = M.msgs.find(m => m.id === id); if(x) x.unread = false; if(isMobile()) ui.detail = "msgs"; renderMsgs(); renderChrome(); break; }
    case "qr": { const ta = $("#msgIn"); if(ta){ ta.value = B("qr")[+el.dataset.i]; ta.focus(); ui.drafts[ui.msgSel] = ta.value; } break; }
    case "send-msg": sendMsg(); break;
    case "mail-sel": ui.mailSel = id; if(isMobile()) ui.detail = "mail"; renderMail(); renderChrome(); break;
    case "reply-opt": { const e2 = M.mails.find(x => x.id === ui.mailSel), ta = $("#draft"); if(e2 && ta){ ta.value = e2.replies[+el.dataset.i]; ui.drafts["m" + e2.id] = ta.value; $("#mailto").href = mailtoHref(e2, ta.value); $$(".reply-opt").forEach(b => b.classList.toggle("on", b === el)); } break; }
    case "copy-draft": { const ta = $("#draft"); const v = ta ? ta.value : ""; if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(() => toast(t("copied")), () => toast(t("copied"))); else toast(t("copied")); break; }
    case "week": { const d = +el.dataset.d; if(d === 0) ui.weekStart = sod(new Date()); else { const w = new Date(ui.weekStart); w.setDate(w.getDate() + 7*d); ui.weekStart = w; } renderAgenda(); break; }
    case "day": ui.weekStart = sod(new Date(+el.dataset.t)); renderAgenda(); break;
    case "sugg": aiSend(t("sugg")[+el.dataset.i]); break;
    case "ai-send": aiSend(($("#aiIn") || {}).value); break;
    case "ai-listen": readAloud(ui.chat[+el.dataset.i].text, el); break;
    case "ai-copy": { const v = ui.chat[+el.dataset.i].text; if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(() => toast(t("copied")), () => {}); else toast(t("copied")); break; }
    case "persona": persona = el.dataset.p; store.set("aistaff-persona", persona); store.set("aistaff-persona-set", true); syncURL(); renderChrome(); renderView(); break;
    case "set-nav": { const s = document.getElementById("s-" + el.dataset.s); if(s) s.scrollIntoView({behavior:"smooth", block:"start"}); break; }
    case "auth-send": authSend(); break;
  }
});
document.addEventListener("keydown", e => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openCmdk(); return; }
  if(e.key === "Escape"){ if(VC.open) vcClose(); else closeAll(); return; }
  if($("#cmdk").classList.contains("on")){
    const items = $$("#cmdkRes .it");
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); ui.cmdI = (ui.cmdI + (e.key === "ArrowDown" ? 1 : -1) + items.length) % Math.max(1, items.length); items.forEach((x, i) => x.classList.toggle("on", i === ui.cmdI)); const on = items[ui.cmdI]; if(on) on.scrollIntoView({block:"nearest"}); }
    if(e.key === "Enter"){ e.preventDefault(); const on = items[ui.cmdI]; if(on) on.click(); }
    return;
  }
  const tg = e.target;
  if(e.key === "Enter" && !e.shiftKey && tg && (tg.id === "aiIn" || tg.id === "msgIn")){ e.preventDefault(); if(tg.id === "aiIn") aiSend(tg.value); else sendMsg(); return; }
  if(e.key === "Enter" && tg && tg.id === "authEmail"){ authSend(); return; }
  if((e.key === "Enter" || e.key === " ") && tg && tg.matches && tg.matches('[role=button][data-act],tr[data-act],#searchBtn,#asstCard')){ e.preventDefault(); tg.click(); }
});
document.addEventListener("input", e => {
  const el = e.target, k = el.dataset && el.dataset.in;
  if(el.tagName === "TEXTAREA" && (el.id === "aiIn" || el.id === "msgIn")){ el.style.height = "auto"; el.style.height = Math.min(120, el.scrollHeight) + "px"; if(el.id === "msgIn") ui.drafts[ui.msgSel] = el.value; }
  if(el.id === "cmdkIn"){ ui.cmdI = 0; renderCmdk(); return; }
  if(!k) return;
  if(k === "callQ"){ ui.callQ = el.value; $("#callList").innerHTML = callRows(); }
  if(k === "msgQ"){ ui.msgQ = el.value; $("#msgList").innerHTML = msgRows(); }
  if(k === "ctQ"){ ui.ctQ = el.value; $("#ctBody").innerHTML = ctRows(ctFiltered()); }
  if(k === "draft"){ const m = M.mails.find(x => x.id === ui.mailSel); ui.drafts["m" + ui.mailSel] = el.value; if(m) $("#mailto").href = mailtoHref(m, el.value); }
  if(k === "owner"){ owner = el.value.trim().slice(0, 40); store.set("aistaff-owner", owner); }
});
document.addEventListener("mousemove", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if(el) tipFor(el, e); else if($("#tip").classList.contains("on")){ tipHide(); $$("#actChart .hit.on").forEach(h => h.classList.remove("on")); } });
document.addEventListener("touchstart", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if(el && e.touches[0]) tipFor(el, e.touches[0]); else tipHide(); }, {passive:true});
$("#scrim").addEventListener("click", closeAll);
$("#searchBtn").addEventListener("click", openCmdk);
$("#asstCard").addEventListener("click", () => go("asst"));
$("#acctBtn").addEventListener("click", acct);
$("#backBtn").addEventListener("click", () => { ui.detail = null; renderView(); renderChrome(); });
$("#vcX").addEventListener("click", vcClose);
$("#vcPlay").addEventListener("click", vcToggle);
$("#vc").addEventListener("click", e => { if(e.target.id === "vc") vcClose(); });
$("#langSeg").addEventListener("click", e => { const b = e.target.closest("button[data-l]"); if(b) setLang(b.dataset.l); });
$("#themeBtn").addEventListener("click", toggleTheme);
function toggleTheme(){
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("aistaff-theme", next); }catch(e){}
  if(view === "home") drawActivity();
}
function syncURL(){
  const u = new URL(location.href); u.searchParams.set("lang", lang);
  if(persona !== "sofia") u.searchParams.set("a", persona); else u.searchParams.delete("a");
  try{ history.replaceState(null, "", u.pathname + u.search + "#" + view); }catch(e){}
}
function setLang(l){
  if(!T[l] || l === lang) { closeAll(); return; }
  briefStop(); lang = l; store.set("aistaff-dash-lang", l); syncURL(); closeAll(); renderChrome(); renderView();
}
let rsz = 0;
addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if(view === "home") drawActivity(); if(!isMobile() && ui.detail){ ui.detail = null; renderView(); renderChrome(); } }, 150); });
addEventListener("hashchange", () => { const h = (location.hash || "").slice(1).split("/")[0]; const v = VIEWS.includes(h) ? h : OLD[h]; if(v && v !== view) go(v); });
addEventListener("pagehide", () => { try{ speechSynthesis.cancel(); }catch(e){} });

/* ================= démarrage ================= */
captureHash();
M = prepDemo();
const start = (location.hash || "").slice(1).split("/")[0];
view = VIEWS.includes(start) ? start : (OLD[start] || "home");
$$(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + view));
renderChrome(); renderView();
requestAnimationFrame(orbLoop);
if(getSes()){
  loadLive().then(ok => { if(ok){ ui.chat = []; renderChrome(); renderView(); } }).catch(() => {});
}
})();
</script>
</body>
