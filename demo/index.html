<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<script>
(function(){try{var t=localStorage.getItem("aistaff-theme");if(!t){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<title>AI Staff — Tableau de bord</title>
<meta name="description" content="Démo du tableau de bord client AI Staff : appels, messages, courriel, agenda, briefings et réseaux, gérés par votre assistante IA.">
<style>
  :root{
    --cream:#F5EFE1;
    --cream-2:#EFE7D3;
    --card:#FFFDF7;
    --ink:#221B10;
    --muted:#8B7C60;
    --gold:#C79A3B;
    --gold-light:#F0D79A;
    --gold-deep:#9A741F;
    --bronze:#7A5C1E;
    --line:rgba(160,125,45,.16);
    --shadow:0 10px 34px rgba(140,105,35,.10);
    --green:#2FA84F;
    --orange:#E8830C;
    --radius:24px;
    color-scheme:light dark;
  }
  html[data-theme="dark"]{
      --cream:#17150F;
      --cream-2:#201C13;
      --card:#242016;
      --ink:#F8F0DF;
      --muted:#C0B395;
      --gold:#D8AD55;
      --gold-light:#7A6030;
      --gold-deep:#F0CF83;
      --bronze:#E3C171;
      --line:rgba(226,193,113,.17);
      --shadow:0 10px 34px rgba(0,0,0,.28);
      --green:#6FD18A;
      --orange:#F5A33B;
    }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
    background:var(--cream);color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    min-height:100vh;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;
    background:
      radial-gradient(600px 300px at 90% -40px, rgba(240,215,154,.45), transparent 60%),
      radial-gradient(500px 260px at -20% 10%, rgba(199,154,59,.12), transparent 60%),
      var(--cream);
    padding:0 18px calc(110px + env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 4px;}
  .date{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);}
  .top-actions{display:flex;align-items:center;gap:10px;}
  .language-switch{display:flex;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow);}
  .language-switch button{min-width:34px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:10px;font-weight:800;padding:7px 6px;border-radius:9px;cursor:pointer;}
  .language-switch button.on{background:var(--ink);color:var(--card);}
  .avatar{width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,var(--gold-light),var(--gold) 60%,var(--gold-deep));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;color:#fff;letter-spacing:.02em;
    box-shadow:0 6px 16px rgba(160,120,40,.35), inset 0 1px 2px rgba(255,255,255,.5);}
  h1{font-size:34px;font-weight:700;letter-spacing:-.8px;margin:2px 0 2px;}
  .sub{font-size:15px;color:var(--muted);margin-bottom:6px;}
  .demo-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    color:var(--bronze);background:rgba(199,154,59,.14);border:1px solid var(--line);
    padding:5px 11px;border-radius:999px;margin-top:6px;}

  /* ---------- Live pill ---------- */
  .live{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:10px 16px;margin:14px 0 18px;box-shadow:var(--shadow);font-size:13.5px;font-weight:600;}
  .live .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--gold-light),var(--gold-deep));
    box-shadow:0 0 0 4px rgba(199,154,59,.18);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(.72);}}
  .live small{margin-left:auto;color:var(--muted);font-weight:500;}

  /* ---------- Cards ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px;margin-bottom:16px;}
  .card h3{font-size:16.5px;font-weight:700;letter-spacing:-.2px;margin-bottom:2px;}
  .card .hint{font-size:13px;color:var(--muted);margin-bottom:14px;}

  /* Hero */
  .hero{background:linear-gradient(150deg,#FFFDF7 0%,#FBF3DF 55%,#F5E8C8 100%);
    border:1px solid rgba(160,125,45,.28);position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;top:-70px;right:-70px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(240,215,154,.55),transparent 70%);}
  .hero-num{font-size:52px;font-weight:800;letter-spacing:-1.5px;line-height:1;
    background:linear-gradient(120deg,#8A6420,#C79A3B 55%,#8A6420);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .hero-label{font-size:14.5px;font-weight:600;margin-top:6px;}
  .wave{display:flex;align-items:center;gap:4px;height:44px;margin:14px 0 4px;}
  .wave span{width:5px;border-radius:3px;background:linear-gradient(180deg,var(--gold-light),var(--gold-deep));
    animation:wv 1.1s ease-in-out infinite;}
  @keyframes wv{0%,100%{transform:scaleY(.35);}50%{transform:scaleY(1);}}
  .hero-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;
    font-size:13px;color:var(--muted);}
  .hero-foot b{color:var(--ink);}

  /* KPI grid */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px 16px 14px;}
  .kpi .v{font-size:29px;font-weight:800;letter-spacing:-.8px;}
  .kpi .v.gold{background:linear-gradient(120deg,#8A6420,#C79A3B 60%,#8A6420);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .kpi .l{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:3px;}
  .kpi .d{font-size:12px;font-weight:700;color:var(--green);margin-top:5px;}

  /* Chart */
  .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:6px 2px 0;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end;}
  .bar{width:100%;max-width:38px;border-radius:10px 10px 6px 6px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    box-shadow:inset 0 1px 2px rgba(255,255,255,.6), 0 4px 12px rgba(160,120,40,.18);
    transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.9,.25,1.2) backwards;}
  .bar.today{background:linear-gradient(180deg,#F5E3AC,var(--gold-deep));}
  @keyframes grow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  .bar-col span{font-size:11px;font-weight:600;color:var(--muted);}
  .bar-col.today span{color:var(--gold-deep);font-weight:800;}

  /* Lists */
  .row{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid rgba(160,125,45,.10);}
  .row:last-child{border-bottom:none;}
  .pic{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;color:#fff;letter-spacing:.02em;
    box-shadow:inset 0 1px 2px rgba(255,255,255,.4), 0 4px 10px rgba(140,105,35,.20);}
  .row .info{flex:1;min-width:0;}
  .row .name{font-size:15px;font-weight:600;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;}
  .b-chaud{background:linear-gradient(135deg,#F5E0A8,#E4B84F);color:#6E4E0E;}
  .b-tiede{background:#FBEEDC;color:#B25E09;}
  .b-froid{background:#EEE9DB;color:#8B7C60;}
  .b-ok{background:#E3F4E8;color:#1E7A3A;}
  .chev{color:#C4B48E;font-size:18px;font-weight:300;}

  /* Visit cards */
  .visit{display:flex;gap:14px;align-items:center;background:linear-gradient(150deg,#FFFDF7,#FAF1DC);
    border:1px solid rgba(160,125,45,.25);border-radius:18px;padding:15px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
  .vdate{width:52px;height:56px;border-radius:14px;background:linear-gradient(160deg,var(--gold-light),var(--gold));
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
    box-shadow:0 6px 14px rgba(160,120,40,.3);}
  .vdate b{font-size:19px;line-height:1;}
  .vdate span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
  .visit .info{flex:1;}
  .visit .t{font-size:15px;font-weight:700;}
  .visit .a{font-size:12.5px;color:var(--muted);margin-top:2px;}

  /* Segmented */
  .seg{display:flex;background:#EAE1CC;border-radius:14px;padding:3px;margin-bottom:16px;}
  .seg button{flex:1;border:none;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);
    padding:9px 0;border-radius:11px;cursor:pointer;transition:all .2s;}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(120,90,30,.15);}

  /* Search */
  .search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;margin-bottom:14px;color:var(--muted);font-size:15px;box-shadow:var(--shadow);}
  .search input{border:none;background:none;outline:none;font:inherit;flex:1;color:var(--ink);}

  /* Week strip */
  .week{display:flex;gap:8px;margin-bottom:16px;}
  .day{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 0;text-align:center;
    font-size:11px;font-weight:700;color:var(--muted);box-shadow:var(--shadow);}
  .day b{display:block;font-size:16px;margin-top:3px;color:var(--ink);}
  .day.on{background:linear-gradient(160deg,var(--gold-light),var(--gold));color:#fff;border:none;}
  .day.on b{color:#fff;}

  /* Alex pane */
  .alex-hero{text-align:center;padding:30px 20px 26px;}
  .orb{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 35% 30%, #F7E7BC, #D9AE54 55%, #9A741F);
    box-shadow:0 18px 44px rgba(160,120,40,.4), inset 0 2px 6px rgba(255,255,255,.6);
    animation:breath 3.2s ease-in-out infinite;}
  @keyframes breath{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  .orb::before,.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(199,154,59,.4);
    animation:ring 3.2s ease-out infinite;}
  .orb::after{animation-delay:1.6s;}
  @keyframes ring{from{transform:scale(.8);opacity:1;}to{transform:scale(1.25);opacity:0;}}
  .lang-row{display:flex;gap:10px;margin-top:16px;}
  .lang{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px;font-size:14px;
    font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);}
  .lang.on{border-color:var(--gold);color:var(--bronze);background:#FBF3DF;box-shadow:0 4px 14px rgba(160,120,40,.18);}
  .cta{width:100%;border:none;cursor:pointer;font:inherit;font-size:16px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#D9AE54,#9A741F);border-radius:18px;padding:17px;margin-top:14px;
    box-shadow:0 10px 26px rgba(150,110,30,.4), inset 0 1px 2px rgba(255,255,255,.5);}
  .cta:active{transform:scale(.98);}
  .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#221B10;color:#FFFDF7;font-size:14px;font-weight:600;padding:13px 20px;border-radius:999px;
    box-shadow:0 12px 30px rgba(0,0,0,.25);transition:all .3s;pointer-events:none;z-index:50;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- Tab bar ---------- */
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:40;
    background:rgba(255,253,247,.82);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
    border-top:1px solid var(--line);display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom));}
  .tab{flex:1;border:none;background:none;font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;font-weight:600;color:#A99A76;cursor:pointer;padding:4px 0;}
  .tab svg{width:24px;height:24px;}
  .tab.on{color:var(--gold-deep);}
  .tab.on svg{filter:drop-shadow(0 2px 6px rgba(160,120,40,.4));}

  .pane{display:none;}
  .pane.on{display:block;}
  .section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px;}
  .section-title h2{font-size:19px;font-weight:700;letter-spacing:-.3px;}
  .section-title a{font-size:13px;font-weight:600;color:var(--gold-deep);text-decoration:none;}
  .foot-note{text-align:center;font-size:12px;color:var(--muted);margin:26px 0 6px;line-height:1.6;}
  .sim-action{margin-left:auto;border:0;background:transparent;color:var(--gold-deep);font:inherit;font-size:12px;font-weight:800;cursor:pointer;padding:4px 0;}
  .sim-action:focus-visible,.tab:focus-visible,.seg button:focus-visible,.lang:focus-visible,.cta:focus-visible{outline:3px solid rgba(199,154,59,.42);outline-offset:3px;}
  .live.running .dot{animation:pulse .65s infinite;}
  .live.running .sim-action{opacity:.55;cursor:wait;}
  html[data-theme="dark"] .app{background:radial-gradient(600px 300px at 90% -40px,rgba(216,173,85,.16),transparent 60%),radial-gradient(500px 260px at -20% 10%,rgba(199,154,59,.08),transparent 60%),var(--cream);}
html[data-theme="dark"] .hero,html[data-theme="dark"] .visit{background:linear-gradient(150deg,#292318 0%,#241F16 60%,#302616 100%);}
html[data-theme="dark"] .seg{background:#302A1E;}
html[data-theme="dark"] .lang.on{background:#302716;}
html[data-theme="dark"] .tabbar{background:rgba(36,32,22,.9);}
html[data-theme="dark"] .b-tiede{background:#49331D;color:#F2B96D;}
html[data-theme="dark"] .b-froid{background:#343027;color:#C0B395;}
html[data-theme="dark"] .b-ok{background:#1F3A27;color:#7CE198;}
html[data-theme="dark"] .b-chaud{background:#5A4218;color:#F3D58F;}
html[data-theme="dark"] .toast{background:#F8F0DF;color:#221B10;}
  @media (min-width:760px){
    .app{max-width:760px;padding-left:34px;padding-right:34px;}
    .tabbar{max-width:760px;padding-left:90px;padding-right:90px;}
    .kpis{grid-template-columns:repeat(4,1fr);}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  }

  /* 2026 redesign — calm, high-trust SaaS dashboard */
  :root{
    --cream:#F4F6F8;
    --cream-2:#E9EDF2;
    --card:#FFFFFF;
    --ink:#172033;
    --muted:#687386;
    --gold:#2563EB;
    --gold-light:#DCE8FF;
    --gold-deep:#1D4ED8;
    --bronze:#1D4ED8;
    --line:#E2E7EE;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.055);
    --green:#16856F;
    --orange:#B85C16;
    --navy:#111B2E;
    --radius:16px;
  }
  body{background:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;}
  .app{max-width:1120px;margin:0 auto;background:var(--cream);padding:0 22px calc(108px + env(safe-area-inset-bottom));}
  .topbar{padding:28px 0 2px;}
  .date{font-size:12px;letter-spacing:.04em;text-transform:none;color:var(--muted);}
  .top-actions{gap:12px;}
  .language-switch{padding:2px;border-color:var(--line);border-radius:9px;box-shadow:none;}
  .language-switch button{min-width:31px;padding:6px 5px;border-radius:7px;color:var(--muted);}
  .language-switch button.on{background:var(--navy);color:#fff;}
  html[data-theme="light"]{color-scheme:light;}
  html[data-theme="dark"]{color-scheme:dark;}
  .theme-toggle{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0;}
  .theme-toggle svg{width:18px;height:18px;}
  .theme-toggle .ic-sun{display:none;}
  html[data-theme="dark"] .theme-toggle .ic-sun{display:block;}
  html[data-theme="dark"] .theme-toggle .ic-moon{display:none;}
  .avatar{width:38px;height:38px;background:var(--navy);box-shadow:none;font-size:12px;}
  h1{font-size:30px;font-weight:720;letter-spacing:-.7px;margin:6px 0 4px;}
  .sub{font-size:14px;margin-bottom:7px;}
  .demo-chip{margin-top:4px;padding:5px 9px;border-radius:7px;background:#EDF3FF;border-color:#D8E5FF;color:#2458B8;font-size:11px;}
  .live{margin:16px 0 20px;border-radius:12px;padding:11px 14px;box-shadow:none;border-color:var(--line);font-size:13px;}
  .live .dot{width:8px;height:8px;background:#22A06B;box-shadow:0 0 0 3px rgba(34,160,107,.13);}
  .live small{font-size:11px;letter-spacing:.04em;}
  .sim-action{color:var(--gold-deep);padding:5px 8px;border-radius:7px;}
  .sim-action:hover{background:#EDF3FF;}

  .card{border-color:var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;}
  .card h3{font-size:15px;font-weight:700;}
  .card .hint{font-size:12px;}
  .hero{background:var(--navy);border:0;color:#fff;min-height:180px;display:flex;flex-direction:column;justify-content:center;}
  .hero::after{display:none;}
  .hero-num{font-size:50px;font-weight:720;color:#fff;background:none;-webkit-text-fill-color:currentColor;}
  .hero-label{color:#DCE5F5;font-size:14px;font-weight:500;}
  .wave{height:34px;margin:12px 0 5px;gap:4px;overflow:hidden;}
  .wave span{width:4px;background:#5B8DEF;border-radius:3px;}
  .hero-foot{color:#9FACC1;font-size:12px;gap:14px;}
  .hero-foot b{color:#fff;}
  .kpis{gap:12px;}
  .kpi{border-radius:14px;border-color:var(--line);box-shadow:var(--shadow);padding:16px;min-height:112px;}
  .kpi .v{font-size:27px;font-weight:720;}
  .kpi .v.gold{background:none;-webkit-text-fill-color:currentColor;color:var(--gold-deep);}
  .kpi .l{font-size:12px;line-height:1.35;}
  .kpi .d{font-size:11px;color:var(--green);}
  .bars{height:170px;gap:12px;padding-top:12px;}
  .bar{max-width:none;border-radius:5px 5px 2px 2px;background:#D8E4FA;box-shadow:none;}
  .bar.today{background:var(--gold);}
  .bar-col.today span{color:var(--gold-deep);}
  .section-title{margin:22px 1px 10px;}
  .section-title h2{font-size:17px;letter-spacing:-.2px;}
  .section-title a{color:var(--gold-deep);font-size:12px;}
  .row{padding:14px 2px;border-color:var(--line);}
  .pic{width:40px;height:40px;border-radius:11px;box-shadow:none;font-size:12px;}
  .row .name{font-size:14px;}
  .row .meta{font-size:12px;}
  .badge{font-size:10px;padding:5px 8px;border-radius:7px;}
  .b-chaud{background:#FFF3D6;color:#8A5A00;}
  .b-tiede{background:#FFF0E5;color:#9A4A14;}
  .b-froid{background:#EEF1F4;color:#596579;}
  .b-ok{background:#E4F5EF;color:#08765B;}
  .visit{background:var(--card);border-color:var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);}
  .vdate{width:48px;height:50px;border-radius:10px;background:#EDF3FF;color:var(--gold-deep);box-shadow:none;}
  .vdate b{font-size:17px;}
  .visit .t{font-size:14px;}
  .visit .a{font-size:12px;}
  .seg{background:#E7EBF0;border-radius:10px;padding:3px;}
  .seg button{border-radius:8px;font-size:13px;padding:8px 0;}
  .seg button.on{box-shadow:0 1px 3px rgba(16,24,40,.12);}
  .search{border-radius:11px;padding:11px 13px;box-shadow:none;}
  .week{gap:7px;}
  .day{border-radius:10px;box-shadow:none;padding:9px 0;}
  .day.on{background:var(--navy);}

  .hero-next{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;color:#C9D5EA;}
  .hero-next b{color:#fff;}
  .hero-next button{margin-left:auto;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:8px;cursor:pointer;}
  .hero-next button:hover{background:rgba(255,255,255,.16);}

  /* channel chips */
  .ch{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.03em;padding:4px 7px;border-radius:6px;white-space:nowrap;}
  .ch-sms{background:#EAF1FF;color:#2458B8;}
  .ch-wa{background:#E4F5EF;color:#08765B;}
  .ch-ig{background:#FCE8F3;color:#A0296A;}
  .ch-fb{background:#E7EEFD;color:#2D4FA3;}
  html[data-theme="dark"] .ch-sms{background:#1B3561;color:#AFC7FF;}
  html[data-theme="dark"] .ch-wa{background:#15382E;color:#79D8BC;}
  html[data-theme="dark"] .ch-ig{background:#43213A;color:#F3A6D0;}
  html[data-theme="dark"] .ch-fb{background:#1D2D55;color:#A9C0F5;}
  .msg-bubble-row{display:flex;margin-bottom:10px;}
  .msg-bubble-row.ai{justify-content:flex-end;}
  .msg-bubble{max-width:82%;font-size:12.5px;line-height:1.5;padding:10px 12px;border-radius:12px 12px 12px 4px;background:var(--cream);border:1px solid var(--line);}
  .msg-bubble-row.ai .msg-bubble{background:#EAF1FF;border-color:#DCE7FC;border-radius:12px 12px 4px 12px;}
  html[data-theme="dark"] .msg-bubble-row.ai .msg-bubble{background:#172A4A;border-color:#294270;}
  .msg-bubble small{display:block;font-size:10px;color:var(--muted);margin-top:4px;font-weight:700;}
  .approve-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:var(--cream);}
  .approve-bar span{font-size:11px;color:var(--muted);margin-right:auto;}

  /* briefings */
  .brief-layout{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.2fr);gap:16px;align-items:start;}
  @media (max-width:899px){.brief-layout{grid-template-columns:1fr;}}
  .slot{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .slot:last-of-type{border-bottom:0;}
  .slot-time{font-size:18px;font-weight:750;letter-spacing:-.3px;width:62px;}
  .slot-info{flex:1;min-width:0;}
  .slot-info b{display:block;font-size:13px;}
  .slot-info span{font-size:11.5px;color:var(--muted);}
  .switch{position:relative;width:42px;height:24px;border-radius:999px;border:0;background:#CBD3DF;cursor:pointer;flex:0 0 auto;transition:background .2s;}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s;}
  .switch.on{background:var(--gold);}
  .switch.on::after{transform:translateX(18px);}
  html[data-theme="dark"] .switch{background:#34425A;}
  html[data-theme="dark"] .switch.on{background:var(--gold);}
  .brief-row{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 4px;}
  .brief-row:last-child{border-bottom:0;}
  .brief-row:hover{background:var(--cream);}
  .brief-row.active{background:#EDF3FF;border-radius:10px;padding-left:10px;padding-right:10px;}
  html[data-theme="dark"] .brief-row.active{background:#172A4A;}
  .brief-ico{width:38px;height:38px;border-radius:11px;background:#EDF3FF;color:var(--gold-deep);display:grid;place-items:center;font-size:17px;flex:0 0 auto;}
  html[data-theme="dark"] .brief-ico{background:#172A4A;}
  .brief-row .info b{display:block;font-size:13.5px;}
  .brief-row .info span{font-size:11.5px;color:var(--muted);}
  .action-list{list-style:none;margin:4px 0 0;}
  .action-list li{font-size:12px;line-height:1.5;padding:6px 0 6px 20px;position:relative;border-bottom:1px dashed var(--line);}
  .action-list li:last-child{border-bottom:0;}
  .action-list li::before{content:"✓";position:absolute;left:2px;color:var(--green);font-weight:800;}

  /* réseaux */
  .soc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:760px){.soc-grid{grid-template-columns:1fr;}}
  .soc-head{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .soc-logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;}
  .soc-logo.ig{background:linear-gradient(135deg,#F58529,#DD2A7B 55%,#8134AF);}
  .soc-logo.fb{background:#1877F2;}
  .post-thumb{display:flex;gap:12px;align-items:center;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;}
  .post-thumb .img{width:54px;height:54px;border-radius:9px;background:linear-gradient(135deg,#DCE8FF,#9DBCFB);flex:0 0 auto;display:grid;place-items:center;font-size:22px;}
  html[data-theme="dark"] .post-thumb .img{background:linear-gradient(135deg,#243B68,#3B74E8);}
  .post-thumb b{display:block;font-size:12.5px;}
  .post-thumb span{font-size:11px;color:var(--muted);}
  .metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .metric{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px;}
  .metric b{display:block;font-size:19px;letter-spacing:-.4px;}
  .metric span{font-size:10.5px;color:var(--muted);}
  .mini-bars{display:flex;align-items:flex-end;gap:6px;height:60px;margin-top:14px;}
  .mini-bars div{flex:1;border-radius:4px 4px 2px 2px;background:#D8E4FA;}
  .mini-bars div.last{background:var(--gold);}
  html[data-theme="dark"] .mini-bars div{background:#263A60;}
  html[data-theme="dark"] .mini-bars div.last{background:#6E9BFF;}

  /* assistant + chat */
  .asst-layout{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.2fr);gap:16px;align-items:start;}
  @media (max-width:899px){.asst-layout{grid-template-columns:1fr;}}
  .orb{display:grid;place-items:center;color:#fff;font-size:26px;font-weight:800;}
  .persona-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .persona-btn{flex:1;min-width:88px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 8px;font:inherit;font-size:12.5px;font-weight:750;color:var(--muted);cursor:pointer;}
  .persona-btn.on{border-color:#B9CDF8;color:var(--gold-deep);background:#EDF3FF;}
  html[data-theme="dark"] .persona-btn.on{background:#172A4A;border-color:#294270;}
  .chat{padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:520px;}
  .chat-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);}
  .chat-head .mini-orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9DBCFB,#3B74E8 58%,#173F94);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;}
  .chat-head b{font-size:14px;display:block;}
  .chat-head span{font-size:11px;color:var(--green);font-weight:700;}
  .chat-body{flex:1;padding:16px 18px;overflow-y:auto;max-height:430px;display:flex;flex-direction:column;gap:9px;}
  .cmsg{max-width:84%;font-size:13px;line-height:1.5;padding:10px 13px;border-radius:14px;white-space:pre-line;animation:cin .25s ease;}
  @keyframes cin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .cmsg.ai{align-self:flex-start;background:var(--cream);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .cmsg.me{align-self:flex-end;background:var(--gold);color:#fff;border-bottom-right-radius:4px;}
  .cmsg.typing{display:flex;gap:4px;padding:12px 14px;}
  .cmsg.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tdot 1s infinite;}
  .cmsg.typing i:nth-child(2){animation-delay:.15s}.cmsg.typing i:nth-child(3){animation-delay:.3s}
  @keyframes tdot{0%,100%{opacity:.3;}50%{opacity:1;}}
  .chat-sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 12px;}
  .chat-sugg button{border:1px solid var(--line);background:var(--card);color:var(--gold-deep);font:inherit;font-size:11.5px;font-weight:700;padding:7px 10px;border-radius:999px;cursor:pointer;}
  .chat-form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--cream);}
  .chat-form input{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:11px 13px;border-radius:10px;outline:0;}
  .chat-form input:focus{border-color:var(--gold);}
  .chat-form button{border:0;background:var(--gold);color:#fff;font:inherit;font-weight:750;font-size:13px;padding:0 16px;border-radius:10px;cursor:pointer;}
  .human-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--cream);border:1px solid var(--line);}
  .variant-link{font-size:11px;font-weight:700;color:var(--gold-deep);text-decoration:none;}
  /* ===== v2: charts, calendar views, integrations, languages ===== */
  :root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--grid:#E6EAF0;}
  html[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--grid:#253147;}
  .viz-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:8px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
  .viz-toggle{border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;}
  .viz-toggle:hover{color:var(--ink);}
  .stack-chart{position:relative;display:grid;grid-template-columns:30px 1fr;height:220px;margin:14px 0 22px;}
  .y-axis{position:relative;}
  .y-axis span{position:absolute;right:8px;font-size:10.5px;color:var(--muted);transform:translateY(50%);font-variant-numeric:tabular-nums;}
  .plot{position:relative;border-bottom:1px solid var(--grid);}
  .gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid);}
  .cols{position:absolute;inset:0;display:flex;}
  .col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;flex:1;border-radius:8px 8px 0 0;}
  .col:hover{background:color-mix(in srgb,var(--s1) 6%,transparent);}
  .col .stack{width:24px;display:flex;flex-direction:column-reverse;gap:2px;transform-origin:bottom;animation:growY .7s cubic-bezier(.2,.9,.25,1.1) backwards;}
  @keyframes growY{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  .col .sg{width:100%;min-height:2px;}
  .col .sg:last-child{border-radius:4px 4px 0 0;}
  .col .tot{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums;}
  .col .xl{position:absolute;bottom:-20px;font-size:11px;color:var(--muted);font-weight:600;}
  .col.today .xl,.col.today .tot{color:var(--ink);font-weight:800;}
  .viz-tip{position:absolute;z-index:5;pointer-events:none;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 28px rgba(16,24,40,.14);border-radius:10px;padding:9px 11px;font-size:12px;min-width:150px;opacity:0;transition:opacity .12s;}
  .viz-tip.on{opacity:1;}
  .viz-tip b{display:block;margin-bottom:5px;font-size:12px;}
  .viz-tip div{display:flex;justify-content:space-between;gap:14px;color:var(--muted);line-height:1.7;}
  .viz-tip div span:last-child{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}
  .viz-tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;}
  .viz-table{width:100%;border-collapse:collapse;font-size:12px;margin:12px 0 4px;}
  .viz-table th,.viz-table td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;}
  .viz-table th{color:var(--muted);font-weight:700;font-size:11px;}
  .viz-table th:first-child,.viz-table td:first-child{text-align:left;}
  .line-chart{position:relative;margin-top:12px;height:130px;}
  .line-chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .lc-dot{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--card);}
  .lc-hair{position:absolute;top:0;bottom:0;width:1px;background:var(--grid);opacity:0;}
  .lc-hit{position:absolute;inset:0;cursor:crosshair;}
  .lc-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:6px;}
  .lc-end{position:absolute;font-size:11px;font-weight:800;color:var(--ink);transform:translate(-100%,-160%);white-space:nowrap;}
  /* calendar colours by event type */
  .cal-event{background:color-mix(in srgb,var(--s1) 14%,transparent)!important;color:var(--ink)!important;border-left:3px solid var(--s1);border-radius:4px;}
  .cal-event.follow{background:color-mix(in srgb,var(--s2) 14%,transparent)!important;border-left-color:var(--s2);}
  .cal-event.outbound{background:color-mix(in srgb,var(--s3) 14%,transparent)!important;border-left-color:var(--s3);}
  @media (max-width:620px){.cal-event{border-left:0;background:var(--s1)!important;}.cal-event.follow{background:var(--s2)!important;}.cal-event.outbound{background:var(--s3)!important;}}
  .timeline-line{background:var(--s1)!important;}
  .timeline-event.follow .timeline-line{background:var(--s2)!important;}
  .timeline-event.outbound .timeline-line{background:var(--s3)!important;}
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted);font-weight:600;}
  .cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
  .view-seg{display:flex;background:var(--cream-2);border-radius:9px;padding:2px;margin-right:6px;}
  .view-seg button{border:0;background:none;font:inherit;font-size:11px;font-weight:700;color:var(--muted);padding:6px 10px;border-radius:7px;cursor:pointer;height:28px;}
  .view-seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12);}
  .week{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));position:relative;}
  .wk-head{padding:10px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);background:var(--cream);}
  .wk-head b{display:block;font-size:17px;color:var(--ink);margin-top:2px;}
  .wk-head.today b{display:grid;place-items:center;width:28px;height:28px;margin:2px auto 0;border-radius:50%;background:var(--gold);color:#fff;}
  .wk-times{position:relative;}
  .wk-times span{position:absolute;right:8px;font-size:10px;color:var(--muted);transform:translateY(-50%);}
  .wk-col{position:relative;border-left:1px solid var(--line);cursor:pointer;}
  .wk-col.sel{background:color-mix(in srgb,var(--s1) 5%,transparent);}
  .wk-line{position:absolute;left:0;right:0;border-top:1px solid var(--grid);}
  .wk-ev{position:absolute;left:3px;right:3px;border-radius:6px;padding:4px 6px;font-size:10.5px;line-height:1.25;overflow:hidden;
    background:color-mix(in srgb,var(--s1) 16%,var(--card));border-left:3px solid var(--s1);color:var(--ink);}
  .wk-ev b{display:block;font-size:10px;color:var(--muted);font-weight:700;}
  .wk-ev.follow{background:color-mix(in srgb,var(--s2) 16%,var(--card));border-left-color:var(--s2);}
  .wk-ev.outbound{background:color-mix(in srgb,var(--s3) 16%,var(--card));border-left-color:var(--s3);}
  .wk-now{position:absolute;left:0;right:0;height:2px;background:#E5484D;z-index:2;}
  .wk-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#E5484D;}
  @media (max-width:620px){.week{grid-template-columns:36px repeat(7,minmax(0,1fr));}.wk-ev{padding:2px 3px;font-size:0;}.wk-ev b{font-size:9px;}.wk-head{font-size:9px;padding:8px 1px;}.wk-head b{font-size:13px;}}
  /* integrations + languages */
  .int-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);}
  .int-row:last-child{border-bottom:0;}
  .int-logo{width:38px;height:38px;border-radius:11px;background:var(--cream);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto;color:var(--ink);}
  .int-logo svg{width:20px;height:20px;}
  .int-row .info{flex:1;min-width:0;}
  .int-row .name{font-size:13.5px;font-weight:700;}
  .int-row .meta{font-size:11.5px;color:var(--muted);}
  .int-btn{border:1px solid var(--line);background:var(--card);color:var(--gold-deep);font:inherit;font-size:11px;font-weight:800;padding:6px 10px;border-radius:8px;cursor:pointer;}
  .int-btn:hover{background:var(--cream);}
  .lang-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;}
  .lang-chip{border:1.5px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .lang-chip small{font-size:10px;font-weight:800;opacity:.7;}
  .lang-chip.on{border-color:var(--gold);background:#EDF3FF;color:var(--gold-deep);}
  html[data-theme="dark"] .lang-chip.on{background:#172A4A;}
  .lang-count{font-size:11px;font-weight:800;color:var(--gold-deep);}
  .orb .av,.mini-orb .av{width:100%;height:100%;display:block;}
  .orb{background:none!important;box-shadow:0 14px 30px rgba(37,99,235,.25)!important;}
  .mini-orb{background:none!important;}
  .persona-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;}
  .persona-btn .av{width:26px;height:26px;}

  /* ===== Voice console (floating nebula + radial voice ring) ===== */
  .vc-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:18px;
    background:radial-gradient(ellipse at 50% 40%,rgba(18,40,90,.72),rgba(2,6,16,.9));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  .vc-overlay.show{display:flex;animation:vcIn .35s ease;}
  @keyframes vcIn{from{opacity:0;}to{opacity:1;}}
  .vc{position:relative;width:min(460px,100%);color:#EAF1FF;text-align:center;animation:vcPop .5s cubic-bezier(.2,.8,.2,1);}
  @keyframes vcPop{from{transform:translateY(24px) scale(.96);opacity:0;}to{transform:none;opacity:1;}}
  .vc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .vc-top .vc-title{display:flex;align-items:center;gap:10px;text-align:left;}
  .vc-top .vc-title .av{width:38px;height:38px;}
  .vc-top b{display:block;font-size:15px;letter-spacing:-.2px;}
  .vc-top span{display:block;font-size:11.5px;color:#9FB3D9;font-weight:600;}
  .vc-x{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer;}
  .vc-x:hover{background:rgba(255,255,255,.14);}
  .vc-stage{position:relative;width:min(420px,86vw);aspect-ratio:1;margin:0 auto;}
  .vc-stage canvas{position:absolute;inset:0;width:100%;height:100%;}
  .vc-state{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(234,241,255,.85);text-shadow:0 0 18px rgba(80,160,255,.9);pointer-events:none;}
  .vc-cap{min-height:92px;margin:4px auto 0;max-width:420px;}
  .vc-who{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7FB8FF;margin-bottom:6px;}
  .vc-who.user{color:#FFB27A;}
  .vc-line{font-size:17px;line-height:1.5;font-weight:600;color:rgba(234,241,255,.45);}
  .vc-line .w{transition:color .15s;}
  .vc-line .w.on{color:#fff;text-shadow:0 0 14px rgba(120,180,255,.55);}
  .vc-prog{height:3px;border-radius:3px;background:rgba(255,255,255,.12);margin:16px auto 0;max-width:360px;overflow:hidden;}
  .vc-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3B82F6,#5EE0F5);transition:width .3s;}
  .vc-ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;}

  .vc-btn:hover{background:rgba(255,255,255,.14);}

  .listen-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--gold-deep);font:inherit;font-size:11.5px;font-weight:800;padding:7px 11px;border-radius:9px;cursor:pointer;white-space:nowrap;}

  .listen-btn .dotw i{width:2px;background:currentColor;border-radius:1px;animation:eqb 1s ease-in-out infinite;}
  .listen-btn .dotw i:nth-child(1){height:5px}.listen-btn .dotw i:nth-child(2){height:10px;animation-delay:.15s}.listen-btn .dotw i:nth-child(3){height:7px;animation-delay:.3s}
  @keyframes eqb{0%,100%{transform:scaleY(.5);}50%{transform:scaleY(1);}}
  .chat-voice{margin-left:auto;}
  @media (prefers-reduced-motion:reduce){.vc,.vc-overlay.show{animation:none;}}
  /* mini nebula in the overview card */
  .card.hero{display:grid;grid-template-columns:minmax(0,1fr) 250px;column-gap:24px;align-content:center;position:relative;overflow:hidden;}
  .card.hero>*:not(.mini-neb){grid-column:1;}
  .card.hero::before{content:"";position:absolute;right:-60px;top:50%;width:420px;height:420px;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.28),transparent 62%);pointer-events:none;}
  .mini-neb{grid-column:2;grid-row:1 / span 5;align-self:center;justify-self:center;border:0;background:none;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;padding:0;position:relative;z-index:1;}
  .mn-stage{position:relative;width:220px;height:220px;display:block;transition:transform .35s cubic-bezier(.2,.8,.2,1);}
  .mini-neb:hover .mn-stage,.mini-neb:focus-visible .mn-stage{transform:scale(1.06);}
  .mn-stage canvas{position:absolute;inset:0;width:100%;height:100%;}
  .mn-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:15px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:.85;transition:opacity .2s,transform .2s;padding-left:3px;}

<script>
(function(){
"use strict";
const qs = new URLSearchParams(location.search);
/* Real-estate variant kept as its own page */
if (qs.get("v") === "immobilier") { location.replace("/immobilier/demo/"); return; }

const PERSONAS = {
  sofia:{name:"Sofía",ini:"S",g:"f"},
  alex:{name:"Alex",ini:"A",g:"n"},
  tomas:{name:"Tomás",ini:"T",g:"m"}
};
let uiLang = ["fr","en","es"].includes(qs.get("lang")) ? qs.get("lang") : "fr";
let persona = PERSONAS[qs.get("a")] ? qs.get("a") : "sofia";
const client = (qs.get("n") || "Marie").replace(/[<>&"]/g,"").slice(0,30) || "Marie";

/* role words that depend on persona gender */
const ROLE = {
  fr:{f:{role:"assistante",the:"l'assistante",your:"votre assistante"},m:{role:"assistant",the:"l'assistant",your:"votre assistant"},n:{role:"assistant·e",the:"l'assistant·e",your:"votre assistant·e"}},
  en:{f:{role:"assistant",the:"the assistant",your:"your assistant"},m:{role:"assistant",the:"the assistant",your:"your assistant"},n:{role:"assistant",the:"the assistant",your:"your assistant"}},
  es:{f:{role:"asistente",the:"la asistente",your:"tu asistente"},m:{role:"asistente",the:"el asistente",your:"tu asistente"},n:{role:"asistente",the:"asistente",your:"tu asistente"}}
};
function P(){ return PERSONAS[persona]; }
function fill(s){
  const r = ROLE[uiLang][P().g];
  return String(s).split("{a}").join(P().name).split("{n}").join(client)
    .split("{role}").join(r.role).split("{the}").join(r.the).split("{your}").join(r.your);
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function F(s){ return fill(esc(s)); }

/* ================= UI STRINGS ================= */
const U = {
fr:{
sub:"Voici ce que {a}, {your} IA, a géré pour vous.",demo:"Données de démonstration",
live:"{a} est en ligne",simIdle:"Simuler un appel",simShort:"Simuler",simRun:"{a} répond à Jordan P.",simProg:"En cours…",simAdded:"Ajouté ✓",
simStart:"Appel simulé en cours…",simRepeat:"Cet appel de démonstration est déjà ajouté",simDone:"Appel qualifié et rendez-vous ajouté à l'agenda",
heroLabel:"conversations gérées cette semaine · appels, messages, courriels",heroFoot1:"Dernier appel sans réponse : <b>aucun cette semaine</b>",heroFoot2:"Réponse en <b>7 s</b>",
nextBrief:"Prochain briefing : <b>aujourd'hui, 18 h 00</b>",lastBrief:"Écouter le dernier",mnCap:"Dernier briefing",mnSub:"07:30 · 1 min 48 · touchez pour écouter",
activity:"Activité",activityHint:"Conversations gérées · 7 derniers jours",recent:"Dernières interactions",seeAll:"Tout voir",
upcoming:"Prochains rendez-vous",agendaLink:"Agenda",

  function frame(now){
    const t = (now - t0)/1000;
    /* idle: a soft "speaking" shimmer so it reads as a voice note; hover: livelier */
    const target = (hover ? .5 : .2) + (hover ? .3 : .14)*Math.abs(Math.sin(t*(hover?6.2:2.4))*Math.sin(t*1.7+.5));
    amp += (target - amp)*.08;
    if(hud.width < 4) resize();
    if(g) g.draw(t, amp, 0);
    hudDraw(ctx, hud.width, hud.height, t, amp, 0, st);
    if(!reduce && visible && !document.hidden) requestAnimationFrame(frame); else running = false;
  }
  const start = ()=>{ if(!running){ running = true; requestAnimationFrame(frame); } };
  if("IntersectionObserver" in window) new IntersectionObserver(es=>{ visible = es[0].isIntersecting; if(visible) start(); }).observe(btn);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) start(); });
  start();
}

function lineChartHTML(id, values, labels, fmt){
  const max = Math.max(...values)*1.15, n = values.length;
  const pts = values.map((v,i)=>[i/(n-1)*100, 100 - v/max*100]);
  const path = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(2)+" "+p[1].toFixed(2)).join(" ");
  const last = pts[n-1];
  return `<div class="line-chart" id="${id}"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">`+
    `<line x1="0" y1="100" x2="100" y2="100" stroke="var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/>`+
    `<line x1="0" y1="50" x2="100" y2="50" stroke="var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/>`+
    `<path d="${path} L100 100 L0 100 Z" fill="var(--s1)" opacity=".1"/>`+
    `<path d="${path}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`+
    `<div class="lc-hair"></div><div class="lc-dot" style="left:${last[0]}%;top:${last[1]}%;background:var(--s1)"></div>`+
    `<span class="lc-end" style="left:${last[0]}%;top:${last[1]}%">${fmt(values[n-1])}</span>`+
    `<div class="lc-dot lc-hover" style="display:none;background:var(--s1)"></div><div class="viz-tip"></div><div class="lc-hit"></div></div>`+
    `<div class="lc-x">${labels.map(l=>`<span>${l}</span>`).join("")}</div>`;
}
function wireLineChart(id, values, labels, fmt, label){
  const el = document.getElementById(id); if(!el) return;
  const max = Math.max(...values)*1.15, n = values.length;
  const hit = el.querySelector(".lc-hit"), hair = el.querySelector(".lc-hair"), dot = el.querySelector(".lc-hover"), tip = el.querySelector(".viz-tip");
  const move = e=>{
    const r = el.getBoundingClientRect(), x = (e.touches?e.touches[0].clientX:e.clientX) - r.left;
    const i = Math.max(0, Math.min(n-1, Math.round(x / r.width * (n-1))));
    const px = i/(n-1)*100, py = 100 - values[i]/max*100;
    hair.style.left = px+"%"; hair.style.opacity = 1;
    dot.style.display = "block"; dot.style.left = px+"%"; dot.style.top = py+"%";
    tip.innerHTML = `<b>${labels[i]}</b><div><span><i style="background:var(--s1)"></i>${label}</span><span>${fmt(values[i])}</span></div>`;
    const left = px/100*r.width; tip.style.left = (left > r.width - 170 ? left - 168 : left + 12)+"px"; tip.style.top = "0px"; tip.classList.add("on");
  };
  hit.addEventListener("mousemove", move); hit.addEventListener("touchstart", move, {passive:true});
  hit.addEventListener("mouseleave", ()=>{ hair.style.opacity = 0; dot.style.display = "none"; tip.classList.remove("on"); });
}

function au(k){ return AUTH[uiLang][k]; }
function getSes(){ try{ return JSON.parse(localStorage.getItem(SES_KEY)||"null"); }catch(e){ return null; } }
function setSes(v){ try{ if(v) localStorage.setItem(SES_KEY, JSON.stringify(v)); else localStorage.removeItem(SES_KEY); }catch(e){} }
function captureHash(){
  const h = new URLSearchParams((location.hash||"").replace(/^#/,""));
  if(!h.get("access_token")) return;
  setSes({access_token:h.get("access_token"), refresh_token:h.get("refresh_token"), expires_at:Math.floor(Date.now()/1000)+(+h.get("expires_in")||3600)});
  history.replaceState(null,"",location.pathname+location.search);
}
async function token(){
  let s = getSes(); if(!s) return null;
  if(s.expires_at - 60 > Date.now()/1000) return s.access_token;
  try{
    const r = await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});
    if(!r.ok) throw 0;
    const j = await r.json();
    s = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600)};
    setSes(s); return s.access_token;
  }catch(e){ setSes(null); return null; }
}
async function sb(path){
  const t = await token(); if(!t) return null;
  const r = await fetch(SB_URL+"/rest/v1/"+path,{headers:{apikey:SB_KEY,Authorization:"Bearer "+t}});
  if(r.status===401){ setSes(null); return null; }
  return r.ok ? r.json() : null;
}
function mapCall(r){
  const secs = r.duration_sec||0, name = (r.caller_name||"").trim() || r.phone_number || au("unk");
  const ini = ((r.caller_name||"").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase()) || "?";
  const who = (r.caller_name||"").trim().split(/\s+/)[0] || au("caller");
  const tr = String(r.transcript||"").split(/\n(?=(?:AI|User): )/).map(l=>{
    const m = l.match(/^(AI|User): ([\s\S]*)$/); return m ? [m[1]==="AI"?"A":who, m[2].trim()] : null;
  }).filter(x=>x&&x[1]);
  const tag = r.qualified ? "hot" : secs===0 ? "cold" : r.sentiment==="positive" ? "warm" : "ok";
  const when = r.started_at ? new Intl.DateTimeFormat(uiLang,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(r.started_at)) : "—";
  return {ini, name, num:r.phone_number||"—", dir:secs>0?"in":"missed", time:when,
    dur:Math.floor(secs/60)+" min "+String(secs%60).padStart(2,"0"), score:r.qualified?"✓":"—", tag,
    sum:r.summary||"—", next:r.intent?String(r.intent).replace(/_/g," "):"—", tr};
}
async function loadLive(){
  let rows = await sb("calls?select=retell_call_id,phone_number,caller_name,started_at,duration_sec,transcript,summary,sentiment,intent,qualified&order=started_at.desc.nullslast&limit=100");

  // Se ocultan las llamadas vacías: nadie habló (solo el saludo o nada de transcripción).
  rows = rows.filter(r=>/(^|\n)User: \S/.test(String(r.transcript||"")));
  const calls = {}; rows.forEach(r=>{ calls[r.retell_call_id] = mapCall(r); });
  const weekAgo = Date.now()-7*864e5, wk = rows.filter(r=>r.started_at && new Date(r.started_at).getTime()>weekAgo && (r.duration_sec||0)>0);

}
const CHMAP = {sms:"sms",whatsapp:"wa",instagram:"ig",facebook:"fb"};
function rel(iso){
  if(!iso) return "—"; const t = new Date(iso), diff = (Date.now()-t)/60000;
  if(diff < 60) return Math.max(1,Math.round(diff))+" min";
  if(diff < 1440) return new Intl.DateTimeFormat(uiLang,{hour:"2-digit",minute:"2-digit"}).format(t);
  return new Intl.DateTimeFormat(uiLang,{day:"numeric",month:"short"}).format(t);
}
async function loadChannels(){
  const [ms, em, ev, bk] = await Promise.all([
    sb("messages?select=channel,direction,contact_name,contact_handle,body,at&order=at.asc&limit=500"),
    sb("emails?select=id,from_name,from_addr,subject,snippet,status,at&order=at.desc&limit=100"),
    sb("events?select=title,who,starts_at,source&order=starts_at.asc&limit=500"),
    sb("bookings?select=contact_name,contact_phone,booking_type,scheduled_for,status&scheduled_for=not.is.null&order=scheduled_for.asc&limit=500")]);
  const msgs = {};
  (ms||[]).forEach(r=>{
    const k = r.channel+"|"+r.contact_handle, nm = r.contact_name || r.contact_handle || "?";
    const m = msgs[k] || (msgs[k] = {rch:r.channel, handle:r.contact_handle, ch:CHMAP[r.channel]||"sms", name:nm, ini:nm.replace(/[^\p{L}\p{N} ]/gu,"").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase()||"?", status:"done", thread:[], draft:"", _at:0});
    m.thread.push([r.direction==="out"?"ai":"them", r.body||"", rel(r.at)]);
    m.preview = r.body||""; m.time = rel(r.at); m._at = new Date(r.at).getTime();
  });
  const msgSorted = {}; Object.entries(msgs).sort((a,b)=>b[1]._at-a[1]._at).forEach(([k,v])=>msgSorted[k]=v);
  const emails = {};
  (em||[]).forEach(r=>{
    const nm = r.from_name || r.from_addr || "?";
    emails[r.id] = {sender:nm, email:r.from_addr||"", time:rel(r.at), status:r.status==="handled"?"handled":"reply", subject:r.subject||"—", preview:r.snippet||"", summary:r.snippet||"—", next:"—", score:"—", context:[], draft:["Re: "+(r.subject||""),""], thread:[[nm, rel(r.at), "in", r.snippet||""]]};
  });
  const events = {};
  (ev||[]).forEach(r=>{
    if(!r.starts_at) return; const t = new Date(r.starts_at), k = dateKey(t);
    (events[k] = events[k] || []).push([String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0"), r.title||"—", "", r.who||r.source||""]);
  });
  // Citas pedidas por teléfono a la asistente: aparecen en la agenda como "por confirmar".
  const BK = {fr:["Rendez-vous","à confirmer"], en:["Appointment","to confirm"], es:["Cita","por confirmar"]}[uiLang];
  (bk||[]).forEach(r=>{
    const t = new Date(r.scheduled_for), k = dateKey(t);
    const label = (r.booking_type||BK[0]) + (r.status==="requested"||r.status==="pending" ? " · "+BK[1] : "");
    (events[k] = events[k] || []).push([String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0"), label, "", [r.contact_name, r.contact_phone].filter(Boolean).join(" · ")]);
  });
  Object.values(events).forEach(l=>l.sort((a,b)=>a[0].localeCompare(b[0])));
  return {msgs:msgSorted, emails, events, social:[], dms:[]};
}
