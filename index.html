<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>
(function(){try{var t=localStorage.getItem("aistaff-theme");if(!t){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<title>AI Staff — Votre adjointe personnelle IA</title>
<meta name="description" content="Votre prochaine employée est une IA. Elle répond à vos appels et à vos textos jour et nuit et prend vos rendez-vous. À partir de 397 $ par mois.">
<meta property="og:title" content="AI Staff — Votre adjointe personnelle IA">
<meta property="og:description" content="Votre prochaine employée est une IA. Elle répond à vos appels et à vos textos jour et nuit et prend vos rendez-vous. À partir de 397 $ par mois.">
<meta property="og:url" content="https://meetaistaff.com/">
<link rel="canonical" href="https://meetaistaff.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230A1A33'/%3E%3Cstop offset='1' stop-color='%231F6FEB'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='800' font-size='26' fill='white' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<style>

:root{
  --navy:#0A1A33; --navy-2:#10254a;
  --blue:#1F6FEB; --blue-d:#1858C4; --blue-soft:rgba(31,111,235,.1);
  --bg:#EDF0F6; --bg-2:#E4E9F2;
  --card:#FFFFFF; --ink:#0B1B33; --muted:#5B6B82;
  --line:rgba(11,27,51,.1);
  --green:#1FA855; --green-soft:rgba(31,168,85,.12);
  --amber:#DD7A0A; --amber-soft:rgba(221,122,10,.13);
  --red:#DF5454; --red-soft:rgba(223,84,84,.12);
  --r:22px;
  --shadow:0 10px 30px rgba(10,26,51,.08);
  --shadow-lg:0 24px 60px rgba(10,26,51,.14);
  --accent-ink:#1858C4;
  color-scheme:light dark;
}
html[data-theme="dark"]{
  --bg:#071120; --bg-2:#0A1830;
  --card:#0D1C36; --ink:#EAF0FA; --muted:#93A3BD;
  --line:rgba(148,178,226,.14);
  --blue-soft:rgba(64,130,246,.16);
  --green-soft:rgba(46,204,113,.14);
  --amber-soft:rgba(240,165,60,.15);
  --red-soft:rgba(240,110,110,.15);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  --accent-ink:#7FA8F5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip;line-height:1.5;}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px;}
section[id],header[id]{scroll-margin-top:80px;}

/* ---------- Nav ---------- */
nav{position:fixed;top:0;left:0;right:0;z-index:60;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  border-bottom:1px solid var(--line);}
.nav-in{max-width:1120px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:19px;letter-spacing:-.3px;white-space:nowrap;}
.brand .mk{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--navy),var(--blue));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13.5px;letter-spacing:.02em;
  box-shadow:0 6px 16px rgba(31,111,235,.35);}
.nav-links{margin-left:auto;display:flex;align-items:center;gap:6px;}
.nav-links a.nl{font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;padding:9px 12px;border-radius:12px;}
.nav-links a.nl:hover{color:var(--ink);background:var(--blue-soft);}
.seg{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:3px;}
.seg button{border:none;background:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);
  padding:7px 12px;border-radius:999px;cursor:pointer;min-width:40px;}
.seg button.active{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(10,26,51,.16);}
.tbtn{border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:999px;cursor:pointer;
  font-size:17px;display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:var(--shadow);flex-shrink:0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:none;cursor:pointer;font:inherit;
  font-weight:700;border-radius:16px;padding:15px 30px;font-size:16px;text-decoration:none;transition:transform .15s, box-shadow .2s;}
.btn:active{transform:scale(.97);}
.btn-blue{background:linear-gradient(135deg,#3B82F6,#1858C4);color:#fff;
  box-shadow:0 10px 26px rgba(31,111,235,.4), inset 0 1px 2px rgba(255,255,255,.35);}
.btn-blue:hover{box-shadow:0 14px 32px rgba(31,111,235,.5), inset 0 1px 2px rgba(255,255,255,.35);}
.btn-ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:var(--shadow);}
.btn-sm{padding:10px 18px;font-size:13.5px;border-radius:13px;}
@media(max-width:900px){.nav-links a.nl{display:none;}}
@media(max-width:560px){.nav-cta{display:none !important;}}

/* ---------- Hero (v2: 3D orb, motion) ---------- */
.hero{padding:118px 0 40px;position:relative;isolation:isolate;}
.hero-bg{position:absolute;inset:-120px calc(50% - 50vw) 0;z-index:-1;pointer-events:none;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent);}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform;}
.blob.b1{width:520px;height:520px;left:calc(50% + 60px);top:40px;background:radial-gradient(circle,#3B82F6,transparent 65%);animation:drift1 16s ease-in-out infinite;}
.blob.b2{width:440px;height:440px;left:calc(50% - 520px);top:260px;background:radial-gradient(circle,#7C9CFF,transparent 65%);opacity:.35;animation:drift2 19s ease-in-out infinite;}
.blob.b3{width:360px;height:360px;left:calc(50% + 380px);top:420px;background:radial-gradient(circle,#22D3EE,transparent 65%);opacity:.28;animation:drift1 22s ease-in-out infinite reverse;}
html[data-theme="dark"] .blob{opacity:.42;}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-60px,40px) scale(1.12);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(70px,-30px) scale(.92);}}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(11,27,51,.13) 1px,transparent 1.4px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse 60% 55% at 60% 40%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse 60% 55% at 60% 40%,#000 30%,transparent 75%);}
html[data-theme="dark"] .dots{background-image:radial-gradient(rgba(148,178,226,.16) 1px,transparent 1.4px);}
.hero-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:40px;align-items:center;}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr;gap:26px;}}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent-ink);background:var(--blue-soft);border:1px solid var(--line);
  padding:8px 16px;border-radius:999px;margin-bottom:20px;backdrop-filter:blur(8px);}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(.7);opacity:.6;}}
h1{font-size:clamp(42px,6.2vw,72px);font-weight:800;letter-spacing:-2px;line-height:1.02;max-width:640px;}
h1 em{font-style:normal;color:var(--blue);}
h1 em .w{background:linear-gradient(100deg,#1F6FEB 10%,#5B8DEF 45%,#22B8E6 70%,#1F6FEB 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em;}
html[data-theme="dark"] h1 em .w{background-image:linear-gradient(100deg,#6EA3F8 10%,#A5C4FF 45%,#5EE0F5 70%,#6EA3F8 100%);}
.ready h1 em .w{animation:wordIn .9s cubic-bezier(.2,.8,.2,1) forwards,sheen 6s ease-in-out infinite;animation-delay:calc(.12s + var(--i) * .075s),1.2s;}
@keyframes sheen{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
h1 .w{display:inline-block;opacity:0;transform:translateY(.45em) rotateX(-40deg);filter:blur(8px);transform-origin:50% 100%;}
.ready h1 .w{animation:wordIn .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.12s + var(--i) * .075s);}
@keyframes wordIn{to{opacity:1;transform:none;filter:none;}}
.rise{opacity:0;transform:translateY(18px);}
.ready .rise{animation:riseIn .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,.4s);}
@keyframes riseIn{to{opacity:1;transform:none;}}
.rotator{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:18px 0 6px;font-size:clamp(19px,2.2vw,24px);font-weight:700;letter-spacing:-.4px;line-height:1.45;}
.rotator .rot{position:relative;display:inline-grid;height:1.45em;line-height:1.45em;overflow:hidden;}
.rotator .rot span{grid-area:1/1;white-space:nowrap;color:var(--accent-ink);transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .55s;}
.rotator .rot span.in{transform:none;opacity:1;}
.rotator .rot span.out{transform:translateY(-110%);opacity:0;}
.rotator .rot span.wait{transform:translateY(110%);opacity:0;}
.rotator .caret{display:inline-block;width:3px;height:1.05em;background:var(--blue);border-radius:2px;animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.lead{font-size:18px;line-height:1.6;color:var(--muted);max-width:580px;margin:10px 0 22px;}
.pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:26px;}
.pick .pl{font-size:13px;font-weight:700;color:var(--muted);width:100%;}
.persona{display:inline-flex;align-items:center;gap:9px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--card) 85%,transparent);border-radius:999px;
  padding:5px 16px 5px 5px;font:inherit;font-size:14.5px;font-weight:700;color:var(--muted);cursor:pointer;box-shadow:var(--shadow);
  backdrop-filter:blur(8px);transition:transform .2s,border-color .2s,background .2s;}
.persona:hover{transform:translateY(-2px);}
.persona .av{width:34px;height:34px;display:block;}
.persona.active{border-color:var(--blue);color:var(--accent-ink);background:var(--blue-soft);}
.persona small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:0;}
.persona .pn{text-align:left;line-height:1.15;}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:30px;}
.btn-blue.glow{position:relative;overflow:hidden;}
.btn-blue.glow::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
  transform:translateX(-120%);animation:shine 3.8s ease-in-out infinite 2s;}
@keyframes shine{0%{transform:translateX(-120%);}40%,100%{transform:translateX(120%);}}
.trust{display:flex;gap:34px;flex-wrap:wrap;}
.trust .n{font-size:28px;font-weight:800;letter-spacing:-.6px;color:var(--navy);}
html[data-theme="dark"] .trust .n{color:#fff;}
.trust .l{font-size:13px;color:var(--muted);margin-top:2px;max-width:160px;}

/* stage: WebGL orb + phone + floating cards */
.stage{position:relative;height:680px;perspective:1400px;}
@media(max-width:980px){.stage{height:640px;}}
#orbGL{position:absolute;left:50%;top:48%;width:640px;height:640px;transform:translate(-50%,-50%);pointer-events:none;z-index:0;}
.orb-fallback{position:absolute;left:50%;top:48%;width:420px;height:420px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#9DBCFB,#3B74E8 55%,#173F94 80%,transparent 81%);filter:drop-shadow(0 0 60px rgba(59,130,246,.55));opacity:.9;z-index:0;}
.phone-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;transform-style:preserve-3d;}
.phone{width:292px;background:#0A1A33;border-radius:50px;padding:11px;transform-style:preserve-3d;
  box-shadow:0 40px 90px rgba(10,26,51,.35),0 0 0 1px rgba(255,255,255,.06), inset 0 2px 4px rgba(255,255,255,.18);
  transition:transform .25s ease-out;}
.ready .phone-wrap .phone{animation:phoneIn 1.3s cubic-bezier(.2,.8,.2,1) both .35s;}
@keyframes phoneIn{from{opacity:0;transform:translateY(80px) rotateX(28deg) rotateY(-18deg) scale(.9);}to{opacity:1;transform:none;}}
.phone::before{content:"";position:absolute;inset:0;border-radius:50px;pointer-events:none;
  background:linear-gradient(125deg,rgba(255,255,255,.18),transparent 30%,transparent 70%,rgba(255,255,255,.06));z-index:3;}
.screen{background:var(--card);border-radius:40px;overflow:hidden;height:590px;display:flex;flex-direction:column;position:relative;}
.notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:104px;height:25px;background:#0A1A33;border-radius:14px;z-index:2;}
.call-head{padding:50px 20px 12px;text-align:center;border-bottom:1px solid var(--line);}
.call-av{width:74px;height:74px;margin:0 auto 10px;position:relative;}
.call-av .av{width:74px;height:74px;display:block;position:relative;z-index:1;}
.call-av::before,.call-av::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(37,99,235,.35);opacity:0;}
.call-av.talking::before,.call-av.talking::after{animation:ring 2s ease-out infinite;}
.call-av.talking::after{animation-delay:1s;}
@keyframes ring{from{transform:scale(.9);opacity:1;}to{transform:scale(1.45);opacity:0;}}
.eq{display:flex;gap:3px;justify-content:center;align-items:flex-end;height:14px;margin-top:6px;opacity:0;transition:opacity .3s;}
.eq.on{opacity:1;}
.eq i{width:3px;border-radius:2px;background:var(--blue);height:4px;animation:eq 0.9s ease-in-out infinite;}
.eq i:nth-child(2){animation-delay:.12s}.eq i:nth-child(3){animation-delay:.24s}.eq i:nth-child(4){animation-delay:.36s}.eq i:nth-child(5){animation-delay:.48s}
@keyframes eq{0%,100%{height:3px;}50%{height:14px;}}
.call-head .nm{font-weight:700;font-size:16px;}
.call-head .st{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:600;}
.call-head .st.live{color:var(--green);}
.transcript{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;scrollbar-width:none;}
.bubble{max-width:86%;padding:10px 14px;border-radius:17px;font-size:13.5px;line-height:1.45;animation:fadeUp .35s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.bubble.agent{background:var(--bg-2);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start;}
.bubble.user{background:linear-gradient(135deg,#3B82F6,#1858C4);color:#fff;border-bottom-right-radius:5px;align-self:flex-end;}
.typing{align-self:flex-start;background:var(--bg-2);border:1px solid var(--line);border-radius:17px;border-bottom-left-radius:5px;
  padding:12px 15px;display:flex;gap:5px;}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:tp 1s infinite;}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.3;transform:none;}50%{opacity:1;transform:translateY(-3px);}}
.call-foot{padding:12px 16px 22px;border-top:1px solid var(--line);}
.call-btn{width:100%;border:none;cursor:pointer;font:inherit;font-weight:700;font-size:15px;color:#fff;border-radius:16px;
  padding:14px;background:linear-gradient(135deg,#3B82F6,#1858C4);
  box-shadow:0 8px 20px rgba(31,111,235,.42), inset 0 1px 2px rgba(255,255,255,.35);}
.call-btn.hang{background:linear-gradient(135deg,#E0655A,#B03227);box-shadow:0 8px 20px rgba(180,60,40,.35);}
.call-btn:disabled{opacity:.55;cursor:default;}
.phone-hint{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:12.5px;color:var(--muted);font-weight:500;z-index:3;}
.phone-hint a{color:var(--accent-ink);font-weight:800;text-decoration:none;}
/* floating notification cards */
.fcard{position:absolute;z-index:4;display:flex;gap:10px;align-items:center;min-width:210px;max-width:250px;padding:11px 14px 11px 11px;border-radius:16px;
  background:color-mix(in srgb,var(--card) 78%,transparent);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:0 18px 40px rgba(10,26,51,.16);opacity:0;transform:translateY(14px) scale(.94);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1);pointer-events:none;}
.fcard.show{opacity:1;transform:none;}
.fcard .fi{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--blue-soft);}
.fcard .fi svg{width:20px;height:20px;}
.fcard b{display:block;font-size:13px;line-height:1.25;}
.fcard span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px;}
.fcard .ok{margin-left:auto;font-size:11px;font-weight:800;color:var(--green);}
.fcard{max-width:205px;min-width:0;}
.fcard.s0{left:-34px;top:40px;}.fcard.s1{right:-92px;top:150px;}.fcard.s2{left:-44px;top:178px;}.fcard.s3{right:-80px;top:420px;}
.fcard.show.bob{animation:bob 5s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@media(max-width:1280px){.fcard.s0,.fcard.s2{left:-20px}.fcard.s1,.fcard.s3{right:-30px}}
@media(max-width:980px){.hero{overflow-x:clip;}.fcard.s0,.fcard.s2{left:0}.fcard.s1,.fcard.s3{right:0}}
@media(max-width:640px){
  .stage{height:600px;margin:0 -8px;}
  #orbGL{width:470px;height:470px;}
  .fcard{min-width:0;max-width:190px;padding:8px 10px 8px 8px;}
  .fcard .fi{width:30px;height:30px;}
  .fcard .ok{display:none;}
  .fcards{display:none;}
  .phone{width:270px;}.screen{height:540px;}
}

/* ---------- Sectors dropdown ---------- */
.dd{position:relative;}
.dd summary{list-style:none;cursor:pointer;font-size:14px;font-weight:700;color:var(--muted);padding:9px 12px;border-radius:12px;display:flex;align-items:center;gap:6px;user-select:none;}
.dd summary::-webkit-details-marker{display:none;}
.dd summary::after{content:"▾";font-size:11px;transition:transform .2s;}
.dd[open] summary{color:var(--ink);background:var(--blue-soft);}
.dd[open] summary::after{transform:rotate(180deg);}
.dd-menu{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);min-width:250px;padding:8px;border-radius:18px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:80;display:grid;gap:2px;animation:fadeUp .2s ease;}
.dd-menu a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap;}
.dd-menu a span{width:28px;height:28px;border-radius:9px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.dd-menu a:hover,.dd-menu a.cur{background:var(--blue-soft);color:var(--accent-ink);}
@media(max-width:900px){.dd summary{padding:8px 8px;font-size:13px;}.dd-menu{left:auto;right:-80px;transform:none;}}
@media(max-width:400px){.dd summary{font-size:12px;padding:8px 4px;}}
a.ind{color:inherit;text-decoration:none;transition:transform .2s,border-color .2s;}
a.ind:hover{transform:translateY(-3px);border-color:var(--blue);}
a.ind .go{font-size:12px;color:var(--accent-ink);font-weight:800;margin-left:4px;}

/* ---------- Marquees ---------- */
.marquee{position:relative;overflow:hidden;padding:6px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);}
.mtrack{display:flex;gap:12px;width:max-content;animation:scrollX var(--dur,48s) linear infinite;}
.marquee.rev .mtrack{animation-direction:reverse;}
.marquee:hover .mtrack{animation-play-state:paused;}
@keyframes scrollX{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.ind{display:flex;align-items:center;gap:10px;padding:12px 18px 12px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);white-space:nowrap;font-weight:700;font-size:14.5px;}
.ind .ie{width:36px;height:36px;border-radius:11px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:18px;}
.ind small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;}
.band{padding:18px 0 8px;}
.band .cap{text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}

/* ---------- Integrations ---------- */
.logo-tile{display:flex;align-items:center;gap:12px;padding:14px 20px 14px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);white-space:nowrap;font-weight:700;font-size:14.5px;}
.logo-tile .lg{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--bg-2);}
.logo-tile .lg svg{width:22px;height:22px;}
.logo-tile small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;}
.int-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;}
@media(max-width:900px){.int-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:560px){.int-grid{grid-template-columns:1fr;}}
.int-cat{padding:20px;}
.int-cat h3{font-size:15px;font-weight:800;margin-bottom:4px;}
.int-cat p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px;}
.int-logos{display:flex;flex-wrap:wrap;gap:8px;}
.int-logos span{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:7px 10px 7px 8px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);}
.int-logos svg{width:16px;height:16px;flex-shrink:0;}

/* ---------- Languages ---------- */
.lang-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:stretch;}
@media(max-width:900px){.lang-wrap{grid-template-columns:1fr;}}
.card.lang-cloud{position:relative;min-height:380px;overflow:hidden;background:linear-gradient(140deg,#12294f,#0A1A33 75%);border:none;}
.lang-cloud::before{content:"";position:absolute;left:50%;top:50%;width:300px;height:300px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(64,130,246,.45),transparent 65%);}
.hello{position:absolute;translate:-50% -50%;padding:7px 13px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;
  font-weight:700;font-size:16px;white-space:nowrap;backdrop-filter:blur(6px);animation:floaty var(--fd,7s) ease-in-out infinite;animation-delay:var(--fdl,0s);}
.hello small{display:block;font-size:10.5px;font-weight:600;color:rgba(255,255,255,.6);letter-spacing:.02em;}
.hello.hl{background:rgba(59,130,246,.35);border-color:rgba(147,197,253,.6);}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.lang-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;z-index:2;}
.lang-center .big{transition:opacity .25s;font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1;}
.lang-center .sm{font-size:13px;color:rgba(255,255,255,.75);margin-top:6px;}
.lang-tiers{padding:24px;display:flex;flex-direction:column;gap:12px;}
.tier{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--bg-2);border:2px solid var(--line);}
.tier .tn{font-size:26px;font-weight:800;letter-spacing:-.6px;min-width:58px;text-align:center;color:var(--navy);}
html[data-theme="dark"] .tier .tn{color:#fff;}
.tier b{display:block;font-size:14.5px;}
.tier span{font-size:13px;color:var(--muted);}
.tier.feat{border:2px solid var(--blue);background:var(--blue-soft);}

/* channels detailed */
.feat ul{list-style:none;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;}
.feat li{font-size:13.5px;color:var(--ink);padding:5px 0 5px 22px;position:relative;line-height:1.45;}
.feat li::before{content:"✓";position:absolute;left:2px;color:var(--blue);font-weight:800;}
/* niche autoplay progress */
.ntab{position:relative;overflow:hidden;}
.ntab .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--blue);width:0;}
.ntab.active.auto .prog{animation:prog 7s linear forwards;}
@keyframes prog{to{width:100%;}}
.niche{transition:opacity .35s;}
.niche.swap{opacity:.25;}
/* scroll reveal for sections */
.sr{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);}
.sr.vis{opacity:1;transform:none;}
@media (prefers-reduced-motion:reduce){.sr{opacity:1;transform:none;}h1 .w,.rise{opacity:1;transform:none;filter:none;}.mtrack{animation:none;}}

/* ---------- Sections ---------- */
section.block{padding:66px 0;}
.sec-eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:12px;}
h2.sec-title{font-size:clamp(29px,4vw,43px);font-weight:800;letter-spacing:-1px;line-height:1.12;margin-bottom:14px;max-width:720px;}
.sec-lead{font-size:17px;color:var(--muted);line-height:1.62;max-width:660px;margin-bottom:32px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);}
.fine{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:14px;}
.center-note{max-width:680px;margin:20px auto 0;text-align:center;font-size:13px;color:var(--muted);line-height:1.6;}

/* ---------- Compare ---------- */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:760px){.cmp{grid-template-columns:1fr;}}
.cmp-col{padding:26px 24px;}
.cmp-col.ai{border:2px solid transparent;
  background:linear-gradient(var(--card),var(--card)) padding-box, linear-gradient(135deg,#3B82F6,#0A1A33) border-box;box-shadow:var(--shadow-lg);}
.cmp-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.cmp-ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--bg-2);border:1px solid var(--line);flex-shrink:0;}
.cmp-col.ai .cmp-ico{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-weight:800;font-size:17px;border:none;}
.cmp-head h3{font-size:18px;font-weight:800;letter-spacing:-.3px;}
.cmp-head .price{font-size:13px;color:var(--muted);font-weight:600;}
.cmp-row{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px;align-items:flex-start;}
.cmp-row .k{width:110px;flex-shrink:0;color:var(--muted);font-size:13px;font-weight:600;padding-top:1px;}
.cmp-row .v{flex:1;line-height:1.45;}
.cmp-col.human .cmp-row .v::before{content:"○ ";color:var(--muted);}
.cmp-col.ai .cmp-row .v::before{content:"✓ ";color:var(--blue);font-weight:800;}

/* ---------- Channels ---------- */
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:900px){.feat-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.feat-grid{grid-template-columns:1fr;}}
.feat{padding:24px 22px;}
.feat .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.feat .ic{width:46px;height:46px;border-radius:15px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:22px;}
.feat h3{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px;}
.feat p{font-size:14.5px;color:var(--muted);line-height:1.6;}
.tag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.tag.hot{background:var(--red-soft);color:var(--red);}
.tag.warm{background:var(--amber-soft);color:var(--amber);}
.tag.cold{background:var(--bg-2);color:var(--muted);border:1px solid var(--line);}
.tag.new,.tag.live{background:var(--green-soft);color:var(--green);}
.tag.info,.tag.phase{background:var(--blue-soft);color:var(--accent-ink);}

/* ---------- Timeline ---------- */
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:900px){.tl{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.tl{grid-template-columns:1fr;}}
.tl-step{padding:22px 20px;position:relative;}
.tl-time{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--navy),var(--blue));padding:6px 12px;border-radius:999px;margin-bottom:14px;
  box-shadow:0 6px 14px rgba(31,111,235,.3);}
.tl-step h3{font-size:16px;font-weight:800;margin-bottom:6px;letter-spacing:-.2px;}
.tl-step p{font-size:13.8px;color:var(--muted);line-height:1.55;}
.anytime{margin-top:16px;padding:20px 22px;display:flex;gap:14px;align-items:center;background:var(--blue-soft);}
.anytime .ic{font-size:26px;flex-shrink:0;}
.anytime p{font-size:14.5px;line-height:1.6;}
.anytime q{font-style:italic;color:var(--accent-ink);quotes:"« " " »";}
html[lang="en"] .anytime q{quotes:"“" "”";}
html[lang="es"] .anytime q{quotes:"«" "»";}

/* ---------- Niches ---------- */
.ntabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin;}
.ntab{flex-shrink:0;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;
  font:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap;}
.ntab.active{border-color:var(--blue);color:var(--accent-ink);background:var(--blue-soft);}
.niche{display:grid;grid-template-columns:1fr 1.15fr;gap:0;overflow:hidden;}
@media(max-width:820px){.niche{grid-template-columns:1fr;}}
.niche-pain{padding:30px 28px;background:linear-gradient(140deg,#12294f,#0A1A33 75%);color:#fff;}
.niche-pain .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:10px;}
.niche-pain h3{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.2;margin-bottom:12px;}
.niche-pain p{font-size:15px;line-height:1.65;color:rgba(255,255,255,.85);}
.niche-do{padding:30px 28px;}
.niche-do .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:12px;}
.niche-do ul{list-style:none;}
.niche-do li{font-size:15px;padding:9px 0 9px 30px;position:relative;line-height:1.5;border-bottom:1px solid var(--line);}
.niche-do li:last-child{border:none;}
.niche-do li::before{content:"✓";position:absolute;left:4px;top:9px;color:var(--blue);font-weight:800;}
.niche-line{margin-top:16px;background:var(--bg-2);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.55;}
.niche-line b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.niche-link{display:inline-block;margin-top:14px;font-size:13.5px;font-weight:700;color:var(--accent-ink);text-decoration:none;}

/* ---------- Dashboard ---------- */
.pers{padding:22px 24px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;}
.pers label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;}
.pers input{width:100%;font:inherit;font-size:16px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg-2);color:var(--ink);outline:none;}
.pers input:focus{border-color:var(--blue);}
.pers .f{flex:1 1 240px;}
.demo-badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--accent-ink);
  background:var(--blue-soft);border:1px solid var(--line);padding:7px 14px;border-radius:999px;margin-bottom:18px;}
.dash{overflow:hidden;}
.dash-top{display:flex;align-items:center;gap:14px;padding:20px 24px;border-bottom:1px solid var(--line);}
.dash-av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--blue));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px;flex-shrink:0;}
.dash-top .nm{font-weight:700;font-size:16px;}
.dash-top .sb{font-size:12.5px;color:var(--muted);}
.dash-top .full{margin-left:auto;font-size:13px;font-weight:700;color:var(--accent-ink);text-decoration:none;white-space:nowrap;}
.dash-tabs{display:flex;gap:4px;padding:12px 24px 0;border-bottom:1px solid var(--line);overflow-x:auto;}
.dtab{border:none;background:none;font:inherit;font-size:14px;font-weight:700;color:var(--muted);padding:12px 14px;
  cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;}
.dtab.active{color:var(--ink);border-color:var(--blue);}
.dpane{display:none;padding:24px;animation:fadeUp .3s ease;}
.dpane.active{display:block;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr;}}
.stat-tile{padding:18px;border-radius:18px;background:var(--bg-2);border:1px solid var(--line);}
.stat-tile .lbl{font-size:12px;color:var(--muted);font-weight:600;}
.stat-tile .val{font-size:27px;font-weight:800;letter-spacing:-.6px;margin-top:6px;color:var(--navy);}
html[data-theme="dark"] .stat-tile .val{color:#fff;}
.stat-tile .delta{font-size:12px;margin-top:4px;color:var(--green);font-weight:700;}
.sub-h{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px;}
.feed-row{display:flex;gap:13px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);}
.feed-row:last-child{border:none;}
.feed-ico{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-weight:800;color:var(--accent-ink);}
.feed-row .tx{flex:1;font-size:14px;line-height:1.45;min-width:0;}
.feed-row .tx small{display:block;color:var(--muted);font-size:12.5px;}
.feed-row .tm{font-size:12px;color:var(--muted);white-space:nowrap;}
.call-card{border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;background:var(--bg-2);}
.call-card .who{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.call-card .ini{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#fff;font-size:14px;flex-shrink:0;}
.call-card .nm{font-weight:700;font-size:15px;}
.call-card .mt{font-size:12.5px;color:var(--muted);}
.call-card .sm{font-size:14px;color:var(--muted);line-height:1.55;margin-top:8px;}
.call-card .nx{margin-top:10px;font-size:13px;font-weight:700;color:var(--accent-ink);}
.tr-box{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;}
.tr-line{font-size:13px;color:var(--muted);margin:5px 0;line-height:1.5;}
.tr-line b{color:var(--ink);}
.draft{margin-top:6px;font-size:12.5px;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);line-height:1.5;}
.draft b{color:var(--ink);}
.soc{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
@media(max-width:640px){.soc{grid-template-columns:1fr;}}
.soc-card{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--bg-2);}
.soc-card .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.soc-card .h b{font-size:15px;}
.soc-card .h span{font-size:12px;color:var(--muted);}
.soc-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.soc-kpis div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;}
.soc-kpis b{display:block;font-size:19px;letter-spacing:-.4px;}
.soc-kpis span{font-size:11.5px;color:var(--muted);}

/* ---------- Trust / privacy ---------- */
.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:900px){.trust-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.trust-grid{grid-template-columns:1fr;}}
.trust-card{padding:22px 20px;}
.trust-card .ic{font-size:24px;margin-bottom:12px;}
.trust-card h3{font-size:15.5px;font-weight:800;margin-bottom:6px;}
.trust-card p{font-size:13.8px;color:var(--muted);line-height:1.58;}

/* ---------- Pricing ---------- */
.price-top{display:flex;gap:8px;flex-wrap:wrap;margin:-14px 0 26px;}
.price-top span{font-size:12.5px;font-weight:700;color:var(--accent-ink);background:var(--blue-soft);border:1px solid var(--line);padding:6px 12px;border-radius:999px;}
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch;}
@media(max-width:900px){.price-grid{grid-template-columns:1fr;}}
.plan{padding:30px 28px;display:flex;flex-direction:column;position:relative;}
.plan.featured{border:2px solid transparent;
  background:linear-gradient(var(--card),var(--card)) padding-box, linear-gradient(135deg,#3B82F6,#0A1A33) border-box;
  box-shadow:var(--shadow-lg);}
.plan .ribbon{position:absolute;top:-13px;left:28px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:#fff;background:linear-gradient(135deg,#3B82F6,#1858C4);padding:6px 12px;border-radius:999px;box-shadow:0 6px 14px rgba(31,111,235,.35);}
.plan .pname{font-size:20px;font-weight:800;letter-spacing:-.3px;}
.plan .ptag{font-size:14px;color:var(--muted);margin:8px 0 18px;line-height:1.5;min-height:42px;}
.plan .pnum{font-size:44px;font-weight:800;letter-spacing:-1.2px;color:var(--navy);}
html[data-theme="dark"] .plan .pnum{color:#fff;}
.plan .pper{font-size:14px;color:var(--muted);font-weight:600;}
.plan ul{list-style:none;margin:20px 0 24px;flex:1;}
.plan li{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:7px 0;line-height:1.45;}
.plan li .ck{color:var(--blue);font-weight:800;flex-shrink:0;}
.plan li.inc{font-weight:700;}
.plan .btn{width:100%;}

/* ---------- FAQ ---------- */
.faq-item{border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
.faq-q{width:100%;border:none;background:none;font:inherit;text-align:left;padding:20px 22px;font-size:15.5px;font-weight:700;
  color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;}
.faq-q .pl{font-size:20px;color:var(--blue);flex-shrink:0;font-weight:400;transition:transform .2s;}
.faq-item.open .faq-q .pl{transform:rotate(45deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.faq-a p{padding:0 22px 20px;font-size:14.5px;color:var(--muted);line-height:1.65;}

/* ---------- Final CTA ---------- */
.final{border-radius:30px;padding:58px 40px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(140deg,#12294f,#0A1A33 70%);box-shadow:var(--shadow-lg);}
.final::before{content:"";position:absolute;top:-90px;right:8%;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(64,130,246,.35),transparent 65%);}
.final h2{font-size:clamp(30px,4.5vw,46px);font-weight:800;letter-spacing:-1px;color:#fff;line-height:1.12;position:relative;max-width:760px;margin:0 auto;}
.final p{color:rgba(255,255,255,.85);font-size:17px;margin:14px auto 28px;max-width:560px;line-height:1.6;position:relative;}
.final-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative;}
.btn-white{background:#fff;color:var(--navy);box-shadow:0 10px 26px rgba(0,0,0,.3);}
.final .tel{display:block;margin-top:22px;color:#fff;font-weight:800;font-size:21px;letter-spacing:.02em;text-decoration:none;position:relative;}

footer{padding:42px 0 90px;text-align:center;font-size:13px;color:var(--muted);line-height:1.7;}
footer .links{display:flex;gap:6px 16px;justify-content:center;flex-wrap:wrap;margin:12px 0;}
footer .links a{color:var(--muted);font-weight:600;text-decoration:none;}
footer .links a:hover{color:var(--ink);}
footer .demo{display:inline-block;margin-top:10px;font-size:11.5px;border:1px solid var(--line);border-radius:999px;

    if(!reduce && orbState.visible && !document.hidden) requestAnimationFrame(frame); else orbState.paused = true;
  }
  orbState.resume = ()=>{ if(orbState.paused && !reduce){ orbState.paused = false; requestAnimationFrame(frame); } };
  requestAnimationFrame(frame);
  if("IntersectionObserver" in window){
    new IntersectionObserver(es=>{ orbState.visible = es[0].isIntersecting; if(orbState.visible) orbState.resume(); }).observe(cv);
  }
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) orbState.resume(); });
}
/* 3D tilt of the phone following the pointer */
function initTilt(){
  const stage = document.getElementById("stage"), wrap = stage.querySelector(".phone-wrap"), cv = document.getElementById("orbGL");
  if(!window.matchMedia || !matchMedia("(pointer:fine)").matches) return;
  let raf = 0, tx = 0, ty = 0;
  window.addEventListener("pointermove", e=>{
    const r = stage.getBoundingClientRect();
    tx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width/2)) / (r.width/1.2)));
    ty = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height/2)) / (r.height/1.2)));
    if(!raf) raf = requestAnimationFrame(()=>{
      raf = 0;
      wrap.style.transform = `translate(-50%,-50%) rotateY(${tx*9}deg) rotateX(${-ty*7}deg)`;
      if(cv) cv.style.transform = `translate(calc(-50% + ${-tx*18}px), calc(-50% + ${-ty*14}px))`;
    });
  }, {passive:true});
}

/* reveal sections on scroll */
function initReveal(){
  const els = document.querySelectorAll("section.block, .band, .sr");
  els.forEach(e=>e.classList.add("sr"));
  if(!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("vis")); return; }
  const io = new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("vis"); io.unobserve(en.target); } }), {threshold:.08, rootMargin:"0px 0px -40px 0px"});
  els.forEach(e=>io.observe(e));
  /* fallback for fast scrolls / anchor jumps: reveal everything above the fold line */
  let tk = 0;
  const sweep = ()=>{ tk = 0; const lim = window.innerHeight*1.05; els.forEach(e=>{ if(!e.classList.contains("vis") && e.getBoundingClientRect().top < lim) e.classList.add("vis"); }); };
  window.addEventListener("scroll", ()=>{ if(!tk) tk = requestAnimationFrame(sweep); }, {passive:true});
  window.addEventListener("hashchange", ()=>setTimeout(sweep, 60));
  setTimeout(sweep, 300);
}

function splitTitle(){
  const h = document.getElementById("heroTitle"); let i = 0;
  const walk = node=>{ [...node.childNodes].forEach(ch=>{
    if(ch.nodeType===3){ const frag = document.createDocumentFragment();
      ch.textContent.split(/( )/).forEach(part=>{ if(part===" "){ frag.appendChild(document.createTextNode(" ")); return; } if(!part) return;
        const s = document.createElement("span"); s.className = "w"; s.style.setProperty("--i", i++); s.textContent = part; frag.appendChild(s); });
      ch.replaceWith(frag);
    } else if(ch.nodeType===1){ walk(ch); } }); };
  walk(h);
}

/* ---------- dashboard sample (tabs) ---------- */
let dashTab = 0;
const iniOf = n => n.replace(/[^A-Za-zÀ-ÿ ]/g,"").split(" ").filter(Boolean).map(w=>w[0]).join("").slice(0,2).toUpperCase() || "@";
const AVBG = ["linear-gradient(135deg,#3B82F6,#1858C4)","linear-gradient(135deg,#22B8E6,#1F6FEB)","linear-gradient(135deg,#8B5CF6,#4F46E5)","linear-gradient(135deg,#10B981,#047857)"];
function buildDash(s){
  const D = g("dash.t"), T = g("tags"), calls = s.calls, first = n => n.split(" ")[0];
  const total = parseInt(String(s.stats[0][1]).replace(/\D/g,""),10) || 40, wts = [.13,.18,.15,.2,.17,.1,.07];
  let vals = wts.map(w=>Math.round(total*w)); vals[3] += total - vals.reduce((a,b)=>a+b,0);
  const mx = Math.max.apply(null, vals);
  const tiles = `<div class="stats">${s.stats.map(x=>`<div class="stat-tile"><div class="lbl">${esc(x[0])}</div><div class="val">${esc(x[1])}</div><div class="delta">${esc(x[2])}</div></div>`).join("")}</div>`;
  const bars = `<div class="dchart"><div class="dch-h">${esc(D.chart)}</div><div class="bars">${vals.map((v,i)=>`<div class="bar"><span class="bv">${v}</span><i style="height:${Math.max(8,Math.round(v/mx*100))}%"></i><span class="bd">${esc(D.days[i])}</span></div>`).join("")}</div></div>`;
  const callCard = (c,i,full) => `<div class="call-card"><div class="who"><div class="ini" style="background:${AVBG[i%4]}">${esc(iniOf(c[0]))}</div><div><div class="nm">${esc(c[0])}</div><div class="mt">${esc(c[1])}</div></div><span class="tag ${c[3]}" style="margin-left:auto;">${esc(T[c[3]])}</span></div><div class="sm">${esc(fill(c[2]))}</div>`+
    (full && i===0 && s.script ? `<div class="tr-box"><div class="tr-t">${esc(D.transcript)}</div>${s.script.map(l=>`<div class="tr-line"><b>${l[0]==="agent"?esc(aName()):esc(first(c[0]))} :</b> ${esc(fill(l[1]))}</div>`).join("")}</div>` : "")+
    `<div class="nx">→ ${esc(g("dash.next"))} : ${esc(fill(c[4]))}</div></div>`;
  const msgs = calls.map((c,i)=>`<div class="feed-row wrapm"><div class="feed-ico">💬</div><div class="tx"><b>${esc(c[0])}</b> <small style="display:inline;">· ${esc(D.smsLbl)}</small><div class="draft"><b>${esc(aName())}</b> — ${esc(D.sms.split("{n}").join(first(c[0])).split("{a}").join(aName()).split("{x}").join(fill(c[4])))}</div></div><span class="tag new">${esc(D.sent)}</span></div>`).join("")+
    `<div class="feed-row wrapm"><div class="feed-ico">🟢</div><div class="tx"><b>${esc(D.wa[0])}</b> <small style="display:inline;">· ${esc(D.wa[1])}</small><div class="draft"><b>${esc(aName())}</b> — ${esc(D.wa[2].split("{a}").join(aName()))}</div></div><span class="tag info">${esc(D.wa[3])}</span></div>`;
  const DAYIDX = {lundi:0,monday:0,lunes:0,mardi:1,tuesday:1,martes:1,mercredi:2,wednesday:2,miercoles:2,jeudi:3,thursday:3,jueves:3,vendredi:4,friday:4,viernes:4,samedi:5,saturday:5,sabado:5};
  const dayOf = txt => { const m = txt.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").match(/\b(lundi|monday|lunes|mardi|tuesday|martes|mercredi|wednesday|miercoles|jeudi|thursday|jueves|vendredi|friday|viernes|samedi|saturday|sabado)\b/); return m ? DAYIDX[m[1]] : -1; };
  const evs = calls.filter(c=>/\d/.test(c[4])).map(c=>({c, d: dayOf(c[4])}));
  const used = new Set(evs.filter(e=>e.d>=0).map(e=>e.d)), spare = [0,2,3,1,4,5].filter(d=>!used.has(d));
  evs.forEach(e=>{ if(e.d<0) e.d = spare.shift(); });
  const week = `<div class="wk">${[0,1,2,3,4,5].map(d=>{ const here = evs.filter(e=>e.d===d);
    return `<div class="wk-col"><div class="wk-h">${esc(D.days[d])}</div>${here.map(e=>`<div class="wk-ev"><b>${esc(fill(e.c[4]))}</b><small>${esc(e.c[0])}</small></div>`).join("")}<div class="wk-free">${esc(D.free)}</div>${here.length?"":'<div class="wk-free">'+esc(D.free)+'</div>'}</div>`; }).join("")}</div>`;
  const soc = `<p class="dnote">${esc(D.socNote)}</p><div class="soc-grid">${D.soc.map(x=>`<div class="soc-card"><div class="h"><b>${x[1]} ${esc(x[0])}</b><span>${esc(D.week)}</span></div><div class="soc-kpis">${x[2].map(k=>`<div><b>${esc(k[1])}</b><span>${esc(k[0])}</span></div>`).join("")}</div></div>`).join("")}</div>`;
  const contacts = `<p class="dnote">${esc(D.contactsNote)}</p>`+calls.map((c,i)=>`<div class="feed-row"><div class="ini" style="background:${AVBG[i%4]}">${esc(iniOf(c[0]))}</div><div class="tx"><b>${esc(c[0])}</b><small>${esc(D.last)} · ${esc(c[1])}</small></div><span class="tag ${c[3]}">${esc(T[c[3]])}</span></div>`).join("");
  const panes = [
    tiles+bars+`<div class="dch-h" style="margin:18px 0 8px;">${esc(D.recent)}</div>`+calls.map((c,i)=>callCard(c,i,false)).join(""),
    calls.map((c,i)=>callCard(c,i,true)).join(""), msgs, week, soc, contacts];
  document.getElementById("dtabs").innerHTML = D.tabs.map((t,i)=>`<button type="button" class="dtab${i===dashTab?" active":""}" role="tab" aria-selected="${i===dashTab}" data-i="${i}">${esc(t)}</button>`).join("");
  document.getElementById("dpanes").innerHTML = panes.map((h,i)=>`<div class="dpane" role="tabpanel" style="display:${i===dashTab?"block":"none"}">${h}</div>`).join("");
  document.querySelectorAll("#dtabs .dtab").forEach(b=>b.addEventListener("click",()=>{ dashTab = +b.dataset.i;
    document.querySelectorAll("#dtabs .dtab").forEach((x,i)=>{ x.classList.toggle("active", i===dashTab); x.setAttribute("aria-selected", i===dashTab); });
    document.querySelectorAll("#dpanes .dpane").forEach((x,i)=>x.style.display = i===dashTab?"block":"none"); }));
}

/* ---------- phone: a customer call for this trade ---------- */
const callBtn = document.getElementById("callBtn"), callStatus = document.getElementById("callStatus"), transcriptEl = document.getElementById("transcript");
const callAv = document.getElementById("callAv"), eqEl = document.getElementById("eq");
function setTalking(on){ callAv.classList.toggle("talking", on); eqEl.classList.toggle("on", on); orbState.talking = on; }
function resetPhone(){
  callTimers.forEach(clearTimeout); callTimers = [];
  transcriptEl.innerHTML = ""; setTalking(false);
  callAv.innerHTML = avatarSVG(persona);
  document.getElementById("phoneName").textContent = aName()+" · AI Staff";
  orbState.mode = persona==="sofia" ? 0 : persona==="alex" ? 1 : 2;
  callBtn.textContent = g("phone.call"); callBtn.classList.remove("hang"); callBtn.disabled = false;
  callStatus.textContent = g("phone.idle"); callStatus.classList.remove("live");
  callBtn.onclick = startCall;
}
function startCall(){
  callBtn.disabled = true; callStatus.textContent = fill(g("phone.connecting")); transcriptEl.innerHTML = "";
  callTimers.push(setTimeout(()=>{
    callStatus.textContent = g("phone.live"); callStatus.classList.add("live"); setTalking(true);
    callBtn.textContent = g("phone.hangup"); callBtn.classList.add("hang"); callBtn.disabled = false; callBtn.onclick = ()=>endCall(false);
    const lines = S().script;
    lines.forEach((ln,i)=>callTimers.push(setTimeout(()=>{
      const ty = document.createElement("div"); ty.className = "typing"; if(ln[0]==="lead") ty.style.alignSelf = "flex-end";
      ty.innerHTML = "<i></i><i></i><i></i>"; transcriptEl.appendChild(ty); transcriptEl.scrollTop = transcriptEl.scrollHeight;
      callTimers.push(setTimeout(()=>{ ty.remove(); const d = document.createElement("div"); d.className = "bubble "+(ln[0]==="agent"?"agent":"user"); d.textContent = fill(ln[1]); transcriptEl.appendChild(d); transcriptEl.scrollTop = transcriptEl.scrollHeight; }, 850));
    }, i*2400)));
    callTimers.push(setTimeout(()=>endCall(true), lines.length*2400+900));
  }, 1200));
}
function endCall(done){
  callTimers.forEach(clearTimeout); callTimers = []; setTalking(false);
  callStatus.textContent = done ? S().ended : g("phone.idle"); callStatus.classList.remove("live");
  callBtn.textContent = g("phone.call"); callBtn.classList.remove("hang"); callBtn.disabled = false; callBtn.onclick = startCall;
}
