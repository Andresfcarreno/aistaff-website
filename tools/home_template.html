<style>
:root{
  --navy:#0A1A33;--blue:#1F6FEB;--blue-d:#1858C4;--cyan:#22B8E6;
  --bg:#FBFBFD;--bg-2:#F2F4F8;--card:#FFFFFF;--ink:#1D1D1F;--muted:#5F6B7C;--line:rgba(10,26,51,.1);--accent-ink:#1858C4;
  --shadow:0 1px 2px rgba(10,26,51,.04),0 12px 32px rgba(10,26,51,.06);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0E16;--bg-2:#0F1522;--card:#121A2B;--ink:#F5F5F7;--muted:#9BA7BA;--line:rgba(160,185,230,.14);--accent-ink:#8DB4F7;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}
/* nav */
nav.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap;font-weight:700;font-size:17px;letter-spacing:-.01em;text-decoration:none}
.mk{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.links{margin-left:auto;display:flex;align-items:center;gap:6px}
.nl,.dd summary{font-size:14px;color:var(--muted);text-decoration:none;padding:8px 10px;border-radius:8px;cursor:pointer;list-style:none}
.nl:hover,.dd summary:hover{color:var(--ink)}
.dd{position:relative}.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:" ▾";font-size:10px}
.dd-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:grid}
.dd-menu a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;text-decoration:none;font-size:14px}
.dd-menu a:hover{background:var(--bg-2)}
.seg{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:none;font:inherit;font-size:12px;font-weight:700;color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(10,26,51,.18)}
.tbtn{border:1px solid var(--line);background:var(--card);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:16px;text-decoration:none;border-radius:999px;padding:13px 24px;border:1px solid transparent;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue-d)}
.btn-ghost{background:transparent;color:var(--accent-ink);border-color:var(--line)}
.btn-sm{font-size:13.5px;padding:8px 16px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* hero */
.hero{padding-block:72px 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
h1{font-size:clamp(40px,6.4vw,72px);line-height:1.04;letter-spacing:-.035em;font-weight:750;margin:14px 0 20px;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(100deg,var(--blue),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(18px,2.2vw,22px);color:var(--muted);max-width:30em}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hint{margin-top:16px;font-size:14px;color:var(--muted)}
.hint a{font-weight:700;color:var(--ink);text-decoration:none}
.orb-wrap{display:grid;place-items:center;min-height:300px}
.orb{width:min(380px,80vw);aspect-ratio:1;border-radius:50%;position:relative;background:
  radial-gradient(circle at 34% 28%,rgba(255,255,255,.9),rgba(190,225,255,.55) 10%,transparent 24%),
  radial-gradient(circle at 62% 66%,rgba(178,143,255,.85),transparent 48%),
  radial-gradient(circle at 30% 72%,rgba(34,200,210,.7),transparent 46%),
  radial-gradient(circle at 50% 50%,#2F7BFF,#1446B8 52%,#0A1A55 74%);
  box-shadow:0 30px 80px rgba(31,111,235,.35),inset 0 0 50px rgba(255,255,255,.2);animation:float 9s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:-9%;border-radius:50%;border:1px solid rgba(31,111,235,.25)}
@keyframes float{50%{transform:translateY(-12px) scale(1.015)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}html{scroll-behavior:auto}}
/* sections */
section{padding-block:80px}
section.alt{background:var(--bg-2)}
h2{font-size:clamp(30px,4.4vw,48px);line-height:1.1;letter-spacing:-.03em;font-weight:720;text-wrap:balance;max-width:20em}
.sub{margin-top:14px;font-size:18px;color:var(--muted);max-width:36em}
.grid{display:grid;gap:18px;margin-top:40px}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow)}
.card h3{font-size:19px;letter-spacing:-.01em;margin-bottom:6px}
.card p{color:var(--muted);font-size:15.5px}
.ic{font-size:26px;margin-bottom:12px}
.step b.n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-size:15px;margin-bottom:14px}
/* pricing */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.chips span{font-size:13px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.plan{display:flex;flex-direction:column;gap:14px}
.plan .pn{font-size:15px;font-weight:700;color:var(--accent-ink);letter-spacing:.04em;text-transform:uppercase}
.plan .price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.plan .num{font-size:46px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.plan .per{color:var(--muted);font-size:14px}
.plan ul{list-style:none;display:grid;gap:9px;flex:1}
.plan li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:15px}
.plan li::before{content:"✓";color:var(--blue);font-weight:800}
.plan li.inc{font-weight:700}.plan li.inc::before{content:"＋"}
.plan .btn{width:100%}
.note{margin-top:22px;font-size:14px;color:var(--muted);max-width:46em}
/* sectors */
.sec a{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:600;font-size:16px;padding:16px 18px}
.sec a:hover{border-color:var(--blue)}
.sec .e{font-size:24px}
/* faq */
.faq{margin-top:34px;max-width:760px;display:grid;gap:10px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 20px}
.faq summary{cursor:pointer;font-weight:650;font-size:17px;padding:18px 0;list-style:none;display:flex;justify-content:space-between;gap:14px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;line-height:1;color:var(--muted)}
.faq details[open] summary::after{content:"–"}
.faq p{color:var(--muted);padding-bottom:18px;font-size:16px}
/* final + footer */
.final{background:linear-gradient(135deg,var(--navy),#16336A);color:#fff;border-radius:28px;padding:clamp(34px,6vw,64px);text-align:center}
.final h2{margin:0 auto;color:#fff}.final .sub{margin-inline:auto;color:#C4D2EA}
.final .ctas{justify-content:center}
.final .btn-ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.final .btn-blue{background:#fff;color:var(--navy)}
footer{padding-block:40px 60px;color:var(--muted);font-size:14px}
footer .row{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px}
footer a{color:var(--muted)}
@media(max-width:860px){
  .hero{grid-template-columns:1fr;padding-block:40px 20px}.orb-wrap{order:-1;min-height:220px}.orb{width:min(230px,60vw)}
  .g3,.g4{grid-template-columns:1fr 1fr}
  .nl{display:none}
}
@media(max-width:560px){
  .g3,.g4{grid-template-columns:1fr}
  section{padding-block:56px}
  .nav-in{gap:8px}.nav-cta{display:none}
}
</style>
</head>

const qs = new URLSearchParams(location.search);
let lang = STR[qs.get("lang")] ? qs.get("lang") : "fr";
const persona = NAMES[qs.get("a")] ? qs.get("a") : "sofia";
const esc = s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fill = s=>String(s).split("{a}").join(NAMES[persona]);
const money = n=> lang==="en" ? "$"+n : n+" $";
const $ = id=>document.getElementById(id);
function render(){
  const S = STR[lang], q = lang==="fr" ? "" : "?lang="+lang;
  document.documentElement.lang = lang;
  document.title = "AI Staff — " + ({fr:"Votre adjointe personnelle IA",en:"Your AI personal assistant",es:"Tu asistente personal con IA"})[lang];
  document.querySelectorAll("[data-i18n]").forEach(e=>{ e.textContent = fill(S[e.dataset.i18n] ?? STR.fr[e.dataset.i18n] ?? ""); });
  document.querySelectorAll("[data-i18n-html]").forEach(e=>{ e.innerHTML = S[e.dataset.i18nHtml]; });
  document.querySelectorAll(".obcta").forEach(a=>a.href = "/onboarding/"+q);
  $("pain").innerHTML = S.pain.map(x=>`<div class="card"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div>`).join("");
  $("how").innerHTML = S.how.map((x,i)=>`<div class="card step"><b class="n">${i+1}</b><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div>`).join("");
  $("does").innerHTML = S.does.map(x=>`<div class="card"><div class="ic">${x[0]}</div><h3>${esc(x[1])}</h3><p>${esc(x[2])}</p></div>`).join("");
  $("priceTop").innerHTML = S.top.map(x=>`<span>${esc(x)}</span>`).join("");
  $("plans").innerHTML = PLANS[lang].map((p,i)=>`<div class="card plan"><div class="pn">${esc(p.name)}</div><div class="price"><span class="num">${money(p.price)}</span><span class="per">${esc(S["price.per"])}</span></div><p>${esc(p.tag)}</p><ul>${p.feat.map((f,j)=>`<li class="${j===0&&i>0?"inc":""}">${esc(fill(f))}</li>`).join("")}</ul><a class="btn btn-ghost obcta" href="/onboarding/${q}">${esc(p.cta)}</a></div>`).join("");
  const secs = SECTORS[lang];
  $("sectors").innerHTML = secs.map(x=>`<a class="card" href="/${x.slug}/${q}"><span class="e">${x.ic}</span>${esc(x.name)}</a>`).join("");
  $("ddMenu").innerHTML = secs.map(x=>`<a href="/${x.slug}/${q}"><span>${x.ic}</span>${esc(x.name)}</a>`).join("");
  $("faqList").innerHTML = S.faq.map(x=>`<details><summary>${esc(fill(x[0]))}</summary><p>${esc(fill(x[1]))}</p></details>`).join("");
  const fp = $("footPriv"); fp.href = "/confidentialite/"+q; fp.textContent = S["foot.priv"];
  document.querySelectorAll("#langSeg button").forEach(b=>b.classList.toggle("on", b.dataset.lang===lang));
}
document.querySelectorAll("#langSeg button").forEach(b=>b.addEventListener("click",()=>{
  lang = b.dataset.lang;
  try{ const p = new URLSearchParams(location.search); lang==="fr" ? p.delete("lang") : p.set("lang", lang); history.replaceState(null,"",location.pathname+(p.toString()?"?"+p:"")+location.hash); }catch(e){}
  render();
}));
const themeBtn = $("themeToggle");
function paintTheme(){ themeBtn.textContent = document.documentElement.getAttribute("data-theme")==="dark" ? "☀️" : "🌙"; }
themeBtn.addEventListener("click",()=>{ const n = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n); try{ localStorage.setItem("aistaff-theme", n); }catch(e){} paintTheme(); });
document.addEventListener("click",e=>{ const d=$("ddSectors"); if(d && d.open && !d.contains(e.target)) d.open=false; });
paintTheme(); render();
})();
</script>
