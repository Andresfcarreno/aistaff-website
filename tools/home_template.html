<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Staff · Votre prochaine employée est une IA</title>
<meta name="description" content="Une adjointe IA qui répond à vos appels jour et nuit, en français, en anglais et en espagnol, prend les messages et les demandes de rendez-vous, et vous envoie un résumé par texto.">
<meta property="og:title" content="AI Staff · Votre prochaine employée est une IA">
<meta property="og:description" content="Une adjointe IA qui répond à vos appels jour et nuit, en français, en anglais et en espagnol.">
<meta property="og:url" content="https://meetaistaff.com/">
<link rel="canonical" href="https://meetaistaff.com/">
<script>
(function(){try{var t=localStorage.getItem("aistaff-theme");if(!t){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<style>
:root{
  --navy:#0A1A33; --blue:#1F6FEB; --blue-d:#1858C4; --violet:#7C5CFF; --cyan:#22C7E8;
  --bg:#F4F6FB; --card:#FFFFFF; --ink:#0B1B33; --muted:#5B6B82; --line:rgba(11,27,51,.1);
  --soft:rgba(31,111,235,.08); --green:#1FA855; --amber:#C46A06;
  --r:20px; --shadow:0 10px 30px rgba(10,26,51,.07);
}
:root[data-theme="dark"]{
  --bg:#060E1C; --card:#0C1930; --ink:#EAF0FA; --muted:#93A3BD; --line:rgba(148,178,226,.14);
  --soft:rgba(64,130,246,.12); --green:#34C77B; --amber:#F0A53C; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
button{font:inherit;cursor:pointer}

/* nav */
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
nav.scrolled{border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;text-decoration:none;font-size:18px}
.brand i{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 210deg,var(--blue),var(--violet),var(--cyan),var(--blue));box-shadow:0 0 14px rgba(31,111,235,.45)}
.links{display:flex;gap:22px;margin-left:auto;font-size:14.5px}
.links a{text-decoration:none;color:var(--muted)}
.links a:hover{color:var(--ink)}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:none;color:var(--muted);font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px}
.seg button.on{background:var(--ink);color:var(--bg)}
.icon-btn{border:1px solid var(--line);background:none;color:var(--ink);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid transparent;transition:transform .15s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--blue);color:#fff;box-shadow:0 8px 24px rgba(31,111,235,.3)}
.btn-p:hover{background:var(--blue-d)}
.btn-g{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn-g:hover{border-color:var(--blue)}
.btn-sm{padding:9px 16px;font-size:14px}

/* hero */
.hero{position:relative;padding:28px 0 36px}
.hero:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(38% 26% at 78% 22%,rgba(124,92,255,.16),transparent 70%),radial-gradient(34% 26% at 18% 40%,rgba(34,199,232,.12),transparent 70%),radial-gradient(40% 30% at 60% 60%,rgba(31,111,235,.10),transparent 70%);animation:aurora 16s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate3d(-3%,4%,0) scale(1.06)}}
.hero-grid{position:relative;min-height:calc(100vh - 110px);min-height:calc(100svh - 110px);display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:28px}
.hero-text .ctas{justify-content:flex-start}
.hero-orb{text-align:center}
.kicker{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--blue);background:var(--soft);padding:6px 12px;border-radius:999px}
.orb-box{--glow:.35;position:relative;width:min(470px,100%);aspect-ratio:1;margin:0 auto;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 50% 45%,rgba(18,40,90,.95) 0%,#06122a 55%,#020610 100%);
  box-shadow:0 0 calc(30px + 70px*var(--glow)) rgba(110,100,255,calc(.18 + .3*var(--glow))),inset 0 0 70px rgba(60,160,255,.18),0 30px 60px rgba(4,12,30,.25)}
.orb-box:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(0deg,rgba(120,200,255,.045) 0 1px,transparent 1px 4px);pointer-events:none}
.orb-box canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.orb-box{overflow:hidden;isolation:isolate}
.orb-box.no-gl:after{content:"";position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle,rgba(140,220,255,.9),rgba(60,120,255,.4) 45%,transparent 70%);filter:blur(4px);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.8}}
.orb-box:focus-visible{outline:3px solid var(--blue);outline-offset:6px}
h1{font-size:clamp(36px,5.2vw,62px);line-height:1.04;letter-spacing:-.035em;margin:16px 0 16px}
.lead{font-size:clamp(16px,1.7vw,19px);color:var(--muted);max-width:560px;margin:0 0 28px}
.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin-top:14px}

.btn-call{font-size:16.5px;padding:16px 28px;position:relative}
.btn-call:after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid rgba(31,111,235,.5);animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}
.btn-call .ph{display:inline-block;animation:wiggle 2.2s ease-in-out infinite}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-14deg)}75%{transform:rotate(12deg)}85%{transform:rotate(-8deg)}}
.num-link{font-weight:700;color:var(--ink);text-decoration:none}
.try{padding:24px 0 72px}
.try-box{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center;background:linear-gradient(135deg,#071a3a,#10306a 55%,#2b2780);color:#fff;border-radius:30px;padding:44px;position:relative;overflow:hidden;box-shadow:0 30px 70px rgba(10,26,51,.25)}
.try-box:before{content:"";position:absolute;width:520px;height:520px;right:-140px;top:-200px;background:radial-gradient(circle,rgba(94,224,245,.28),transparent 65%);pointer-events:none}
.try .eyebrow{color:#7FD4FF}
.try h2{color:#fff;margin-bottom:10px}
.try-sub{color:rgba(255,255,255,.78);font-size:17px;max-width:560px;margin:0 0 22px}
.big-num{display:inline-flex;align-items:center;gap:16px;font-size:clamp(34px,5.4vw,56px);font-weight:800;letter-spacing:-.02em;color:#fff;text-decoration:none;line-height:1}
.big-num .ring{width:18px;height:18px;border-radius:50%;background:#34D27B;box-shadow:0 0 0 0 rgba(52,210,123,.6);animation:live 1.8s infinite}
@keyframes live{70%{box-shadow:0 0 0 16px rgba(52,210,123,0)}100%{box-shadow:0 0 0 0 rgba(52,210,123,0)}}
.big-num:hover{text-shadow:0 0 30px rgba(127,212,255,.6)}
.try-steps{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.try-steps span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.try-steps b{color:#7FD4FF;margin-right:6px}
.try-qr{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.75);text-align:center;max-width:180px}
.qr{background:#fff;border-radius:18px;padding:14px;width:168px;height:168px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.qr svg{width:100%;height:100%;display:block}
.notifs{display:grid;gap:10px;max-width:400px;margin:10px auto 0}
.nt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 14px 34px rgba(10,26,51,.16);opacity:0;transform:translateY(16px) scale(.95);transition:opacity .45s ease,transform .7s cubic-bezier(.2,1.5,.35,1)}
.nt.in{opacity:1;transform:none}
.nt .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:#fff;flex:none}
.nt .ic.sms{background:linear-gradient(#62E584,#1FB84A)}
.nt .ic.dash{background:linear-gradient(135deg,var(--blue),var(--violet))}
.nt .hd{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.nt b{display:block;font-size:14.5px;margin-top:1px}
.nt p{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.4}
.callbar{display:none}
.win{max-width:1120px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 70px rgba(10,26,51,.14);overflow:hidden}
.win-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,var(--card));flex-wrap:wrap}
.dots i{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px}
.dots i:nth-child(1){background:#FF5F57}.dots i:nth-child(2){background:#FEBC2E}.dots i:nth-child(3){background:#28C840}
.win-title{font-weight:700;font-size:14px}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.win-bar a{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--blue);text-decoration:none}
.win-tabs{display:flex;gap:4px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.dtab{border:0;background:none;padding:8px 15px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.dtab:hover{color:var(--ink)}
.dtab.active{background:var(--ink);color:var(--bg)}
.win-live{position:relative;overflow:hidden;background:var(--bg)}
.win-live iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;display:block}
.win-body{padding:18px;min-height:380px}
.dpane{animation:paneIn .35s ease}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.d-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.d-stat{background:var(--bg);border-radius:14px;padding:14px}
.d-stat span{display:block;font-size:12.5px;color:var(--muted)}
.d-stat b{display:block;font-size:26px;letter-spacing:-.02em;margin:2px 0}
.d-stat small{font-size:12px;color:var(--green)}
.d-h{font-size:13px;font-weight:700;color:var(--muted);margin:4px 0 10px}
.d-bars{display:flex;align-items:flex-end;gap:12px;height:150px;background:var(--bg);border-radius:14px;padding:14px 16px 10px}
.d-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;font-size:11.5px;color:var(--muted)}
.d-bar i{width:100%;max-width:38px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--blue),var(--violet));transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.d-call{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.d-who{display:flex;align-items:center;gap:10px}
.d-who i,.d-ini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;font-style:normal;flex:none}
.d-who b{display:block;font-size:14.5px}.d-who small{color:var(--muted);font-size:12.5px}
.d-tag{margin-left:auto;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;flex:none}
.d-tag.hot{color:#D9480F;background:rgba(217,72,15,.12)}.d-tag.warm{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.d-tag.cold{color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent)}.d-tag.new{color:var(--blue);background:var(--soft)}
.d-tag.info{color:var(--violet);background:color-mix(in srgb,var(--violet) 14%,transparent)}
.d-call p{margin:8px 0 0;font-size:14px}
.d-next{margin-top:8px;font-size:13px;font-weight:600;color:var(--blue)}
.d-tr{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;font-size:13.5px;display:grid;gap:5px}
.d-tr .tt{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.d-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:14px}
.d-row:last-child{border-bottom:0}
.d-row .tx{flex:1;min-width:0}.d-row small{color:var(--muted)}
.d-row .draft{margin-top:4px;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.d-note{font-size:13px;color:var(--muted);margin:0 0 12px}
.d-wk{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:10px;overflow-x:auto}
.d-col{background:var(--bg);border-radius:14px;padding:10px;display:grid;gap:8px;align-content:start;min-height:180px}
.d-col h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.d-ev{background:linear-gradient(135deg,rgba(31,111,235,.16),rgba(124,92,255,.12));border:1px solid rgba(31,111,235,.3);border-radius:10px;padding:8px 10px;font-size:12.5px}
.d-ev small{display:block;color:var(--muted)}
.d-free{border:1.5px dashed var(--line);border-radius:10px;padding:8px;font-size:12px;color:var(--muted);text-align:center}
.d-soc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.d-sc{background:var(--bg);border-radius:14px;padding:14px}
.d-sc .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px}.d-sc .h span{color:var(--muted);font-size:12.5px}
.d-kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.d-kp b{display:block;font-size:20px}.d-kp span{font-size:12px;color:var(--muted)}

/* captions */
.cap{min-height:104px;max-width:460px;margin:14px auto 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.cap .who{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cap .who.c{color:var(--muted)}
.cap .txt{font-size:clamp(17px,2.4vw,22px);font-weight:600;line-height:1.35}
.cap .txt span{opacity:.28;transition:opacity .18s}
.cap .txt span.on{opacity:1}
.cap .hint{font-size:13px;color:var(--muted)}
.sms{display:none;margin:4px auto 0;max-width:380px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);animation:pop .4s ease}
.sms b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

/* sections */
section{padding:72px 0}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0 0 8px}
h2{font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-.025em;margin:0 0 12px}
.sub{color:var(--muted);font-size:17px;max-width:620px;margin:0 0 34px}
.center{text-align:center}.center .sub{margin-left:auto;margin-right:auto}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.step .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--soft);color:var(--blue);margin-bottom:14px}
.step h3{margin:0 0 6px;font-size:18px}
.step p{margin:0;color:var(--muted);font-size:15px}
.does{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:820px;margin:0 auto}
.do{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;font-weight:600}
.tag{flex:none;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;color:var(--green);background:color-mix(in srgb,var(--green) 13%,transparent)}
.tag.ph{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column}
.plan h3{margin:0;font-size:20px}
.plan .t{color:var(--muted);font-size:14.5px;margin:6px 0 16px;min-height:44px}
.plan .p{font-size:42px;font-weight:800;letter-spacing:-.03em}
.plan .p small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.plan ul{list-style:none;padding:0;margin:18px 0 22px;display:grid;gap:9px;font-size:14.5px}
.plan li{display:flex;gap:9px}
.plan li:before{content:"✓";color:var(--blue);font-weight:800}
.plan .btn{margin-top:auto}
.calc{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;max-width:920px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}
.cin label{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:15px;margin:6px 0 8px}
.cin label b{color:var(--blue);font-size:18px}
.cin input[type=range]{width:100%;accent-color:var(--blue);margin:0 0 18px;height:28px}
.cdisc{font-size:13.5px;color:var(--muted);margin:4px 0 0}
.cout{background:var(--bg);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.bar .bl{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin-bottom:6px}
.bar .bl b{color:var(--ink);font-size:20px;letter-spacing:-.01em}
.track{height:12px;border-radius:99px;background:color-mix(in srgb,var(--muted) 15%,transparent);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9aa8bf,#6b7a93);transition:width .35s ease}
.bar.ai .track i{background:linear-gradient(90deg,var(--blue),var(--violet))}
.save{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px dashed var(--line);padding-top:14px;font-weight:700}
.save b{font-size:28px;color:var(--green);letter-spacing:-.02em}
.ccap{font-size:13px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
.chip{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.fine{font-size:13.5px;color:var(--muted);text-align:center;max-width:680px;margin:22px auto 0}
.secs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sec{display:inline-flex;gap:8px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:600;font-size:15px;transition:border-color .2s,transform .2s}
.sec:hover{border-color:var(--blue);transform:translateY(-2px)}
.faq{max-width:760px;margin:0 auto}
details{border-bottom:1px solid var(--line);padding:18px 2px}
summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--blue);font-size:22px;line-height:1;transition:transform .2s}
details[open] summary:after{transform:rotate(45deg)}
details p{color:var(--muted);margin:10px 0 0}
.final{text-align:center;padding:80px 0}

/* calculator: hours/week × wage × 4.33 vs AI Staff */
function money(n){ n = Math.round(n); return lang === "en" ? "$" + n.toLocaleString("en-CA") : n.toLocaleString(lang === "fr" ? "fr-CA" : "es-CA").replace(/\u202f|\u00a0/g, " ") + " $"; }
const r1 = document.getElementById("r1"), r2 = document.getElementById("r2");
let calcInit = false;
function renderCalc(){
  const C = DATA[lang].calc, ai = DATA[lang].plans[0].price;
  if(!calcInit){ [[r1,0],[r2,1]].forEach(([el,i]) => { el.min = C.r[i][0]; el.max = C.r[i][1]; el.step = C.r[i][2]; el.value = C.v[i]; }); calcInit = true; }
  document.getElementById("cEy").textContent = fill(C.eyebrow);
  document.getElementById("cTi").textContent = fill(C.title);
  document.getElementById("cLe").textContent = fill(C.lead);
  document.getElementById("l1").textContent = C.l1;
  document.getElementById("l2").textContent = C.l2;
  document.getElementById("cDisc").textContent = fill(C.disc);
  document.getElementById("cNote").textContent = fill(C.note);
  updateCalc();
}
function tween(el, val, fmt){
  const from = el._v ?? val, t0 = performance.now(); el._v = val;
  const step = now => { const k = Math.min(1, (now - t0) / 380), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (val - from) * e); if(k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function updateCalc(){
  const C = DATA[lang].calc, ai = DATA[lang].plans[0].price, h = +r1.value, w = +r2.value, emp = h * w * 4.33;
  document.getElementById("v1").textContent = h + " h";
  document.getElementById("v2").textContent = money(w) + (lang === "en" ? "/h" : " / h");
  tween(document.getElementById("cEmp"), emp, money);
  document.getElementById("cAi").textContent = (lang === "en" ? "from " : lang === "fr" ? "dès " : "desde ") + money(ai);
  tween(document.getElementById("cSave"), Math.max(0, emp - ai), money);
  const top = Math.max(emp, ai);
  document.getElementById("bEmp").style.width = (emp / top * 100) + "%";
  document.getElementById("bAi").style.width = Math.max(3, ai / top * 100) + "%";
  document.getElementById("cCap").textContent = money(emp) + " " + fill(C.cap).replace(/\{p\}/g, money(ai));
}
r1.addEventListener("input", updateCalc); r2.addEventListener("input", updateCalc);

/* reveal on scroll */
let io = null;
function observeReveal(){
  const els = document.querySelectorAll(".reveal:not(.in)");
  if(!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); return; }
  io = io || new IntersectionObserver(es => es.forEach(x => { if(x.isIntersecting){ x.target.classList.add("in"); io.unobserve(x.target); } }), {rootMargin:"0px 0px -8% 0px"});
  els.forEach(e => io.observe(e));
}

/* ---------------------------------------------------------------- orb (mismo de la consola de voz del dashboard /demo/) */
// Copiado tal cual de demo/index.html (glNebula, hudState, hudDraw, sizeCanvas) para que el orbe sea el mismo.
/* ---- WebGL nebula ---- */
const VC_FS = `precision highp float;uniform vec2 uR;uniform float uT,uA,uU;
float h(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float n(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fb(vec3 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.02+vec3(3.1,1.7,4.3);a*=.5;}return v;}
void main(){vec2 uv=(gl_FragCoord.xy-.5*uR)/(.5*min(uR.x,uR.y));float d=length(uv);float ang=atan(uv.y,uv.x);
float R=.46+uA*.07;
vec2 q=uv*mat2(cos(uT*.12),-sin(uT*.12),sin(uT*.12),cos(uT*.12));
float w=fb(vec3(q*1.6,uT*.18));
float f=fb(vec3(q*2.4+w*1.8,uT*.22+uA*.6));
vec3 a1=mix(vec3(.08,.25,.95),vec3(1.,.45,.15),uU),a2=mix(vec3(.3,.85,1.),vec3(1.,.8,.4),uU),a3=mix(vec3(.55,.3,1.),vec3(1.,.35,.45),uU);
float core=smoothstep(R+.12,0.,d);
float swirl=smoothstep(.35,.85,f);
vec3 col=mix(a1,a2,swirl)*core*(.35+1.1*f)*(.75+uA*.9);
col+=a3*core*pow(max(w-.35,0.),2.)*2.2;
float shell=exp(-pow((d-R)*9.,2.))*(.55+uA*1.1);
vec3 sc=mix(a2,a3,.5+.5*sin(ang*2.+uT*.8));
col+=sc*shell;
float halo=exp(-max(d-R,0.)*5.)*.35*(1.+uA);
col+=a1*halo*(1.-core);
float al=clamp(max(max(core*(.25+f),shell),halo),0.,1.);
gl_FragColor=vec4(col,al);}`;
function glNebula(cv){
  let gl = null; try{ gl = cv.getContext("webgl",{premultipliedAlpha:true,alpha:true}); }catch(e){}
  if(!gl) return null;
  const vs = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  const sh = (t,src)=>{ const o = gl.createShader(t); gl.shaderSource(o,src); gl.compileShader(o); return o; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER,vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER,VC_FS)); gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr, gl.LINK_STATUS)) return null;
  gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr,"p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uR = gl.getUniformLocation(pr,"uR"), uT = gl.getUniformLocation(pr,"uT"), uA = gl.getUniformLocation(pr,"uA"), uU = gl.getUniformLocation(pr,"uU");
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  return {gl, cv, uR, uT, uA, uU, user:0,
    draw(t, amp, user){ gl.viewport(0,0,cv.width,cv.height); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform2f(uR,cv.width,cv.height); gl.uniform1f(uT,t); gl.uniform1f(uA,amp); gl.uniform1f(uU,user); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); }};
}
/* ---- 2D HUD: radial voice bars, rotating arcs, particles (shared by console + mini card) ---- */
function hudState(nParts){
  const N = 96;
  return {N, bars:new Float32Array(N), seeds:Array.from({length:N},()=>Math.random()*6.28),
    parts:Array.from({length:nParts},()=>({r:.62+Math.random()*.34, a:Math.random()*6.28, s:(Math.random()*.25+.05)*(Math.random()<.5?-1:1), z:Math.random()}))};
}
function hudDraw(ctx, W, H, t, amp, u, st){
  const cx = W/2, cy = H/2, S = Math.min(W,H)/2, N = st.N, bars = st.bars;
  ctx.clearRect(0,0,W,H);
  const c1 = u>.5 ? [255,170,110] : [110,180,255], c2 = u>.5 ? [255,120,140] : [150,120,255];
  const r0 = S*.60;
  for(let i=0;i<N;i++){
    const k = i < N/2 ? i : N-1-i;
    const nz = .5+.5*Math.sin(t*(3+k*.13)+st.seeds[k]) * Math.sin(t*1.7+k*.4);
    const val = amp*(.25+.75*nz)*(1 - Math.abs(k-N/4)/(N/2)*.45);
    bars[i] += (val - bars[i])*.35;
    const a = i/N*Math.PI*2 - Math.PI/2 + t*.05, len = S*(.03 + bars[i]*.30);
    const mix = i/N, col = c1.map((v,j)=>Math.round(v*(1-mix)+c2[j]*mix));
    ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${.35+bars[i]*.9})`;
    ctx.lineWidth = Math.max(1.2, S*.011); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0); ctx.lineTo(cx+Math.cos(a)*(r0+len), cy+Math.sin(a)*(r0+len)); ctx.stroke();
  }
  ctx.strokeStyle = `rgba(${c1[0]},${c1[1]},${c1[2]},.22)`; ctx.lineWidth = Math.max(1, S/200);
  ctx.beginPath(); ctx.arc(cx,cy,r0-S*.035,0,Math.PI*2); ctx.stroke();
  const rt = S*.955, rot = t*.12;
  ctx.strokeStyle = `rgba(${c1[0]},${c1[1]},${c1[2]},.35)`; ctx.lineWidth = Math.max(1,S*.005);
  for(let k=0;k<120;k++){ const a = k/120*Math.PI*2 + rot, l = k%10===0 ? S*.04 : S*.018;
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*rt, cy+Math.sin(a)*rt); ctx.lineTo(cx+Math.cos(a)*(rt-l), cy+Math.sin(a)*(rt-l)); ctx.stroke(); }

const mobile = innerWidth < 760;
/* ---------- Geometría: icosfera ---------- */
function icosphere(detail) {
  const t = (1 + Math.sqrt(5)) / 2;
  const norm = v => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };
  const verts = [[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(norm);
  let faces = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  for (let d = 0; d < detail; d++) {
    const cache = {}, nf = [];
    const mid = (a, b) => {
      const k = a < b ? a + '_' + b : b + '_' + a;
      if (cache[k] === undefined) { const va = verts[a], vb = verts[b]; verts.push(norm([(va[0]+vb[0])/2,(va[1]+vb[1])/2,(va[2]+vb[2])/2])); cache[k] = verts.length - 1; }
      return cache[k];
    };
    for (const [a, b, c] of faces) { const ab = mid(a,b), bc = mid(b,c), ca = mid(c,a); nf.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]); }
    faces = nf;
  }
  const seen = new Set(), edges = [];
  for (const [a, b, c] of faces) for (const [x, y] of [[a,b],[b,c],[c,a]]) { const k = x < y ? x + '_' + y : y + '_' + x; if (!seen.has(k)) { seen.add(k); edges.push([x, y]); } }
  return { verts, edges };
}

/* ---------- Núcleo de voz ---------- */
class Core {
  constructor(canvas, o = {}) {
    this.cv = canvas; this.ctx = canvas.getContext('2d');
    this.o = Object.assign({ detail: 2, scale: 0.2, bars: 120, rings: true, nebula: false, stars: 0, glow: 1 }, o);
    this.geo = icosphere(this.o.detail);
    this.proj = this.geo.verts.map(() => ({ x: 0, y: 0, z: 0 }));
    this.stars = Array.from({ length: this.o.stars }, () => ({ x: Math.random(), y: Math.random(), z: Math.random() * 0.8 + 0.2, p: Math.random() * 6.28 }));
    this.blobs = [
      { x: .28, y: .38, r: .55, c: '139,92,255', s: .07 },
      { x: .74, y: .30, r: .45, c: '92,242,255', s: .05 },
      { x: .62, y: .78, r: .50, c: '255,79,184', s: .06 },
      { x: .18, y: .80, r: .40, c: '92,120,255', s: .04 },
      { x: .50, y: .50, r: .30, c: '139,92,255', s: .09 }
    ];
    this.pulses = []; this.visible = true; this.resize();
    new ResizeObserver(() => this.resize()).observe(canvas);
    new IntersectionObserver(e => { this.visible = e[0].isIntersecting; }).observe(canvas);
  }
  resize() {
    const r = Math.min(devicePixelRatio || 1, mobile ? 1.5 : 2);
    this.w = this.cv.clientWidth; this.h = this.cv.clientHeight;
    this.cv.width = Math.max(1, Math.round(this.w * r)); this.cv.height = Math.max(1, Math.round(this.h * r));
    this.ctx.setTransform(r, 0, 0, r, 0, 0);
  }
  pulse(x, y) { this.pulses.push({ t0: performance.now() / 1000, x, y }); if (this.pulses.length > 6) this.pulses.shift(); }
  draw(t, amp, s = {}) {
    if (!this.visible || !this.w) return;
    const { ctx, w, h, o } = this;
    const zoom = s.zoom || 1, mx = s.mx || 0, my = s.my || 0, alpha = s.alpha ?? 1;
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';

    if (o.nebula) {
      for (const b of this.blobs) {
        const x = (b.x + Math.sin(t * b.s * 3) * .05 - mx * .03) * w, y = (b.y + Math.cos(t * b.s * 2.3) * .05 - my * .03) * h;
        const r = b.r * Math.max(w, h) * (0.9 + amp * 0.08);
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(${b.c},${0.22 * alpha})`); g.addColorStop(.5, `rgba(${b.c},${0.07 * alpha})`); g.addColorStop(1, `rgba(${b.c},0)`);
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    }
    for (const st of this.stars) {
      const x = ((st.x - mx * .02 * st.z) % 1 + 1) % 1 * w, y = ((st.y - my * .02 * st.z - t * .004 * st.z) % 1 + 1) % 1 * h;
      const a = (0.25 + 0.75 * Math.abs(Math.sin(t * 1.3 + st.p))) * st.z * alpha;
      ctx.fillStyle = `rgba(220,230,255,${a})`; ctx.fillRect(x, y, st.z * 1.8, st.z * 1.8);
    }

    const cx = w / 2 + mx * 18, cy = h / 2 + my * 18;
    const R = Math.min(w, h) * o.scale * zoom;
    const ry = t * .22 + (s.spin || 0) + mx * .5, rx = t * .13 + (s.spin || 0) * .35 + my * .4;
    const cyR = Math.cos(ry), syR = Math.sin(ry), cxR = Math.cos(rx), sxR = Math.sin(rx);

    const hg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 2.2);
    hg.addColorStop(0, `rgba(139,92,255,${(0.28 + amp * 0.25) * o.glow * alpha})`);
    hg.addColorStop(.45, `rgba(92,242,255,${0.06 * o.glow * alpha})`);
    hg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(cx, cy, R * 2.2, 0, 6.2832); ctx.fill();

    const V = this.geo.verts;
    for (let i = 0; i < V.length; i++) {
      let [x, y, z] = V[i];
      const d = 1 + amp * 0.24 * (Math.sin(x * 4 + t * 3.1) * Math.sin(y * 4 + t * 2.3) + Math.sin(z * 5 - t * 2.7)) * 0.5;
      x *= d; y *= d; z *= d;
      const x1 = x * cyR + z * syR, z1 = -x * syR + z * cyR;
      const y2 = y * cxR - z1 * sxR, z2 = y * sxR + z1 * cxR;
      const k = 3 / (3 - z2);
      const p = this.proj[i]; p.x = cx + x1 * R * k; p.y = cy + y2 * R * k; p.z = z2;
    }
    ctx.lineWidth = 1;
    for (const [a, b] of this.geo.edges) {
      const A = this.proj[a], B = this.proj[b];
      const depth = ((A.z + B.z) / 2 + 1) / 2;
      const hue = 186 + Math.max(0, Math.min(1, ((A.x + B.x) / 2 - cx + R) / (2 * R))) * 134;

    }

      ctx.beginPath(); ctx.arc(p.x, p.y, 1 + p.z * 1.3, 0, 6.2832); ctx.fill();
    }

    if (o.bars) {
      ctx.lineWidth = Math.max(1.2, R * 0.012); ctx.lineCap = 'round';
      const r0 = R * 1.55;
      for (let i = 0; i < o.bars; i++) {

        const hue = 186 + (Math.sin(ang) * .5 + .5) * 134;

    }

      ctx.lineWidth = 1;
      for (const [rr, sq, tilt, sp] of [[2.05, .30, .4, .5], [2.5, .22, -.5, -.32], [1.8, .9, 1.2, .7]]) {

        ctx.beginPath(); ctx.ellipse(0, 0, R * rr, R * rr * sq, 0, 0, 6.2832); ctx.stroke();

        ctx.restore();
      }
    }
    /* Ondas de choque al tocar la esfera */
    const now = performance.now() / 1000;
    this.pulses = this.pulses.filter(pu => now - pu.t0 < 1.6);
    for (const pu of this.pulses) {
      const k = (now - pu.t0) / 1.6, e = 1 - Math.pow(1 - k, 3);
      const ox = pu.x ?? cx, oy = pu.y ?? cy;
      for (let j = 0; j < 3; j++) {
        const kk = Math.max(0, e - j * .12);
        ctx.strokeStyle = `hsla(${186 + j * 60},100%,70%,${(1 - k) * .7 * alpha})`;
        ctx.lineWidth = 2.2 - j * .5;
        ctx.beginPath(); ctx.arc(ox, oy, R * (.4 + kk * 3.4), 0, 6.2832); ctx.stroke();

      for (let j = 0; j < 22; j++) {
        const a = j / 22 * 6.2832 + pu.t0, d = R * (.3 + e * (2.2 + (j % 5) * .35));

      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

function voicesFor(code){
  let vs = []; try{ vs = speechSynthesis.getVoices(); }catch(e){}
  const base = code.slice(0,2);
  const exact = vs.filter(v => v.lang && v.lang.replace("_","-").toLowerCase() === code.toLowerCase());
  const same = vs.filter(v => v.lang && v.lang.toLowerCase().startsWith(base));
  const list = exact.concat(same.filter(v => !exact.includes(v)));
  return list;
}
function showLine(who, text){
  const words = text.split(/\s+/);
  cap.innerHTML = `<div class="who${who==="c"?" c":""}">${esc(who==="a" ? A : t("demo.who.c"))}</div><div class="txt">${words.map(w=>`<span>${esc(w)}</span>`).join(" ")}</div>`;

}
function playDemo(){
  stopDemo(); playing = true; setListenLabel(); notifs.innerHTML = ""; ORB.face(true);
  const my = ++runId, demo = STR[lang].demo;
  const lines = demo.lines.map(([w, s]) => [w, fill(s)]);
  const canSpeak = "speechSynthesis" in window && voicesFor(demo.lang).length > 0;
  const vs = canSpeak ? voicesFor(demo.lang) : [];

  let i = 0;

    if(i >= lines.length){ // fin: texto al dueño
      ORB.speak(false); playing = false; setListenLabel(); later(() => { if(my===runId) ORB.face(false); }, 2500);

    ORB.speak(who === "a");

      // sin eventos de palabra (algunos navegadores): se simulan
      const tick = () => { if(ended || my!==runId) return; if(!gotBoundary){ lit(); if(who==="a") ORB.bump(0.5 + Math.random()*0.5); } later(tick, 300); };

    m.innerHTML = esc(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(https?:\/\/[^\s)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    if (ctas.length) { const b = document.createElement("div"); b.className = "sf-cta"; ctas.forEach(k => { const a = document.createElement("a"); a.textContent = S().cta[k]; a.href = href(k); if (k === "plans") a.addEventListener("click", () => toggle(false)); b.appendChild(a); }); m.appendChild(b); }
    log.appendChild(m); log.scrollTop = log.scrollHeight;
  }
  function toggle(v) {
    sf.classList.toggle("open", v); btn.setAttribute("aria-expanded", v); tease.classList.remove("show");
    if (v && !greeted) { greeted = true; setTimeout(() => { add("ai", S().hi); talk = 1; }, 300); }
    if (v && matchMedia("(pointer:fine)").matches) setTimeout(() => inp.focus(), 350);
  }
  btn.addEventListener("click", () => toggle(!sf.classList.contains("open")));
  tease.addEventListener("click", () => toggle(true));
  $("sfX").addEventListener("click", () => toggle(false));
  addEventListener("keydown", e => { if (e.key === "Escape" && sf.classList.contains("open")) toggle(false); });
  $("sfChips").addEventListener("click", e => { const b = e.target.closest("button"); if (b) ask(b.textContent); });
  $("sfForm").addEventListener("submit", e => { e.preventDefault(); ask(inp.value); });
  async function ask(q) {
    q = (q || "").trim(); if (!q || busy) return;
    busy = true; $("sfSend").disabled = true; inp.value = "";
    add("user", q); hist.push({ role: "user", content: q.slice(0, 600) }); ORB.bump(.6);
    const ty = document.createElement("div"); ty.className = "sf-m ai typing"; ty.innerHTML = "<i></i><i></i><i></i>"; log.appendChild(ty); log.scrollTop = log.scrollHeight;
    let reply = "";
    try {
      const r = await fetch(URL_, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sid, bot: "sofia", lang, messages: hist.slice(-12) }) });
      const j = await r.json().catch(() => ({}));
      reply = j.reply || (r.status === 429 ? S().lim : "");
    } catch (e) {}
    ty.remove();
    if (!reply) reply = S().err; else hist.push({ role: "assistant", content: reply });
    add("ai", reply); talk = 1; ORB.bump(.8);
    busy = false; $("sfSend").disabled = false;
  }
  let teased = false; try { teased = !!sessionStorage.getItem("sfTease"); } catch (e) {}
  setTimeout(() => { if (teased || sf.classList.contains("open")) return; try { sessionStorage.setItem("sfTease", "1"); } catch (e) {} tease.classList.add("show"); setTimeout(() => tease.classList.remove("show"), 8000); }, 20000);
  window.sofiaTick = (t, amp) => { talk *= .985; const a = Math.max(.12, talk * amp + (busy ? .5 : 0) * amp); o1.draw(t, a); if (sf.classList.contains("open")) o2.draw(t, a); };
  window.sofiaChatRender();
})();
</script>
