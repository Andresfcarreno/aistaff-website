<meta property="og:title" content="AI Staff · Votre prochaine employée est une IA">
<meta property="og:description" content="Une adjointe IA qui répond à vos appels jour et nuit, en français, en anglais et en espagnol.">

</script>
<style>
:root{
  --navy:#0A1A33; --blue:#1F6FEB; --blue-d:#1858C4; --violet:#7C5CFF; --cyan:#22C7E8;
  --bg:#F4F6FB; --card:#FFFFFF; --ink:#0B1B33; --muted:#5B6B82; --line:rgba(11,27,51,.1);
  --soft:rgba(31,111,235,.08); --green:#1FA855; --amber:#C46A06;
  --r:20px; --shadow:0 10px 30px rgba(10,26,51,.07);
}
:root[data-theme="dark"]{
  --bg:#060E1C; --card:#0C1930; --ink:#EAF0FA; --muted:#93A3BD; --line:rgba(148,178,226,.14);
  --soft:rgba(64,130,246,.12); --green:#34C77B; --amber:#F0A53C; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
button{font:inherit;cursor:pointer}

/* nav */
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
nav.scrolled{border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;text-decoration:none;font-size:18px}
.brand i{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 210deg,var(--blue),var(--violet),var(--cyan),var(--blue));box-shadow:0 0 14px rgba(31,111,235,.45)}
.links{display:flex;gap:22px;margin-left:auto;font-size:14.5px}
.links a{text-decoration:none;color:var(--muted)}
.links a:hover{color:var(--ink)}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:none;color:var(--muted);font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px}
.seg button.on{background:var(--ink);color:var(--bg)}
.icon-btn{border:1px solid var(--line);background:none;color:var(--ink);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid transparent;transition:transform .15s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--blue);color:#fff;box-shadow:0 8px 24px rgba(31,111,235,.3)}
.btn-p:hover{background:var(--blue-d)}
.btn-g{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn-g:hover{border-color:var(--blue)}
.btn-sm{padding:9px 16px;font-size:14px}

/* hero */
.hero{position:relative;height:180vh}
.hero:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(38% 26% at 78% 22%,rgba(124,92,255,.16),transparent 70%),radial-gradient(34% 26% at 18% 40%,rgba(34,199,232,.12),transparent 70%),radial-gradient(40% 30% at 60% 60%,rgba(31,111,235,.10),transparent 70%);animation:aurora 16s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate3d(-3%,4%,0) scale(1.06)}}
.hero-grid{position:sticky;top:64px;height:calc(100vh - 64px);height:calc(100svh - 64px);display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:28px}
.scroll-hint{margin-top:34px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px;opacity:calc(1 - var(--hm, 0)*2)}
.scroll-hint:before{content:"";width:22px;height:34px;border:1.6px solid var(--muted);border-radius:12px;background:linear-gradient(var(--muted),var(--muted)) center 7px/2px 7px no-repeat;animation:wheel 1.8s ease-in-out infinite}
@keyframes wheel{50%{background-position:center 15px}}
.halo{position:absolute;inset:-9%;border-radius:50%;pointer-events:none;filter:blur(14px);
  background:radial-gradient(circle at 50% calc(50% - var(--m,0)*16%),rgba(110,190,255,calc(.16 + .45*var(--glow))) 0%,rgba(124,92,255,calc(.08 + .22*var(--m,0))) 24%,rgba(34,199,232,calc(.05 + .1*var(--glow))) 40%,transparent 62%)}
.hero-text .ctas{justify-content:flex-start}
.hero-orb{text-align:center}
.kicker{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--blue);background:var(--soft);padding:6px 12px;border-radius:999px}
.orb-box{--glow:.35;position:relative;width:min(470px,100%);aspect-ratio:1;margin:0 auto;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 50% 42%,#12305e 0%,#081a36 46%,#040b18 72%,#030812 100%);
  box-shadow:0 0 calc(30px + 70px*var(--glow)) rgba(40,140,255,calc(.18 + .3*var(--glow))),inset 0 0 70px rgba(60,160,255,.18),0 30px 60px rgba(4,12,30,.25)}
.orb-box:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(0deg,rgba(120,200,255,.045) 0 1px,transparent 1px 4px);pointer-events:none}
.orb-box canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.orb-box.no-gl:after{content:"";position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle,rgba(140,220,255,.9),rgba(60,120,255,.4) 45%,transparent 70%);filter:blur(4px);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.8}}
.orb-box:focus-visible{outline:3px solid var(--blue);outline-offset:6px}
h1{font-size:clamp(36px,5.2vw,62px);line-height:1.04;letter-spacing:-.035em;margin:16px 0 16px}
.lead{font-size:clamp(16px,1.7vw,19px);color:var(--muted);max-width:560px;margin:0 0 28px}
.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin-top:14px}

/* captions */
.cap{min-height:104px;max-width:460px;margin:14px auto 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.cap .who{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cap .who.c{color:var(--muted)}
.cap .txt{font-size:clamp(17px,2.4vw,22px);font-weight:600;line-height:1.35}
.cap .txt span{opacity:.28;transition:opacity .18s}
.cap .txt span.on{opacity:1}
.cap .hint{font-size:13px;color:var(--muted)}
.sms{display:none;margin:4px auto 0;max-width:380px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);animation:pop .4s ease}
.sms b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

/* sections */
section{padding:72px 0}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0 0 8px}
h2{font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-.025em;margin:0 0 12px}
.sub{color:var(--muted);font-size:17px;max-width:620px;margin:0 0 34px}
.center{text-align:center}.center .sub{margin-left:auto;margin-right:auto}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.step .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--soft);color:var(--blue);margin-bottom:14px}
.step h3{margin:0 0 6px;font-size:18px}
.step p{margin:0;color:var(--muted);font-size:15px}
.does{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:820px;margin:0 auto}
.do{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;font-weight:600}
.tag{flex:none;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;color:var(--green);background:color-mix(in srgb,var(--green) 13%,transparent)}
.tag.ph{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column}
.plan h3{margin:0;font-size:20px}
.plan .t{color:var(--muted);font-size:14.5px;margin:6px 0 16px;min-height:44px}
.plan .p{font-size:42px;font-weight:800;letter-spacing:-.03em}
.plan .p small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.plan ul{list-style:none;padding:0;margin:18px 0 22px;display:grid;gap:9px;font-size:14.5px}
.plan li{display:flex;gap:9px}
.plan li:before{content:"✓";color:var(--blue);font-weight:800}
.plan .btn{margin-top:auto}
.calc{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;max-width:920px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}
.cin label{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:15px;margin:6px 0 8px}
.cin label b{color:var(--blue);font-size:18px}
.cin input[type=range]{width:100%;accent-color:var(--blue);margin:0 0 18px;height:28px}
.cdisc{font-size:13.5px;color:var(--muted);margin:4px 0 0}
.cout{background:var(--bg);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.bar .bl{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin-bottom:6px}
.bar .bl b{color:var(--ink);font-size:20px;letter-spacing:-.01em}
.track{height:12px;border-radius:99px;background:color-mix(in srgb,var(--muted) 15%,transparent);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9aa8bf,#6b7a93);transition:width .35s ease}
.bar.ai .track i{background:linear-gradient(90deg,var(--blue),var(--violet))}
.save{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px dashed var(--line);padding-top:14px;font-weight:700}
.save b{font-size:28px;color:var(--green);letter-spacing:-.02em}
.ccap{font-size:13px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
.chip{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.fine{font-size:13.5px;color:var(--muted);text-align:center;max-width:680px;margin:22px auto 0}
.secs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sec{display:inline-flex;gap:8px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:600;font-size:15px;transition:border-color .2s,transform .2s}
.sec:hover{border-color:var(--blue);transform:translateY(-2px)}
.faq{max-width:760px;margin:0 auto}
details{border-bottom:1px solid var(--line);padding:18px 2px}
summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--blue);font-size:22px;line-height:1;transition:transform .2s}
details[open] summary:after{transform:rotate(45deg)}
details p{color:var(--muted);margin:10px 0 0}
.final{text-align:center;padding:80px 0}
.final .box{background:linear-gradient(135deg,var(--navy),#16316a 60%,#2a2a7a);color:#fff;border-radius:28px;padding:56px 24px}
.final h2{color:#fff}
.final p{color:rgba(255,255,255,.75);margin:0 0 26px}
.final .btn-g{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
footer{border-top:1px solid var(--line);padding:30px 0 40px;font-size:14px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:14px 26px;justify-content:space-between}
.foot nav{position:static;background:none;backdrop-filter:none;border:0;display:flex;flex-wrap:wrap;gap:8px 16px}
.foot a{text-decoration:none}.foot a:hover{color:var(--ink)}

.reveal{opacity:0;transform:translateY(26px) scale(.985);filter:blur(8px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1),filter .9s ease}
.reveal.in{opacity:1;transform:none;filter:none}
.step,.plan,.do,.sec{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s}
.step:hover,.plan:hover,.do:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(10,26,51,.1);border-color:color-mix(in srgb,var(--blue) 35%,var(--line))}

@media (max-width:860px){
  .hero{height:auto;padding:28px 0 36px}
  .hero-grid{position:static;height:auto;grid-template-columns:1fr;text-align:center;gap:6px}
  .scroll-hint{display:none}
  .hero-text .ctas{justify-content:center}
  .lead{margin-left:auto;margin-right:auto}
  .orb-box{width:min(330px,84vw);margin-top:18px}
  .links{display:none}
  .tools{margin-left:auto}
  .steps,.plans,.calc{grid-template-columns:1fr}
  .calc{padding:18px}
  .does{grid-template-columns:1fr}
  .plan .t{min-height:0}
  section{padding:56px 0}
}
@media (max-width:420px){
  .nav-cta{display:none}
  .wrap{padding:0 16px}
}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;filter:none;transition:none}
  .hero{height:auto;padding:28px 0 36px}.hero-grid{position:static;height:auto}.hero:before{animation:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<nav id="nav">
  <div class="wrap nav-in">
    <a class="brand" href="/"><i></i>AI Staff</a>

      <a href="#how" data-t="nav.how"></a>

<header class="hero">
  <div class="wrap hero-grid">

<section id="how">
  <div class="wrap">

</section>

<section id="does" style="padding-top:0">
  <div class="wrap">
    <div class="center reveal">
      <p class="eyebrow" data-t="does.eyebrow"></p>
      <h2 data-t="does.title"></h2>
    </div>
    <div class="does reveal" id="doesList" style="margin-top:30px"></div>
  </div>
</section>

<section id="calc">

<section id="plans" style="padding-top:0">
  <div class="wrap">
    <div class="center reveal">
      <p class="eyebrow" data-t="plans.eyebrow"></p>
      <h2 data-t="plans.title"></h2>
      <p class="sub" data-t="plans.sub"></p>

</section>

<section id="sectors" style="padding-top:0">

<section id="faq" style="padding-top:0">

</div>

<script>
const DATA = __DATA__;

const STR = {
fr:{
 "nav.how":"Comment ça marche","nav.calc":"Calculer","nav.plans":"Tarifs","nav.sectors":"Secteurs","nav.faq":"FAQ",
 "cta.book":"Réserver ma démo","cta.call":"📞 Appeler la ligne démo",
 "hero.kicker":"Adjointe IA · Montréal",
 "hero.h1":"Votre prochaine employée est une IA.",
 "hero.lead":"{a} répond à vos appels jour et nuit, en français, en anglais et en espagnol, prend les messages et les demandes de rendez-vous, et vous envoie un résumé par texto.",
 "hero.note":"Ligne démo : +1 (438) 805-8804 · l'appel est transcrit","hero.scroll":"Faites défiler pour rencontrer {a}",

const A = PERS[persona];
let lang = ["fr","en","es"].includes(qs.get("lang")) ? qs.get("lang") : "fr";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t = k => (STR[lang][k] ?? STR.fr[k] ?? "");
const fill = s => String(s).replace(/\{a\}/g, A);

function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = fill(t(el.dataset.t)); });
  document.querySelectorAll("#langSeg button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  const S = STR[lang], D = DATA[lang];
  document.getElementById("steps").innerHTML = S.steps.map((s,i)=>`<div class="step reveal"><div class="n">${i+1}</div><h3>${esc(fill(s[0]))}</h3><p>${esc(fill(s[1]))}</p></div>`).join("");
  document.getElementById("doesList").innerHTML = S.does.map(d=>`<div class="do"><span>${esc(fill(d[0]))}</span><span class="tag${d[1]?"":" ph"}">${esc(d[1]?t("today"):t("phases"))}</span></div>`).join("");
  document.getElementById("priceTop").innerHTML = D.priceTop.map(x=>`<span class="chip">${esc(x)}</span>`).join("");

  document.getElementById("planList").innerHTML = D.plans.map(p=>`<div class="plan"><h3>${esc(p.name)}</h3><div class="t">${esc(fill(p.tag))}</div><div class="p">${p.price} $<small> ${esc(D.per)}</small></div><ul>${p.feat.map(f=>`<li><span>${esc(fill(f))}</span></li>`).join("")}</ul><a class="btn btn-g" href="/onboarding/${q}">${esc(p.cta)}</a></div>`).join("");
  document.getElementById("rollout").textContent = D.rollout;
  document.getElementById("secList").innerHTML = DATA.sectors[lang].map(s=>`<a class="sec" href="/${s.slug}/${q}"><span>${s.ic}</span>${esc(s.name)}</a>`).join("");
  document.getElementById("faqList").innerHTML = S.faq.map(f=>`<details><summary>${esc(fill(f[0]))}</summary><p>${esc(fill(f[1]))}</p></details>`).join("");

}

/* calculator: hours/week × wage × 4.33 vs AI Staff */
function money(n){ n = Math.round(n); return lang === "en" ? "$" + n.toLocaleString("en-CA") : n.toLocaleString(lang === "fr" ? "fr-CA" : "es-CA").replace(/\u202f|\u00a0/g, " ") + " $"; }
const r1 = document.getElementById("r1"), r2 = document.getElementById("r2");
let calcInit = false;
function renderCalc(){
  const C = DATA[lang].calc, ai = DATA[lang].plans[0].price;
  if(!calcInit){ [[r1,0],[r2,1]].forEach(([el,i]) => { el.min = C.r[i][0]; el.max = C.r[i][1]; el.step = C.r[i][2]; el.value = C.v[i]; }); calcInit = true; }
  document.getElementById("cEy").textContent = fill(C.eyebrow);
  document.getElementById("cTi").textContent = fill(C.title);
  document.getElementById("cLe").textContent = fill(C.lead);
  document.getElementById("l1").textContent = C.l1;
  document.getElementById("l2").textContent = C.l2;
  document.getElementById("cDisc").textContent = fill(C.disc);
  document.getElementById("cNote").textContent = fill(C.note);
  updateCalc();
}
function tween(el, val, fmt){
  const from = el._v ?? val, t0 = performance.now(); el._v = val;
  const step = now => { const k = Math.min(1, (now - t0) / 380), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (val - from) * e); if(k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function updateCalc(){
  const C = DATA[lang].calc, ai = DATA[lang].plans[0].price, h = +r1.value, w = +r2.value, emp = h * w * 4.33;
  document.getElementById("v1").textContent = h + " h";
  document.getElementById("v2").textContent = money(w) + (lang === "en" ? "/h" : " / h");
  tween(document.getElementById("cEmp"), emp, money);
  document.getElementById("cAi").textContent = (lang === "en" ? "from " : lang === "fr" ? "dès " : "desde ") + money(ai);
  tween(document.getElementById("cSave"), Math.max(0, emp - ai), money);
  const top = Math.max(emp, ai);
  document.getElementById("bEmp").style.width = (emp / top * 100) + "%";
  document.getElementById("bAi").style.width = Math.max(3, ai / top * 100) + "%";
  document.getElementById("cCap").textContent = money(emp) + " " + fill(C.cap).replace(/\{p\}/g, money(ai));
}
r1.addEventListener("input", updateCalc); r2.addEventListener("input", updateCalc);

/* reveal on scroll */
let io = null;
function observeReveal(){
  const els = document.querySelectorAll(".reveal:not(.in)");
  if(!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); return; }
  io = io || new IntersectionObserver(es => es.forEach(x => { if(x.isIntersecting){ x.target.classList.add("in"); io.unobserve(x.target); } }), {rootMargin:"0px 0px -8% 0px"});
  els.forEach(e => io.observe(e));
}

/* ---------------------------------------------------------------- orb → virtual agent */
// Partículas (WebGL). Estado 1: orbe de luz iridiscente que respira. Estado 2: busto de luz
// (cabeza y hombros modelados con funciones de distancia), iluminado por el contorno, con
// una luz detrás. Pasa de uno a otro al bajar por la página o cuando el agente habla.
const ORB = (() => {
  const box = document.getElementById("orbBox");
  const cv = document.getElementById("orb"), hud = document.getElementById("hud"), hx = hud.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const N = innerWidth < 700 ? 6000 : 10000;
  let seed = 11; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // ---- busto: funciones de distancia
  const len3 = (x, y, z) => Math.sqrt(x * x + y * y + z * z);
  const ell = (x, y, z, cx, cy, cz, rx, ry, rz) => { const px = (x - cx) / rx, py = (y - cy) / ry, pz = (z - cz) / rz;
    const k0 = len3(px, py, pz), k1 = len3(px / rx, py / ry, pz / rz); return k1 ? k0 * (k0 - 1) / k1 : -1; };
  const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; };
  const smax = (a, b, k) => -smin(-a, -b, k);
  function sdf(x, y, z) {
    let d = ell(x, y, z, 0, 0.36, 0, 0.35, 0.46, 0.41);                       // cráneo
    d = smin(d, ell(x, y, z, 0, 0.13, 0.08, 0.26, 0.25, 0.29), 0.12);          // mandíbula
    d = smin(d, ell(x, y, z, 0, 0.0, 0.17, 0.11, 0.07, 0.11), 0.08);           // mentón
    d = smin(d, ell(x, y, z, 0, 0.29, 0.37, 0.05, 0.11, 0.08), 0.05);          // nariz
    d = smin(d, ell(x, y, z, 0, 0.44, 0.3, 0.25, 0.06, 0.1), 0.06);            // frente / cejas
    d = smin(d, ell(x, y, z, 0.19, 0.27, 0.25, 0.1, 0.08, 0.1), 0.08);         // pómulos
    d = smin(d, ell(x, y, z, -0.19, 0.27, 0.25, 0.1, 0.08, 0.1), 0.08);
    d = smin(d, ell(x, y, z, 0, 0.13, 0.33, 0.09, 0.03, 0.05), 0.03);          // labios
    d = smin(d, ell(x, y, z, 0.355, 0.31, -0.01, 0.035, 0.09, 0.065), 0.03);  // orejas
    d = smin(d, ell(x, y, z, -0.355, 0.31, -0.01, 0.035, 0.09, 0.065), 0.03);
    d = smax(d, -ell(x, y, z, 0.13, 0.36, 0.37, 0.07, 0.045, 0.06), 0.035);   // cuencas de los ojos
    d = smax(d, -ell(x, y, z, -0.13, 0.36, 0.37, 0.07, 0.045, 0.06), 0.035);
    const qx = Math.hypot(x, z + 0.03) - 0.145, qy = Math.abs(y + 0.1) - 0.22;     // cuello
    const neck = Math.min(Math.max(qx, qy), 0) + Math.hypot(Math.max(qx, 0), Math.max(qy, 0));
    d = smin(d, neck, 0.1);
    d = smin(d, ell(x, y, z, 0, -0.56, -0.03, 0.78, 0.3, 0.3), 0.18);          // hombros
    return Math.max(d, -(y + 0.78));                                          // corte del busto
  }
  const grad = (x, y, z) => { const e = 0.002;
    const g = [sdf(x + e, y, z) - sdf(x - e, y, z), sdf(x, y + e, z) - sdf(x, y - e, z), sdf(x, y, z + e) - sdf(x, y, z - e)];
    const l = len3(g[0], g[1], g[2]) || 1; return [g[0] / l, g[1] / l, g[2] / l]; };

  const S = new Float32Array(N * 3), F = new Float32Array(N * 3), FN = new Float32Array(N * 3), RAND = new Float32Array(N);
  for (let i = 0; i < N; i++) {                                   // esfera (Fibonacci)
    const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963;
    S.set([Math.cos(th) * r * 0.66, y * 0.66, Math.sin(th) * r * 0.66], i * 3);

attribute vec3 aS; attribute vec3 aF; attribute vec3 aFN; attribute float aRand;
uniform float uT, uM, uLevel, uYaw, uPitch, uDpr, uSize, uAspect, uScan;
varying float vA; varying vec3 vC;

mat2 rot(float a){ return mat2(cos(a), -sin(a), sin(a), cos(a)); }
void main(){

  vec3 sn = normalize(aS);
  vec3 s = aS * (1.0 + 0.07*nz(aS*3.0) + uLevel*0.16*nz(aS*6.0 + uT));
  vec3 f = aF + aFN * (uLevel*0.025*sin(aRand*60.0 + uT*18.0)) + vec3(0.0, sin(uT*1.1)*0.006, 0.0);
  vec3 p = mix(s, f, mp), n = normalize(mix(sn, aFN, mp));
  float sw = sin(mp*3.14159) * (aRand - 0.5) * 2.2;
  p.xz = rot(sw) * p.xz; n.xz = rot(sw) * n.xz;
  float yaw = uYaw + (1.0 - mp) * uT * 0.25;
  p.xz = rot(yaw) * p.xz; n.xz = rot(yaw) * n.xz;
  p.yz = rot(uPitch) * p.yz; n.yz = rot(uPitch) * n.yz;
  float persp = 3.2 / (3.2 - p.z);
  float sc = mix(0.95, 0.84, mp);
  gl_Position = vec4(p.x*persp*sc/uAspect, (p.y + 0.06*mp)*persp*sc, 0.0, 1.0);
  float fres = pow(1.0 - abs(n.z), 2.2);
  float key = max(dot(n, normalize(vec3(-0.45, 0.55, 0.7))), 0.0);
  float back = step(0.0, n.z);
  float scan = exp(-pow((p.y - uScan) * 10.0, 2.0)) * mp;
  vec3 c1 = vec3(0.30, 0.82, 1.0), c2 = vec3(0.62, 0.48, 1.0), c3 = vec3(0.95, 0.55, 0.95);
  float hue = 0.5 + 0.5*sin(n.y*2.6 + n.x*1.7 + uT*0.6);
  vC = mix(mix(c1, c2, hue), c3, (1.0 - mp) * 0.25 * (0.5 + 0.5*sin(uT + aRand*6.28)));
  vC = mix(vC, vec3(0.9, 0.97, 1.0), scan*0.8 + key*0.25*mp);
  float base = mix(0.62, 0.16, mp);
  vA = (base + fres*0.9 + key*0.55*mp + scan*0.6 + uLevel*0.25) * mix(mix(0.6, 0.28, mp), 1.0, back);
  gl_PointSize = (1.6 + (1.0 - mp)*0.9 + fres*2.2 + key*0.9*mp + scan*1.5 + uLevel*1.0) * uDpr * uSize;
}`;
    const fs = `precision mediump float; varying float vA; varying vec3 vC;
void main(){ float r = length(gl_PointCoord - 0.5); if (r > 0.5) discard; float a = smoothstep(0.5, 0.05, r); gl_FragColor = vec4(vC * a, a * vA); }`;
    const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : (console.warn(gl.getShaderInfoLog(s)), null); };
    const v = sh(gl.VERTEX_SHADER, vs), f = sh(gl.FRAGMENT_SHADER, fs);
    if (v && f) { prog = gl.createProgram(); gl.attachShader(prog, v); gl.attachShader(prog, f); gl.linkProgram(prog); if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) prog = null; }
    if (prog) {
      gl.useProgram(prog);
      const buf = (name, data, size) => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(prog, name); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0); };
      buf("aS", S, 3); buf("aF", F, 3); buf("aFN", FN, 3); buf("aRand", RAND, 1);
      ["uT","uM","uLevel","uYaw","uPitch","uDpr","uSize","uAspect","uScan"].forEach(n => U[n] = gl.getUniformLocation(prog, n));
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    }
  }
  if (!prog) box.classList.add("no-gl");

  let W = 0, H = 0, dpr = 1, level = 0, target = 0, speaking = false, forceAgent = false, morph = 0, scrollM = 0;
  let yaw = 0, pitch = 0, mx = 0, my = 0, visible = true, raf = 0;
  const t0 = performance.now(), hero = document.querySelector(".hero"), sticky = () => matchMedia("(min-width: 861px)").matches;
  function size() { dpr = Math.min(2, devicePixelRatio || 1); const r = box.getBoundingClientRect();
    W = Math.round(r.width * dpr); H = Math.round(r.height * dpr); cv.width = hud.width = W; cv.height = hud.height = H; if (gl) gl.viewport(0, 0, W, H); }
  function onScroll() {
    const vh = innerHeight;
    if (sticky()) { const r = hero.getBoundingClientRect(); scrollM = Math.min(1, Math.max(0, -r.top / Math.max(1, (r.height - vh) * 0.8))); }
    else { const r = box.getBoundingClientRect(), c = r.top + r.height / 2; scrollM = Math.min(1, Math.max(0, (vh * 0.9 - c) / (vh * 0.45))); }
  }
  addEventListener("scroll", onScroll, { passive: true });
  box.addEventListener("pointermove", e => { const r = box.getBoundingClientRect(); mx = ((e.clientX - r.left) / r.width - 0.5) * 2; my = ((e.clientY - r.top) / r.height - 0.5) * 2; });
  box.addEventListener("pointerleave", () => { mx = my = 0; });

  function drawHud(t, L, M) {
    const cx = W / 2, cy = H / 2, R0 = Math.min(W, H) * 0.47;
    hx.clearRect(0, 0, W, H); hx.lineCap = "round";
    const arc = (r, a0, len, w, col, sp) => { hx.strokeStyle = col; hx.lineWidth = w * dpr; hx.beginPath(); hx.arc(cx, cy, r, a0 + t * sp, a0 + t * sp + len); hx.stroke(); };
    const a = 0.25 + M * 0.35;
    arc(R0, 0, 1.1, 1.4, `rgba(110,210,255,${a})`, 0.18); arc(R0, 3.4, 0.6, 1.4, `rgba(160,130,255,${a})`, 0.18);
    arc(R0 * 0.95, 1.6, 2.4, 0.8, `rgba(120,200,255,${a * 0.5})`, -0.1);
    if (L > 0.02) {
      for (let i = 0; i < 120; i++) { const an = i / 120 * Math.PI * 2, n = Math.abs(Math.sin(i * 1.3 + t * 7) * Math.sin(i * 0.27 + t * 2.6)), h = R0 * (0.015 + L * 0.08 * n), r1 = R0 * 0.9;
        hx.strokeStyle = `rgba(${130 + 90 * n},${200 + 40 * n},255,${0.2 + L * 0.6})`; hx.lineWidth = 2 * dpr;
        hx.beginPath(); hx.moveTo(cx + Math.cos(an) * r1, cy + Math.sin(an) * r1); hx.lineTo(cx + Math.cos(an) * (r1 - h), cy + Math.sin(an) * (r1 - h)); hx.stroke(); }
    }
  }
  function frame(now) {
    const t = (now - t0) / 1000;
    level += (target - level) * 0.2; target *= speaking ? 0.9 : 0.85;
    const L = Math.min(1, level);
    morph += ((forceAgent ? 1 : (reduce ? Math.round(scrollM) : scrollM)) - morph) * (reduce ? 1 : 0.06);
    yaw += ((mx * 0.5 + Math.sin(t * 0.45) * 0.1 * morph) - yaw) * 0.05;
    pitch += ((my * 0.22 - 0.04 * morph) - pitch) * 0.05;
    const scan = ((t * 0.45) % 1.8) - 0.85;
    if (prog) {
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(U.uT, t); gl.uniform1f(U.uM, morph); gl.uniform1f(U.uLevel, L); gl.uniform1f(U.uYaw, yaw); gl.uniform1f(U.uPitch, pitch);
      gl.uniform1f(U.uDpr, dpr); gl.uniform1f(U.uSize, W / dpr < 360 ? 0.85 : 1); gl.uniform1f(U.uAspect, W / H); gl.uniform1f(U.uScan, scan);
      gl.drawArrays(gl.POINTS, 0, N);
    }
    drawHud(t, L, morph);
    box.style.setProperty("--glow", (0.3 + L * 0.7).toFixed(3));
    box.style.setProperty("--m", morph.toFixed(3));
    document.documentElement.style.setProperty("--hm", scrollM.toFixed(3));
    if (visible && !document.hidden) raf = requestAnimationFrame(frame); else raf = 0;
  }
  function start() { if (!raf) raf = requestAnimationFrame(frame); }
  size(); onScroll(); addEventListener("resize", () => { size(); onScroll(); });
  if ("IntersectionObserver" in window) new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible) start(); }).observe(box);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) start(); });
  start();
  return { bump(v) { target = Math.max(target, v); }, speak(on) { speaking = on; if (on) target = Math.max(target, .5); }, face(on) { forceAgent = on; } };
})();

/* ---------------------------------------------------------------- demo call */
const cap = document.getElementById("cap"), sms = document.getElementById("sms");
let playing = false, timers = [], runId = 0;
function setListenLabel(){ document.getElementById("listenBtn").textContent = fill(t(playing ? "stop" : "listen")); }
function resetCap(){ cap.innerHTML = `<div class="hint">${esc(t("demo.hint"))}</div>`; sms.style.display = "none"; }
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
function stopDemo(){
  runId++; playing = false; timers.forEach(clearTimeout); timers = [];
  try{ speechSynthesis.cancel(); }catch(e){}
  ORB.speak(false); ORB.face(false); setListenLabel();
}
function voicesFor(code){
  let vs = []; try{ vs = speechSynthesis.getVoices(); }catch(e){}
  const base = code.slice(0,2);
  const exact = vs.filter(v => v.lang && v.lang.replace("_","-").toLowerCase() === code.toLowerCase());
  const same = vs.filter(v => v.lang && v.lang.toLowerCase().startsWith(base));
  const list = exact.concat(same.filter(v => !exact.includes(v)));
  return list;
}
function showLine(who, text){
  const words = text.split(/\s+/);
  cap.innerHTML = `<div class="who${who==="c"?" c":""}">${esc(who==="a" ? A : t("demo.who.c"))}</div><div class="txt">${words.map(w=>`<span>${esc(w)}</span>`).join(" ")}</div>`;
  return [...cap.querySelectorAll(".txt span")];
}
function playDemo(){
  stopDemo(); playing = true; setListenLabel(); sms.style.display = "none"; ORB.face(true);
  const my = ++runId, demo = STR[lang].demo;
  const lines = demo.lines.map(([w, s]) => [w, fill(s)]);
  const canSpeak = "speechSynthesis" in window && voicesFor(demo.lang).length > 0;
  const vs = canSpeak ? voicesFor(demo.lang) : [];
  const vA = vs[0], vC = vs.find(v => v !== vA) || vA;
  let i = 0;
  const next = () => {
    if(my !== runId) return;
    if(i >= lines.length){ // fin: texto al dueño
      ORB.speak(false); playing = false; setListenLabel(); later(() => { if(my===runId) ORB.face(false); }, 2500);
      document.getElementById("smsTxt").textContent = demo.sms; sms.style.display = "block";
      later(() => { if(my===runId) cap.insertAdjacentHTML("beforeend", `<div class="hint" style="margin-top:6px">${esc(t("demo.end"))}</div>`); }, 600);
      return;
    }
    const [who, text] = lines[i++], spans = showLine(who, text);
    let w = 0; const lit = () => { if(spans[w]) spans[w++].classList.add("on"); };
    ORB.speak(who === "a");
    const done = () => { if(my !== runId) return; spans.forEach(s=>s.classList.add("on")); ORB.speak(false); later(next, 450); };
    if(canSpeak){
      const u = new SpeechSynthesisUtterance(text);
      u.voice = who === "a" ? vA : vC; u.lang = u.voice ? u.voice.lang : demo.lang;
      u.rate = 1.02; u.pitch = who === "a" ? 1.0 : 0.85;
      let ended = false, gotBoundary = false;
      u.onboundary = e => { if(e.name && e.name !== "word") return; gotBoundary = true; lit(); if(who==="a") ORB.bump(0.55 + Math.random()*0.45); };
      u.onend = u.onerror = () => { if(ended) return; ended = true; done(); };
      // sin eventos de palabra (algunos navegadores): se simulan
      const tick = () => { if(ended || my!==runId) return; if(!gotBoundary){ lit(); if(who==="a") ORB.bump(0.5 + Math.random()*0.5); } later(tick, 300); };
      later(tick, 350);
      later(() => { if(!ended){ ended = true; try{ speechSynthesis.cancel(); }catch(e){} done(); } }, 2500 + spans.length * 520); // seguro
      speechSynthesis.speak(u);
    } else {
      const step = () => { if(my!==runId) return; if(w < spans.length){ lit(); if(who==="a") ORB.bump(0.5 + Math.random()*0.5); later(step, 280); } else done(); };
      step();
    }
  };
  next();
}
document.getElementById("listenBtn").addEventListener("click", () => playing ? stopDemo() : playDemo());
const orbBox = document.getElementById("orbBox");
orbBox.addEventListener("click", () => playing ? stopDemo() : playDemo());
orbBox.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); playing ? stopDemo() : playDemo(); } });
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }catch(e){}
addEventListener("pagehide", stopDemo);

render(); resetCap();
</script>
