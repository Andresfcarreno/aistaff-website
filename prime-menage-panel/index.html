<title>Maison Prime · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4efe3; --surface: #fffdf8; --surface-2: #f3ecdc; --surface-3: #ebe2cc;
  --ink: #13203a; --ink-2: #4b566d; --ink-3: #7b8497;
  --line: rgba(19, 32, 58, .11); --line-2: rgba(19, 32, 58, .2);
  --gold: #8a6a1c; --gold-fill: #c9a227; --gold-soft: rgba(201, 162, 39, .14);
  --gold-grad: linear-gradient(135deg, #f4e2ad 0%, #e5c46a 28%, #c9a227 55%, #f2dc9b 78%, #b48a22 100%);
  --nav: #0a1730; --nav-2: #10224a; --nav-ink: #e9edf5; --nav-ink-2: #97a3bb; --nav-line: rgba(229, 196, 106, .16);
  --good: #1d7f52; --good-soft: rgba(29, 127, 82, .12);
  --warn: #9a6512; --warn-soft: rgba(212, 150, 40, .16);
  --bad: #b33b30; --bad-soft: rgba(179, 59, 48, .11);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --shadow: 0 1px 2px rgba(19, 32, 58, .05), 0 10px 30px -18px rgba(19, 32, 58, .35);
  --r: 18px;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Cinzel", Georgia, serif;
  --num: "Cinzel", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07101f; --surface: #0e1c37; --surface-2: #132647; --surface-3: #1a3159;
    --ink: #eef1f7; --ink-2: #a9b4c9; --ink-3: #7a869e;
    --line: rgba(229, 196, 106, .12); --line-2: rgba(229, 196, 106, .24);
    --gold: #e5c46a; --gold-fill: #d4ae3f; --gold-soft: rgba(229, 196, 106, .14);
    --nav: #050c19; --nav-2: #0b1832;
    --good: #45c28a; --good-soft: rgba(69, 194, 138, .14);
    --warn: #e9b458; --warn-soft: rgba(233, 180, 88, .15);
    --bad: #f0806f; --bad-soft: rgba(240, 128, 111, .14);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 34px -18px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07101f; --surface: #0e1c37; --surface-2: #132647; --surface-3: #1a3159;
  --ink: #eef1f7; --ink-2: #a9b4c9; --ink-3: #7a869e;
  --line: rgba(229, 196, 106, .12); --line-2: rgba(229, 196, 106, .24);
  --gold: #e5c46a; --gold-fill: #d4ae3f; --gold-soft: rgba(229, 196, 106, .14);
  --nav: #050c19; --nav-2: #0b1832;
  --good: #45c28a; --good-soft: rgba(69, 194, 138, .14);
  --warn: #e9b458; --warn-soft: rgba(233, 180, 88, .15);
  --bad: #f0806f; --bad-soft: rgba(240, 128, 111, .14);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 34px -18px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--sans); font-variant-numeric: lining-nums; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--gold-fill); outline-offset: 2px; }

/* ---------- Shell ---------- */
.scrim { display: none; }
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; height: 100dvh; overflow-y: auto;
  background: radial-gradient(120% 60% at 0% 0%, #16306a 0%, transparent 60%), var(--nav);
  color: var(--nav-ink); display: flex; flex-direction: column; padding: 22px 16px 18px; gap: 22px;
  border-right: 1px solid var(--nav-line);
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 6px; }
.brand img { width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(229, 196, 106, .5), 0 8px 20px rgba(0, 0, 0, .45); }
.brand b { display: block; font: 600 13.5px/1 var(--display); letter-spacing: .14em; white-space: nowrap; }
.brand b span { color: #e5c46a; }
.brand small { display: block; margin-top: 6px; font-size: 9px; letter-spacing: .22em; white-space: nowrap; color: var(--nav-ink-2); font-weight: 700; }
.nav { display: grid; gap: 3px; }
.nav-label { font-size: 10px; font-weight: 800; letter-spacing: .24em; color: var(--nav-ink-2); padding: 14px 12px 6px; text-transform: uppercase; }
.nav button {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 12px;
  background: transparent; color: var(--nav-ink-2); cursor: pointer; font-weight: 600; font-size: 14px; text-align: left; transition: background .2s, color .2s;
}
.nav button:hover { background: rgba(255, 255, 255, .05); color: var(--nav-ink); }
.nav button.on { background: linear-gradient(90deg, rgba(229, 196, 106, .18), rgba(229, 196, 106, .04)); color: #f4e2ad; box-shadow: inset 0 0 0 1px rgba(229, 196, 106, .22); }
.nav button.on svg { color: #e5c46a; }
.nav .badge { margin-left: auto; min-width: 22px; height: 20px; padding: 0 7px; border-radius: 99px; background: #e5c46a; color: #0a1730; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.nav .badge.alert { background: #f0806f; color: #fff; }
.side-foot { margin-top: auto; display: grid; gap: 10px; }
.side-card { border: 1px solid var(--nav-line); border-radius: 14px; padding: 12px 14px; background: rgba(255, 255, 255, .03); font-size: 12.5px; color: var(--nav-ink-2); }
.side-card b { color: var(--nav-ink); font-weight: 700; }
.sync { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--nav-ink-2); flex: none; }
.dot.live { background: #45c28a; box-shadow: 0 0 0 0 rgba(69, 194, 138, .6); animation: live 2.4s infinite; }
@keyframes live { 70% { box-shadow: 0 0 0 7px rgba(69, 194, 138, 0); } 100% { box-shadow: 0 0 0 0 rgba(69, 194, 138, 0); } }
.side-card a { color: #e5c46a; text-decoration: none; font-weight: 700; }

.main { min-width: 0; padding: 0 clamp(16px, 3vw, 36px) 60px; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px;
  padding: 18px 0 16px; background: linear-gradient(var(--bg) 78%, transparent);
}
.top h1 { font: 600 clamp(28px, 3.2vw, 38px)/1.05 var(--serif); letter-spacing: -.01em; }
.top .sub { color: var(--ink-3); font-size: 13px; margin-top: 4px; }
.top .spacer { flex: 1; }
.btn.menu-btn { display: none; }

/* ---------- Buttons & chips ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 13.5px; cursor: pointer; white-space: nowrap;
  transition: transform .15s, box-shadow .2s, background .2s; text-decoration: none;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.gold { background: var(--gold-grad); border-color: transparent; color: #0a1730; }
.btn.dark { background: var(--nav); color: #f4e2ad; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
.btn.icon { width: 40px; padding: 0; }
.btn.sm.icon { width: 32px; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 11.5px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); }
.chip svg.i { width: 13px; height: 13px; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.gold { background: var(--gold-soft); color: var(--gold); }
.chip.ex { background: transparent; border: 1px dashed var(--line-2); color: var(--ink-3); font-weight: 700; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.fbtn { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-weight: 700; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.fbtn.on { background: var(--nav); color: #f4e2ad; border-color: var(--nav); }
.fbtn .n { font-size: 11px; opacity: .75; }

/* ---------- Cards & grid ---------- */
.grid { display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-h h2 { font: 600 22px/1.1 var(--serif); }
.card-h .spacer { flex: 1; }
.card-h .muted { font-size: 12.5px; }
.muted { color: var(--ink-3); }
.eyebrow { font-size: 10.5px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.empty { padding: 26px 10px; text-align: center; color: var(--ink-3); font-size: 13.5px; }
.empty b { display: block; font: 600 20px var(--serif); color: var(--ink-2); margin-bottom: 4px; }

.hero {
  position: relative; overflow: hidden; border-radius: 24px; padding: 26px 28px; color: #eef1f7;
  background: radial-gradient(90% 140% at 100% 0%, rgba(229, 196, 106, .28), transparent 55%), radial-gradient(70% 120% at 0% 100%, #1d3b7a, transparent 60%), #0a1730;
  box-shadow: var(--shadow); display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: center;
}
.hero::after { content: ""; position: absolute; right: -80px; top: -80px; width: 280px; height: 280px; border-radius: 50%; border: 1px solid rgba(229, 196, 106, .25); }
.hero h2 { font: 500 clamp(28px, 3.4vw, 42px)/1.05 var(--serif); }
.hero h2 em { font-style: italic; color: #e5c46a; }
.hero p { margin: 10px 0 0; color: #a9b4c9; max-width: 52ch; }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; position: relative; z-index: 1; }
.hs { background: rgba(255, 255, 255, .05); border: 1px solid rgba(229, 196, 106, .2); border-radius: 16px; padding: 14px; }
.hs b { display: block; font: 600 30px/1 var(--serif); color: #f4e2ad; }
.hs span { font-size: 11.5px; color: #a9b4c9; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); display: grid; gap: 4px; cursor: default; }
.kpi[data-go] { cursor: pointer; }
.kpi[data-go]:hover { border-color: var(--line-2); }
.kpi .l { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--ink-3); }
.kpi .l svg { color: var(--gold); }
.kpi .v { font: 600 32px/1.05 var(--serif); letter-spacing: -.01em; }
.kpi .d { font-size: 12px; color: var(--ink-3); }
.kpi .d.good { color: var(--good); } .kpi .d.warn { color: var(--warn); } .kpi .d.bad { color: var(--bad); }

.cols-2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; }
.cols-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1180px) { .cols-2 { grid-template-columns: 1fr; } .hero { grid-template-columns: 1fr; } }
@media (max-width: 900px) { .cols-3 { grid-template-columns: 1fr; } }

/* channels */
.channels { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .channels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.chan { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface-2); cursor: pointer; text-align: left; }
.chan:hover { border-color: var(--line-2); }
.chan .t { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.chan .t svg { width: 15px; height: 15px; color: var(--gold); }
.chan .v { font: 600 26px/1.1 var(--serif); margin: 6px 0 4px; }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 26px; }
.spark i { flex: 1; min-height: 2px; background: var(--gold-fill); border-radius: 3px 3px 0 0; opacity: .85; }
.spark i.z { background: var(--line-2); }

/* lists */
.rows { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t1 { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t2 { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.click { cursor: pointer; border-radius: 10px; }
.row.click:hover { background: var(--surface-2); }
.time { font: 600 20px/1 var(--serif); width: 56px; flex: none; }
.ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-2); color: var(--gold); flex: none; }
.ic svg { width: 17px; height: 17px; }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 12.5px; flex: none; }
.avs { display: flex; }
.avs .av { width: 26px; height: 26px; font-size: 10.5px; margin-left: -6px; box-shadow: 0 0 0 2px var(--surface); }
.avs .av:first-child { margin-left: 0; }
.money { font: 600 19px/1 var(--serif); white-space: nowrap; }

.feed .row { align-items: flex-start; }
.feed .when { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

.meter { height: 10px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--gold-grad); }
.meter.warn i { background: var(--warn); } .meter.bad i { background: var(--bad); } .meter.good i { background: var(--good); }

.tasks .row { gap: 10px; }
.check { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--line-2); background: transparent; cursor: pointer; display: grid; place-items: center; color: transparent; flex: none; }
.check.on { background: var(--gold-fill); border-color: var(--gold-fill); color: #0a1730; }
.check svg { width: 14px; height: 14px; }
.done .t1 { text-decoration: line-through; color: var(--ink-3); }
.addline { display: flex; gap: 8px; margin-top: 10px; }
.input, .field input, .field select, .field textarea {
  width: 100%; height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink);
}
.field textarea { height: auto; min-height: 90px; padding: 10px 12px; resize: vertical; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--gold-fill); box-shadow: 0 0 0 3px var(--gold-soft); }

/* chart */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid-l { stroke: var(--line); }
.chart .axis-t { fill: var(--ink-3); font-size: 11px; font-family: var(--sans); }
.chart .bar { fill: var(--gold-fill); }
.chart .bar.now { fill: var(--nav); }
:root[data-theme="dark"] .chart .bar.now { fill: #f4e2ad; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chart .bar.now { fill: #f4e2ad; } }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + .bar, .chart .barg:hover .bar { opacity: .82; }
.chart .goal { stroke: var(--bad); stroke-dasharray: 5 5; stroke-width: 1.5; }
.chart .val { fill: var(--ink); font: 600 13px var(--serif); }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-3); margin-top: 8px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 10px; border-radius: 3px; background: var(--gold-fill); display: inline-block; }
.legend i.now { background: var(--nav); }
:root[data-theme="dark"] .legend i.now { background: #f4e2ad; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .legend i.now { background: #f4e2ad; } }
.legend i.goal { height: 0; border-top: 2px dashed var(--bad); border-radius: 0; }
.hbar { display: grid; grid-template-columns: 120px 1fr 70px; gap: 10px; align-items: center; font-size: 13px; padding: 6px 0; }
.hbar .tr { height: 10px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.hbar .tr i { display: block; height: 100%; background: var(--gold-fill); border-radius: 99px; }
.hbar b { text-align: right; font: 600 16px var(--serif); }
#tip { position: fixed; z-index: 100; pointer-events: none; background: var(--nav); color: #eef1f7; padding: 8px 10px; border-radius: 10px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); opacity: 0; transition: opacity .12s; max-width: 240px; }
#tip b { color: #f4e2ad; }

/* ---------- Agenda ---------- */
.weekbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.weekbar h2 { font: 600 24px var(--serif); margin: 0 8px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; min-height: 260px; display: flex; flex-direction: column; box-shadow: var(--shadow); min-width: 0; }
.day.today { border-color: var(--gold-fill); box-shadow: 0 0 0 1px var(--gold-fill), var(--shadow); }
.day-h { display: flex; align-items: baseline; gap: 6px; padding: 12px 12px 8px; border-bottom: 1px solid var(--line); }
.day-h b { font: 600 24px/1 var(--serif); }
.day-h span { font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.day-h .add { margin-left: auto; width: 26px; height: 26px; border-radius: 8px; border: 1px dashed var(--line-2); background: transparent; cursor: pointer; color: var(--ink-3); display: grid; place-items: center; }
.day-h .add:hover { color: var(--gold); border-color: var(--gold-fill); }
.day-b { padding: 8px; display: grid; gap: 8px; align-content: start; }
.vcard { min-width: 0; overflow: hidden; border-radius: 12px; background: var(--surface-2); padding: 9px 10px; cursor: pointer; border: 1px solid transparent; display: grid; gap: 3px; font-size: 12.5px; }
.vcard:hover { border-color: var(--line-2); }
.vcard .h { display: flex; align-items: center; gap: 6px; }
.vcard .h b { font: 600 16px/1 var(--serif); }
.vcard .h .chip { margin-left: auto; height: 20px; font-size: 10.5px; padding: 0 7px; }
.vcard .c { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vcard .s { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vcard.hecha { opacity: .62; }
.vcard.cancelada { opacity: .45; text-decoration: line-through; }
.gcal { margin-top: 16px; }
.gev { display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; padding: 9px 4px; border-top: 1px solid var(--line); font-size: 13px; align-items: center; }
.gev:first-child { border-top: 0; }
.gev a { color: var(--gold); font-weight: 700; text-decoration: none; font-size: 12px; }
@media (max-width: 1100px) { .week { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } .day { min-height: 0; } }

/* ---------- Inbox ---------- */
.inbox { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.inbox .list { padding: 8px; max-height: calc(100vh - 230px); overflow: auto; }
.msg { display: flex; gap: 12px; padding: 12px; border-radius: 14px; cursor: pointer; border: 1px solid transparent; }
.msg:hover { background: var(--surface-2); }
.msg.on { background: var(--surface-2); border-color: var(--line-2); }
.msg .grow { flex: 1; min-width: 0; }
.msg .top1 { display: flex; gap: 8px; align-items: baseline; }
.msg .top1 b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg .top1 span { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

  <div class="main">

        <button class="btn gold" id="quick"><svg class="i"><use href="#i-plus"/></svg><span class="hide-m">Nuevo</span></button>

          <button data-new="visit"><svg class="i"><use href="#i-cal"/></svg>Visita</button>
          <button data-new="client"><svg class="i"><use href="#i-users"/></svg>Cliente o prospecto</button>
          <button data-new="inbox"><svg class="i"><use href="#i-chat"/></svg>Mensaje o llamada</button>
          <button data-new="invoice"><svg class="i"><use href="#i-receipt"/></svg>Factura</button>
          <button data-new="expense"><svg class="i"><use href="#i-coins"/></svg>Gasto</button>

</div>

<div class="modal" id="modal" hidden><div class="bg" data-close></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>
<script>
(() => {
'use strict';

/* ================= Constants ================= */
const COLS = ['clients', 'staff', 'visits', 'inbox', 'invoices', 'expenses', 'inventory', 'tasks', 'settings'];
const SERVICES = { signature: 'Entretien Signature', deep: 'Grand Ménage', premove: 'Pré-emménagement', postmove: 'Fin de bail', reno: 'Après-rénovation', commercial: 'Commercial', extreme: 'Remise en état', airbnb: 'Airbnb' };
const FREQ = { once: 'Única vez', weekly: 'Semanal', biweekly: 'Cada 2 semanas', monthly: 'Mensual' };
const FREQ_PER_MONTH = { once: 0, weekly: 4.33, biweekly: 2.17, monthly: 1 };
const STAGES = [['prospecto', 'Prospecto'], ['cotizado', 'Cotizado'], ['activo', 'Activo'], ['pausado', 'Pausado']];
const CH = { whatsapp: ['WhatsApp', 'wa'], llamada: ['Llamadas', 'phone'], correo: ['Correos', 'mail'], chat: ['Chat web', 'chat'], web: ['Formulario web', 'globe'], sms: ['SMS', 'sms'] };
const ZONES = ['Plateau-Mont-Royal', 'Mile End', 'Outremont', 'Rosemont', 'Villeray', 'Hochelaga', 'Ville-Marie', 'Vieux-Montréal', 'Griffintown', 'Westmount', 'NDG', 'Verdun', 'Otra zona'];
const EXP_CAT = { productos: 'Productos', coffret: 'Coffret Prime', uniformes: 'Uniformes', equipo: 'Equipo', transporte: 'Transporte', marketing: 'Marketing', seguros: 'Seguros y permisos', salarios: 'Salarios', otros: 'Otros' };
const INV_CAT = { producto: 'Productos de limpieza', coffret: 'Coffret Prime', equipo: 'Equipo y herramientas' };
const ACAD = [['antecedentes', 'Antecedentes verificados'], ['academie', 'Formación Académie Prime'], ['whmis', 'WHMIS / seguridad química'], ['uniforme', 'Uniforme entregado']];
const PALETTE = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];
const PRICING = { base: 85, bed: 35, bath: 25, house: 30, min: 140, bundle: 70, cab: 35, linen: 25,
  mult: { signature: 1, deep: 1, premove: 1.3, postmove: 1.5, reno: 2.1, airbnb: 1 },
  disc: { once: 0, monthly: 5, biweekly: 8, weekly: 12 } };
const TITLES = { home: 'Centro de mando', agenda: 'Agenda', inbox: 'Bandeja', clients: 'Clientes', team: 'Equipo', stock: 'Insumos', money: 'Finanzas', ai: 'Asistente Prime' };

/* ================= Helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cur = new Intl.NumberFormat('fr-CA', { style: 'currency', currency: 'CAD', maximumFractionDigits: 0 });
const money = (n) => cur.format(Math.round(Number(n) || 0));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const icon = (id, cls = 'i') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const iso = (d) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const parse = (s) => { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const weekStart = (off = 0) => { const d = today(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + off * 7); return d; };
const DOW = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
const MON = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fmtDate = (s) => { const d = parse(s); return d ? `${d.getDate()} ${MON[d.getMonth()]}` : '—'; };
const fmtDay = (s) => { const d = parse(s); return d ? `${DOW[(d.getDay() + 6) % 7]} ${d.getDate()} ${MON[d.getMonth()]}` : '—'; };
const ago = (isoStr) => {
  if (!isoStr) return '';
  const t = new Date(isoStr).getTime(); const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'ahora'; if (m < 60) return `hace ${m} min`; const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24); return d < 7 ? `hace ${d} d` : fmtDate(isoStr);
};
const initials = (n) => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const monthKey = (s) => String(s || '').slice(0, 7);
const localDT = (s) => { const d = s ? new Date(s) : new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };

/* ================= State ================= */
const S = { view: 'home', week: 0, inboxFilter: 'all', inboxSel: null, clientQ: '', stockTab: 'producto', mode: 'loading', dbError: null, chat: [], chatBusy: false, cal: { state: 'idle' } };
COLS.forEach((c) => { S[c] = {}; });
let db = null, sample = null, mcp = null, downloads = null, calUnsub = null, chatCtl = null;
const all = (c) => Object.values(S[c]);
const settings = () => S.settings.main || {};
try { const v = localStorage.getItem('pm-panel-view'); if (v && TITLES[v]) S.view = v; } catch (e) { /* ignore */ }

/* ================= Data layer ================= */
const LOCAL_KEY = 'pm-panel-local';
function loadLocal() {
  try { const raw = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'); COLS.forEach((c) => { S[c] = raw[c] || {}; }); } catch (e) { /* ignore */ }
}
function saveLocal() {
  try { const o = {}; COLS.forEach((c) => { o[c] = S[c]; }); localStorage.setItem(LOCAL_KEY, JSON.stringify(o)); } catch (e) { /* ignore */ }
}
function clean(obj) { const o = { ...obj }; delete o.id; Object.keys(o).forEach((k) => { if (o[k] === undefined) delete o[k]; }); return o; }
async function put(col, id, obj) {
  const body = clean(obj);
  S[col][id] = { id, ...body }; schedule();
  if (db) {
    try { await db.collection(col).doc(id).set(body); }
    catch (e) { toast(e && e.code === 'quota_exceeded' ? 'La base de datos está llena: borra registros viejos.' : 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.'); }
  } else saveLocal();
}
async function remove(col, id) {
  delete S[col][id]; schedule();
  if (db) { try { await db.collection(col).doc(id).delete(); } catch (e) { toast('No se pudo borrar. Inténtalo de nuevo.'); } }
  else saveLocal();
}
function subscribe() {
  COLS.forEach((col) => {
    db.collection(col).onSnapshot((snap) => {
      const next = {}; snap.docs.forEach((d) => { next[d.id] = { id: d.id, ...d.data() }; });
      S[col] = next; schedule();
    }, (e) => { S.dbError = e && e.code; schedule(); });
  });
}

/* ================= Domain logic ================= */
function quote({ service, type, beds, baths, freq }) {
  const m = PRICING.mult[service];
  if (m == null) return 0;
  let p = (PRICING.base + (+beds || 0) * PRICING.bed + (+baths || 1) * PRICING.bath + (type === 'house' ? PRICING.house : 0)) * m;
  if (['deep', 'premove', 'postmove', 'reno'].includes(service)) p += PRICING.bundle;
  if (['premove', 'postmove', 'reno'].includes(service)) p += PRICING.cab;
  if (service === 'airbnb') p += PRICING.linen;
  const f = ['premove', 'postmove', 'reno'].includes(service) ? 'once' : (freq || 'once');
  return Math.max(PRICING.min, Math.round(p - (PRICING.disc[f] || 0)));
}
const clientName = (id) => (S.clients[id] && S.clients[id].name) || 'Cliente';
const staffColor = (id) => { const ids = all('staff').map((s) => s.id).sort(); const i = ids.indexOf(id); return PALETTE[(i < 0 ? 0 : i) % PALETTE.length]; };
function invStatus(inv) {
  if (inv.status === 'enviada' && inv.due && parse(inv.due) < today()) return 'vencida';
  return inv.status || 'borrador';
}
const INV_CHIP = { borrador: ['', 'Borrador'], enviada: ['gold', 'Enviada'], pagada: ['good', 'Pagada'], vencida: ['bad', 'Vencida'], anulada: ['', 'Anulada'] };
const VIS_CHIP = { programada: ['gold', 'Programada'], encurso: ['warn', 'En curso'], hecha: ['good', 'Hecha'], cancelada: ['', 'Cancelada'] };
const STAT_CHIP = { prospecto: ['gold', 'Prospecto'], cotizado: ['warn', 'Cotizado'], activo: ['good', 'Activo'], pausado: ['', 'Pausado'], perdido: ['bad', 'Perdido'] };
const chip = (map, k) => { const [c, l] = map[k] || ['', k || '—']; return `<span class="chip ${c}">${esc(l)}</span>`; };
const exChip = (o) => (o && o.ejemplo ? '<span class="chip ex" title="Dato de ejemplo: edítalo o bórralo">ejemplo</span>' : '');

function metrics() {
  const t = today(); const mk = iso(t).slice(0, 7);
  const invs = all('invoices');
  const paidMonth = invs.filter((i) => i.status === 'pagada' && monthKey(i.paidDate || i.date) === mk).reduce((a, i) => a + (+i.total || 0), 0);
  const owed = invs.filter((i) => ['enviada', 'vencida'].includes(invStatus(i)));
  const overdue = owed.filter((i) => invStatus(i) === 'vencida');
  const ws = weekStart(0), we = addDays(ws, 7);
  const weekVisits = all('visits').filter((v) => { const d = parse(v.date); return d && d >= ws && d < we && v.status !== 'cancelada'; });
  const active = all('clients').filter((c) => c.status === 'activo');
  const mrr = active.reduce((a, c) => a + (+c.price || 0) * (FREQ_PER_MONTH[c.freq] || 0), 0);
  const unread = all('inbox').filter((m) => m.status === 'nuevo');
  const low = all('inventory').filter((i) => i.category !== 'equipo' && (+i.qty || 0) <= (+i.min || 0));
  const yearAgo = addDays(t, -365);
  const rolling = invs.filter((i) => !['borrador', 'anulada'].includes(i.status) && parse(i.date) >= yearAgo).reduce((a, i) => a + (+i.total || 0), 0);
  const expMonth = all('expenses').filter((e) => monthKey(e.date) === mk).reduce((a, e) => a + (+e.amount || 0), 0);
  let labor = 0;
  all('visits').filter((v) => v.status === 'hecha' && monthKey(v.date) === mk).forEach((v) => {
    (v.staffIds || []).forEach((sid) => { const s = S.staff[sid]; if (s && s.rate) labor += (+v.duration || 0) * s.rate; });
  });
  return { paidMonth, owed, owedSum: owed.reduce((a, i) => a + (+i.total || 0), 0), overdue, weekVisits, active, mrr, unread, low, rolling, expMonth, labor };
}
function revenueByMonth(n = 6) {
  const out = []; const t = today();
  for (let k = n - 1; k >= 0; k--) {
    const d = new Date(t.getFullYear(), t.getMonth() - k, 1); const key = iso(d).slice(0, 7);
    const v = all('invoices').filter((i) => i.status === 'pagada' && monthKey(i.paidDate || i.date) === key).reduce((a, i) => a + (+i.total || 0), 0);
    out.push({ key, label: MON[d.getMonth()], v, now: k === 0 });
  }
  return out;
}
function nextInvoiceNumber() {
  const y = today().getFullYear(); let max = 0;
  all('invoices').forEach((i) => { const m = /PM-(\d{4})-(\d+)/.exec(i.number || ''); if (m && +m[1] === y) max = Math.max(max, +m[2]); });
  return `PM-${y}-${String(max + 1).padStart(3, '0')}`;
}
function nextVisitFor(cid) {
  const t = iso(today());
  return all('visits').filter((v) => v.clientId === cid && v.date >= t && v.status !== 'cancelada').sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))[0];
}

/* ================= Render loop ================= */
let pending = false;
function schedule() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; render(); }); }
function render() {
  const a = document.activeElement; const keep = a && a.id && $('#view').contains(a) ? { id: a.id, v: a.value, s: a.selectionStart, e: a.selectionEnd } : null;
  $$('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.view === S.view));
  $('#title').textContent = TITLES[S.view];
  const d = new Date();
  $('#subtitle').textContent = `${['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'][d.getDay()]} ${d.getDate()} de ${['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'][d.getMonth()]} · Montréal`;
  renderSync(); renderBadges();
  $('#banner').innerHTML = S.mode === 'local'
    ? `<div class="banner">${icon('alert')}<span>Modo local: los datos se guardan solo en este navegador. Ábrelo desde claude.ai para usar la base de datos compartida.</span></div>`
    : (S.dbError ? `<div class="banner">${icon('alert')}<span>Se perdió la conexión con la base de datos. Recarga la página.</span></div>` : '');
  if (S.mode === 'loading') return;
  const fn = VIEWS[S.view] || VIEWS.home;
  $('#view').innerHTML = fn();
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.value = keep.v; el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (e) { /* ignore */ } } }
  if (S.view === 'ai') { const log = $('#chat-log'); if (log) log.scrollTop = log.scrollHeight; }
}
function renderSync() {
  const el = $('#sync');
  const txt = S.mode === 'db' ? (S.dbError ? 'Sin conexión' : 'En vivo · sincronizado') : S.mode === 'local' ? 'Modo local' : 'Conectando…';
  el.innerHTML = `<span class="dot ${S.mode === 'db' && !S.dbError ? 'live' : ''}"></span><span>${txt}</span>`;
}
function renderBadges() {
  const m = metrics();
  const set = (k, n) => { const b = $(`[data-badge="${k}"]`); if (!b) return; b.hidden = !n; b.textContent = n; };
  set('inbox', m.unread.length);
  set('agenda', all('visits').filter((v) => v.date === iso(today()) && v.status !== 'cancelada' && v.status !== 'hecha').length);
  set('stock', m.low.length);
  set('money', m.overdue.length);
}
function go(view) {
  S.view = view; try { localStorage.setItem('pm-panel-view', view); } catch (e) { /* ignore */ }
  $('#app').classList.remove('nav-open'); window.scrollTo({ top: 0 });
  if (view === 'agenda') watchCalendar();
  render();
}

/* ================= Views ================= */
const VIEWS = {};

VIEWS.home = () => {
  const m = metrics(); const s = settings();
  const goal = +s.goal || 3000;
  const t = iso(today());
  const todays = all('visits').filter((v) => v.date === t).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  const hour = new Date().getHours();
  const hi = hour < 12 ? 'Bonjour' : hour < 18 ? 'Bon après-midi' : 'Bonsoir';
  const pct = Math.min(100, Math.round((m.paidMonth / goal) * 100));
  const thr = +s.threshold || 30000; const tp = Math.min(100, Math.round((m.rolling / thr) * 100));
  const thrCls = tp >= 90 ? 'bad' : tp >= 70 ? 'warn' : 'good';

  // channels, last 7 days
  const days = [...Array(7)].map((_, i) => iso(addDays(today(), i - 6)));
  const chans = ['whatsapp', 'llamada', 'correo', 'chat', 'web'].map((k) => {
    const msgs = all('inbox').filter((x) => x.channel === k);
    const per = days.map((d) => msgs.filter((x) => x.date && iso(new Date(x.date)) === d).length);
    const max = Math.max(1, ...per);
    return `<button class="chan" data-inbox-filter="${k}"><div class="t">${icon(CH[k][1])}${CH[k][0]}</div><div class="v">${per.reduce((a, b) => a + b, 0)}</div>
      <div class="spark">${per.map((n, i) => `<i class="${n ? '' : 'z'}" style="height:${Math.max(8, (n / max) * 100)}%" data-tip="<b>${n}</b> · ${fmtDay(days[i])}"></i>`).join('')}</div></button>`;
  }).join('');

  const feed = [
    ...all('inbox').map((x) => ({ t: x.date, ic: CH[x.channel] ? CH[x.channel][1] : 'chat', h: `<b>${esc(x.from || 'Contacto')}</b> · ${esc(CH[x.channel] ? CH[x.channel][0] : '')}`, s: x.subject || x.body, go: `data-open-msg="${x.id}"` })),
    ...all('invoices').filter((i) => i.status === 'pagada').map((i) => ({ t: (i.paidDate || i.date) + 'T12:00:00', ic: 'coins', h: `<b>${money(i.total)}</b> cobrados · ${esc(clientName(i.clientId))}`, s: i.number, go: 'data-view-go="money"' })),
    ...all('visits').filter((v) => v.status === 'hecha').map((v) => ({ t: v.date + 'T' + (v.time || '12:00') + ':00', ic: 'check', h: `Visita hecha · <b>${esc(clientName(v.clientId))}</b>`, s: SERVICES[v.service] || '', go: 'data-view-go="agenda"' })),
  ].filter((x) => x.t).sort((a, b) => String(b.t).localeCompare(String(a.t))).slice(0, 7);

  const tasks = all('tasks').sort((a, b) => (a.done - b.done) || String(a.due || '9').localeCompare(String(b.due || '9')));
  return `<div class="grid">
    <section class="hero">
      <div style="position:relative;z-index:1">
        <div class="eyebrow" style="color:#e5c46a">${hi}, ${esc(s.ownerName || 'Andrés')}</div>
        <h2>${todays.length ? `Hoy hay <em>${todays.length} ${todays.length === 1 ? 'visita' : 'visitas'}</em> en agenda.` : 'Hoy no hay <em>visitas</em> en agenda.'}</h2>
        <p>${m.unread.length ? `${m.unread.length} ${m.unread.length === 1 ? 'mensaje espera' : 'mensajes esperan'} respuesta` : 'Bandeja al día'}${m.overdue.length ? ` · ${m.overdue.length} ${m.overdue.length === 1 ? 'factura vencida' : 'facturas vencidas'}` : ''}${m.low.length ? ` · ${m.low.length} ${m.low.length === 1 ? 'insumo por reponer' : 'insumos por reponer'}` : ''}.</p>
      </div>
      <div class="hero-stats">
        <div class="hs"><b>${m.active.length}</b><span>clientes activos</span></div>
        <div class="hs"><b>${money(m.mrr)}</b><span>ingreso recurrente / mes</span></div>
        <div class="hs"><b>${m.weekVisits.length}</b><span>visitas esta semana</span></div>
      </div>
    </section>

    <div class="kpis">
      <div class="kpi" data-go="money"><div class="l">${icon('coins')}Cobrado este mes</div><div class="v">${money(m.paidMonth)}</div>
        <div class="meter" style="margin-top:6px"><i style="width:${pct}%"></i></div><div class="d">${pct} % de la meta de ${money(goal)}</div></div>
      <div class="kpi" data-go="money"><div class="l">${icon('receipt')}Por cobrar</div><div class="v">${money(m.owedSum)}</div><div class="d ${m.overdue.length ? 'bad' : ''}">${m.owed.length} facturas${m.overdue.length ? ` · ${m.overdue.length} vencidas` : ''}</div></div>
      <div class="kpi" data-go="inbox"><div class="l">${icon('inbox')}Sin responder</div><div class="v">${m.unread.length}</div><div class="d ${m.unread.length ? 'warn' : 'good'}">${m.unread.length ? 'responde en menos de 2 h' : 'todo respondido'}</div></div>
      <div class="kpi" data-go="stock"><div class="l">${icon('box')}Insumos bajos</div><div class="v">${m.low.length}</div><div class="d ${m.low.length ? 'warn' : 'good'}">${m.low.length ? esc(m.low.slice(0, 2).map((i) => i.name).join(', ')) : 'inventario en orden'}</div></div>
    </div>

    <section class="card">
      <div class="card-h"><h2>Canales</h2><span class="muted">mensajes y llamadas de los últimos 7 días</span></div>
      <div class="channels">${chans}</div>
    </section>

    <div class="cols-2">
      <section class="card">
        <div class="card-h"><h2>Hoy</h2><span class="muted">${fmtDay(t)}</span><div class="spacer"></div><button class="btn sm" data-new="visit">${icon('plus')}Visita</button></div>
        ${todays.length ? `<div class="rows">${todays.map(visitRow).join('')}</div>` : `<div class="empty"><b>Día libre</b>Programa una visita o aprovecha para prospectar.</div>`}
      </section>

function revenueChart(data, goal) {
  const W = 600, H = 220, pl = 46, pr = 10, pt = 22, pb = 28;
  const max = Math.max(goal, ...data.map((d) => d.v), 100) * 1.1;
  const step = max > 4000 ? 2000 : max > 2000 ? 1000 : 500;
  const y = (v) => pt + (H - pt - pb) * (1 - v / max);
  const bw = (W - pl - pr) / data.length; const w = Math.min(46, bw * 0.55);
  let grid = '';
  for (let v = 0; v <= max; v += step) grid += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis-t" x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000) + ' k' : v}</text>`;
  const bars = data.map((d, i) => {
    const x = pl + bw * i + (bw - w) / 2; const top = y(d.v); const h = Math.max(0, y(0) - top); const r = Math.min(4, h);
    const path = h > 0 ? `M${x} ${y(0)}V${top + r}Q${x} ${top} ${x + r} ${top}H${x + w - r}Q${x + w} ${top} ${x + w} ${top + r}V${y(0)}Z` : '';
    return `<g class="barg" data-tip="<b>${money(d.v)}</b> cobrados en ${d.label}${goal ? ` · meta ${money(goal)}` : ''}"><rect class="hit" x="${pl + bw * i}" y="${pt}" width="${bw}" height="${H - pt - pb}"/>${path ? `<path class="bar ${d.now ? 'now' : ''}" d="${path}"/>` : ''}
      ${d.now ? `<text class="val" x="${x + w / 2}" y="${top - 6}" text-anchor="middle">${money(d.v)}</text>` : ''}
      <text class="axis-t" x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${d.label}</text></g>`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos cobrados por mes">${grid}${bars}<line class="goal" x1="${pl}" x2="${W - pr}" y1="${y(goal)}" y2="${y(goal)}"/></svg>
    <div class="legend"><span><i></i>Meses anteriores</span><span><i class="now"></i>Mes actual</span><span><i class="goal"></i>Meta mensual ${money(goal)}</span></div></div>`;
}

function calendarBody() {
  const c = S.cal;
  if (!mcp) return '<div class="notice">' + icon('alert') + '<span>El calendario de Google se muestra cuando abres el panel desde claude.ai.</span></div>';
  if (c.state === 'loading' || c.state === 'idle') return '<div class="skel" style="height:60px"></div>';
  if (c.state === 'error') {
    const msg = {
      needs_reauth: 'Reconecta Google Calendar en claude.ai → Configuración → Conectores.',
      server_not_connected: 'Agrega Google Calendar en claude.ai → Configuración → Conectores.',
      selection_required: 'Elige qué cuenta de Google Calendar usar cuando claude.ai te lo pregunte.',
      not_in_manifest: 'No diste permiso para leer tu calendario en este panel. Recarga la página para que te lo vuelva a pedir.',
      blocked_by_policy: 'Tu organización no permite usar Google Calendar aquí.',
    }[c.code] || 'Google Calendar no respondió. Prueba con « Actualizar » en un momento.';
    return `<div class="notice">${icon('alert')}<span>${esc(msg)}</span></div>`;
  }
  const evs = c.events || [];
  if (!evs.length) return '<div class="empty">No tienes eventos en Google Calendar esta semana.</div>';
  return `<div>${evs.map((e) => {
    const st = (e.start && (e.start.dateTime || e.start.date)) || '';
    const allDay = e.start && !e.start.dateTime;
    const d = st.slice(0, 10); const hm = allDay ? 'Todo el día' : st.slice(11, 16);
    return `<div class="gev"><span class="muted">${fmtDay(d)} · ${esc(hm)}</span><span><b>${esc(e.summary || '(sin título)')}</b>${e.location ? ` <span class="muted">· ${esc(e.location)}</span>` : ''}</span>${e.htmlLink ? `<a href="${esc(e.htmlLink)}" target="_blank" rel="noopener">Abrir ↗</a>` : '<span></span>'}</div>`;
  }).join('')}</div>`;
}
function watchCalendar(force) {
  if (!mcp) return;
  if (calUnsub) { calUnsub(); calUnsub = null; }
  const ws = weekStart(S.week); const we = addDays(ws, 7);
  const fmt = (d) => `${iso(d)}T00:00:00`;
  S.cal = { state: 'loading' };
  const input = { startTime: fmt(ws) + tzOffset(ws), endTime: fmt(we) + tzOffset(we), orderBy: 'startTime', pageSize: 50, timeZone: 'America/Toronto' };
  if (force) { try { mcp.invalidate('Google Calendar', 'list_events', input).catch(() => {}); } catch (e) { /* ignore */ } }
  calUnsub = mcp.watchTool('Google Calendar', 'list_events', input, (ev) => {
    if (ev.type === 'data') {
      const p = ev.result && ev.result.payload;
      S.cal = { state: 'ok', events: (p && Array.isArray(p.events)) ? p.events.filter((e) => e.status !== 'cancelled') : [] };
    } else {
      const code = ev.error && ev.error.code;
      const denial = ['needs_reauth', 'server_not_connected', 'blocked_by_policy', 'approval_required', 'not_in_manifest', 'selection_required'].includes(code);
      if (denial || S.cal.state !== 'ok') S.cal = { state: 'error', code };
    }
    if (S.view === 'agenda') schedule();
  }, { refetchInterval: 300000 });
}
function tzOffset(d) { const o = -d.getTimezoneOffset(); const s = o >= 0 ? '+' : '-'; const a = Math.abs(o); return `${s}${String(Math.floor(a / 60)).padStart(2, '0')}:${String(a % 60).padStart(2, '0')}`; }

function md(s) {
  const lines = esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n');
  let out = '', inList = false;
  lines.forEach((l) => {
    const li = /^\s*(?:[-•*]|\d+\.)\s+(.*)/.exec(l);
    if (li) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${li[1]}</li>`; return; }
    if (inList) { out += '</ul>'; inList = false; }
    if (l.trim().startsWith('### ') || l.trim().startsWith('## ')) out += `<p><b>${l.replace(/^\s*#+\s*/, '')}</b></p>`;
    else if (l.trim()) out += `<p>${l}</p>`;
  });
  return out + (inList ? '</ul>' : '');
}

    cl.use('downloads').then((x) => { downloads = x; }).catch(() => {});
    cl.use('mcp').then((m) => { mcp = m; if (S.view === 'agenda') watchCalendar(); schedule(); }).catch(() => {});
    db = await cl.use('db').catch(() => null);
  }
  if (db) { S.mode = 'db'; subscribe(); }
  else { S.mode = 'local'; loadLocal(); }
  if (S.view === 'agenda') watchCalendar();
  render();
}
boot();
})();
</script>
